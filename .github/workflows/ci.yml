name: Salts CI
'on':
  # The unified 2.3 review needs two independent CI qualifications on the
  # *same* immutable source commit: full [2.3-VERIFY] and selected [2.3-SAN].
  # Title edits opt in to the latter without creating a new source SHA; the
  # release candidate workflow remains a separate publication gate.
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - master
      - release/salts-2.3-ace-cnet-review
    # A newly created version tag drives qualification AND publication.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Build SDKs for qualification only; release publication is tag-driven
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: salts-ci-${{ inputs.prepare_release && github.run_id || github.event.pull_request.number || github.ref }}
  # Never cancel immutable tag release CI when other branches advance.
  cancel-in-progress: ${{ !inputs.prepare_release && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      builds: ${{ steps.select.outputs.builds }}
      has_builds: ${{ steps.select.outputs.has_builds }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CFlow test-only scope routing
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./cmake/ci/tests/test-cflow-test-scope.ps1
      - name: Classify changes
        id: select
        shell: pwsh
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          PREPARE_RELEASE: ${{ inputs.prepare_release || false }}
          RC_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' }}
          # Temporary full-host qualification mode for the long-lived ACE PR.
          # This is not SDK packaging, benchmark work or release publication.
          ACE_MATRIX: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[ACE-MATRIX]') }}
          ACE_SAN: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[ACE-SAN]') }}
          # #1081: only the unified 2.3 review PR may opt in to exact-head
          # ASan+UBSan/TSan. This cannot tag/merge or publish a stable SDK.
          UNIFIED_SAN: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[2.3-SAN]')) || (github.event_name == 'push' && (github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' || startsWith(github.ref, 'refs/tags/v'))) }}
        run: ./cmake/ci/select-ci-scope.ps1 -EventName $env:CI_EVENT -BaseRef $env:CI_BASE -HeadRef $env:CI_HEAD -HeadBranch $env:CI_BRANCH -PrepareRelease ($env:PREPARE_RELEASE -eq "true") -AceMatrix ($env:ACE_MATRIX -eq "true") -AceSan ($env:ACE_SAN -eq "true") -UnifiedSan ($env:UNIFIED_SAN -eq "true")
      - name: Read package version
        shell: pwsh
        id: version
        env:
          RC_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' }}
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $packageVersion = $manifest.'version-semver'
          if ($env:RELEASE_TAG -ne '') {
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$') {
              throw "Unsupported release tag: $env:RELEASE_TAG"
            }
            $tagVersion = $env:RELEASE_TAG.Substring(1)
            if ($tagVersion.Split('-')[0] -ne $packageVersion) {
              throw "Tag $env:RELEASE_TAG must match vcpkg version $packageVersion"
            }
            $cmakeVersion = [regex]::Match((Get-Content CMakeLists.txt -Raw),
              '(?m)^\s*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
            if ($cmakeVersion -ne $packageVersion) { throw "CMake/vcpkg version mismatch" }
            $packageVersion = $tagVersion
          } elseif ($env:RC_BRANCH_PUSH -eq 'true') {
            $channel = (Get-Content cmake/ci/rc-channel.txt -Raw).Trim()
            if ($channel -notmatch '^rc\.[1-9][0-9]*$') { throw "Invalid release candidate channel: $channel" }
            $packageVersion = "$packageVersion-$channel"
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
  native:
    needs: scope
    if: needs.scope.outputs.has_builds == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      builds: ${{ needs.scope.outputs.builds }}
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
  formal:
    needs: scope
    if: fromJSON(needs.scope.outputs.checks).lean == 'true'
    uses: ./.github/workflows/cmeta-cflow-calculus.yml
    with:
      scope: ${{ needs.scope.outputs.checks }}
    secrets: inherit
  benchmarks:
    needs:
      - scope
      - native
    if: fromJSON(needs.scope.outputs.checks).work == 'true'
    uses: ./.github/workflows/native-io-benchmarks.yml
    with:
      scope: ${{ needs.scope.outputs.checks }}
    secrets: inherit
  package:
    needs:
      - scope
      - native
    if: (github.event_name == 'workflow_dispatch' && inputs.prepare_release) || (github.event_name == 'push' && (github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' || startsWith(github.ref, 'refs/tags/v')))
    uses: ./.github/workflows/sdk-package.yml
    with:
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
  result:
    name: CI result
    needs:
      - scope
      - native
      - formal
      - benchmarks
      - package
      - servicehost_sdk_abi_probe
      - servicehost_sdk_abi_consistency
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$SCOPE_RESULT" = success
          case ",$SELECTED_RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac

  servicehost_sdk_abi_probe:
    name: ServiceHost installed ABI / ${{ matrix.rid }}
    needs: [scope, native]
    if: ${{ needs.native.result == 'success' && ((github.event_name == 'pull_request' && github.head_ref == 'review/servicehost-release-tag-gate') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.prepare_release)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: linux-x64, runner: ubuntu-24.04, artifact: salts-sdk-linux-x64, native: true}
          - {rid: linux-arm64, runner: ubuntu-24.04-arm, artifact: salts-sdk-linux-arm64, native: true}
          - {rid: windows-x64, runner: windows-2025, artifact: salts-sdk-windows-x64, native: true}
          - {rid: macos-arm64, runner: macos-15, artifact: salts-sdk-macos, native: true}
          - {rid: android-arm64-v8a, runner: ubuntu-24.04, artifact: salts-sdk-android-arm64-v8a, native: false}
          - {rid: ios-arm64, runner: macos-15, artifact: salts-sdk-ios-arm64, native: false}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/sdk
      - name: Assert genuine installed SDK ABI export
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "stage/sdk/${{ matrix.rid }}"
          $targets = Join-Path $root "lib/cmake/Salts/SaltsTargets.cmake"
          $header = Join-Path $root "include/salts/component_runtime_abi.h"
          foreach ($file in @($targets, $header,
              (Join-Path $root "include/salts/configurator.h"),
              (Join-Path $root "include/salts/service_host.h"),
              (Join-Path $root "lib/cmake/Salts/SaltsConfig.cmake"))) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing genuine installed ABI file: $file" }
          }
          $contents = Get-Content -LiteralPath $targets -Raw
          foreach ($name in @("Salts::Configurator", "Salts::ServiceHost", "Salts::ComponentProviderABI")) {
            if (-not $contents.Contains($name)) { throw "Missing real exported CMake target $name" }
          }
          if ($contents.Contains("Salts::ConfiguratorCandidate") -or
              $contents.Contains("Salts::ServiceHostCandidate") -or
              ($contents -match 'add_library\(Salts::Component(Plugin)?\s') -or
              $contents.Contains("Salts::ComponentPluginABI")) {
            throw "Legacy or private Component runtime target leaked into installed SDK"
          }
          foreach ($oldHeader in @("component.h", "component_plugin.h", "component_plugin_abi.h")) {
            if (Test-Path -LiteralPath (Join-Path $root "include/salts/$oldHeader")) {
              throw "Legacy Component runtime/header leaked into installed SDK: $oldHeader"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root "include/salts/component_provider_abi.h"))) {
            throw "Missing canonical ComponentProviderABI header"
          }
          if ((Get-Content -LiteralPath $header -Raw) -notmatch 'SALTS_COMPONENT_RUNTIME_ABI_VERSION 0x00010000u') {
            throw "Wrong component runtime ABI epoch in ${{ matrix.rid }}"
          }
      - name: Configure external C11/C++17 installed consumer (Unix hosts)
        if: matrix.native && matrix.rid != 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S component-runtime/sdk-probe -B build/servicehost-sdk-abi-consumer -DCMAKE_BUILD_TYPE=Release -DSALTS_INSTALLED_ROOT="$GITHUB_WORKSPACE/stage/sdk/${{ matrix.rid }}"
          cmake --build build/servicehost-sdk-abi-consumer --config Release --parallel 2
          ctest --test-dir build/servicehost-sdk-abi-consumer -C Release --output-on-failure --no-tests=error
      - name: Configure external Windows consumer with the installed MSVC toolset
        if: matrix.rid == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw 'Missing MSVC C11/C++17 toolchain' }
          $sdkRoot = Join-Path $env:GITHUB_WORKSPACE 'stage/sdk/windows-x64'
          $cmd = 'call "' + $vsInstall + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul && ' +
            'cmake -S component-runtime/sdk-probe -B build/servicehost-sdk-abi-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DSALTS_INSTALLED_ROOT="' + $sdkRoot + '" && ' +
            'cmake --build build/servicehost-sdk-abi-consumer --parallel 2 && ' +
            'ctest --test-dir build/servicehost-sdk-abi-consumer --output-on-failure --no-tests=error'
          & cmd /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Installed MSVC consumer failed ($LASTEXITCODE)" }
      - name: Configure and link Android arm64 installed consumer
        if: matrix.rid == 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          cmake -S component-runtime/sdk-probe -B build/servicehost-sdk-abi-consumer \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DSALTS_INSTALLED_ROOT="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake --build build/servicehost-sdk-abi-consumer --parallel 2
      - name: Configure and link iOS arm64 installed consumer
        if: matrix.rid == 'ios-arm64'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S component-runtime/sdk-probe -B build/servicehost-sdk-abi-consumer \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DSALTS_INSTALLED_ROOT="$GITHUB_WORKSPACE/stage/sdk/ios-arm64"
          cmake --build build/servicehost-sdk-abi-consumer --parallel 2

  servicehost_sdk_abi_consistency:
    name: Six-RID ServiceHost ABI identity
    needs: servicehost_sdk_abi_probe
    if: ${{ needs.servicehost_sdk_abi_probe.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: salts-sdk-*
          path: stage/sdk
          merge-multiple: true
      - name: Compare exact source, six ABI headers and exported names
        shell: bash
        env:
          ABI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ABI_EXPECTED_HEAD"
          header_digest=''
          for rid in linux-x64 linux-arm64 windows-x64 macos-arm64 android-arm64-v8a ios-arm64; do
            root="stage/sdk/$rid"
            header="$root/include/salts/component_runtime_abi.h"
            targets="$root/lib/cmake/Salts/SaltsTargets.cmake"
            manifest="$root/salts-sdk-manifest.txt"
            test -f "$header" && test -f "$targets" && test -f "$manifest"
            grep -Fq 'Salts::Configurator' "$targets"
            grep -Fq 'Salts::ServiceHost' "$targets"
            grep -Fq 'Salts::ComponentProviderABI' "$targets"
            ! grep -Eq 'add_library\(Salts::Component(Plugin)? ' "$targets"
            ! grep -Fq 'Salts::ComponentPluginABI' "$targets"
            test -f "$root/include/salts/component_provider_abi.h"
            test ! -e "$root/include/salts/component_plugin.h"
            test ! -e "$root/include/salts/component.h"
            test ! -e "$root/include/salts/component_plugin_abi.h"
            ! grep -Eq 'Salts::(ConfiguratorCandidate|ServiceHostCandidate)' "$targets"
            test "$(sed -n 's/^commit=//p' "$manifest" | tr -d '\r')" = "$ABI_EXPECTED_HEAD"
            digest="$(sha256sum "$header" | cut -d ' ' -f1)"
            test -n "$digest"
            if [ -n "$header_digest" ]; then
              test "$digest" = "$header_digest" || { echo "ABI header mismatch: $rid" >&2; exit 1; }
            else
              header_digest="$digest"
            fi
            printf '%s: source=%s abi_header=%s\n' "$rid" "$ABI_EXPECTED_HEAD" "$digest"
          done
          echo 'All six genuine installed ABI headers and export manifests match one immutable HEAD.'

  publish:
    name: Publish tagged Salts.Native SDK
    needs: [scope, native, formal, benchmarks, package, result, servicehost_sdk_abi_probe, servicehost_sdk_abi_consistency]
    if: ${{ github.repository == 'qigao/salts' && startsWith(github.ref, 'refs/tags/v') && needs.result.result == 'success' && needs.native.result == 'success' && needs.formal.result == 'success' && needs.benchmarks.result == 'success' && needs.package.result == 'success' && needs.servicehost_sdk_abi_probe.result == 'success' && needs.servicehost_sdk_abi_consistency.result == 'success' }}
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/native-sdk-rc-release.yml
    with:
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
