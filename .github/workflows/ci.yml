name: Salts CI
'on':
  # The unified 2.3 review needs two independent CI qualifications on the
  # *same* immutable source commit: full [2.3-VERIFY] and selected [2.3-SAN].
  # Title edits opt in to the latter without creating a new source SHA; the
  # release candidate workflow remains a separate publication gate.
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - master
      - release/salts-2.3-ace-cnet-review
    # A newly created version tag drives qualification AND publication.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Build SDKs for qualification only; release publication is tag-driven
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: salts-ci-${{ inputs.prepare_release && github.run_id || github.event.pull_request.number || github.ref }}
  # Never cancel immutable tag release CI when other branches advance.
  cancel-in-progress: ${{ !inputs.prepare_release && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      builds: ${{ steps.select.outputs.builds }}
      has_builds: ${{ steps.select.outputs.has_builds }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CFlow test-only scope routing
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./cmake/ci/tests/test-cflow-test-scope.ps1
      - name: Classify changes
        id: select
        shell: pwsh
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          PREPARE_RELEASE: ${{ inputs.prepare_release || false }}
          RC_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' }}
          # Temporary full-host qualification mode for the long-lived ACE PR.
          # This is not SDK packaging, benchmark work or release publication.
          ACE_MATRIX: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[ACE-MATRIX]') }}
          ACE_SAN: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[ACE-SAN]') }}
          # #1081: only the unified 2.3 review PR may opt in to exact-head
          # ASan+UBSan/TSan. This cannot tag/merge or publish a stable SDK.
          UNIFIED_SAN: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[2.3-SAN]')) || (github.event_name == 'push' && (github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' || startsWith(github.ref, 'refs/tags/v'))) }}
        run: ./cmake/ci/select-ci-scope.ps1 -EventName $env:CI_EVENT -BaseRef $env:CI_BASE -HeadRef $env:CI_HEAD -HeadBranch $env:CI_BRANCH -PrepareRelease ($env:PREPARE_RELEASE -eq "true") -AceMatrix ($env:ACE_MATRIX -eq "true") -AceSan ($env:ACE_SAN -eq "true") -UnifiedSan ($env:UNIFIED_SAN -eq "true")
      - name: Read package version
        shell: pwsh
        id: version
        env:
          RC_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' }}
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $packageVersion = $manifest.'version-semver'
          if ($env:RELEASE_TAG -ne '') {
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$') {
              throw "Unsupported release tag: $env:RELEASE_TAG"
            }
            $tagVersion = $env:RELEASE_TAG.Substring(1)
            if ($tagVersion.Split('-')[0] -ne $packageVersion) {
              throw "Tag $env:RELEASE_TAG must match vcpkg version $packageVersion"
            }
            $cmakeVersion = [regex]::Match((Get-Content CMakeLists.txt -Raw),
              '(?m)^\s*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
            if ($cmakeVersion -ne $packageVersion) { throw "CMake/vcpkg version mismatch" }
            $packageVersion = $tagVersion
          } elseif ($env:RC_BRANCH_PUSH -eq 'true') {
            $channel = (Get-Content cmake/ci/rc-channel.txt -Raw).Trim()
            if ($channel -notmatch '^rc\.[1-9][0-9]*$') { throw "Invalid release candidate channel: $channel" }
            $packageVersion = "$packageVersion-$channel"
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
  native:
    needs: scope
    if: needs.scope.outputs.has_builds == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      builds: ${{ needs.scope.outputs.builds }}
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
  formal:
    needs: scope
    if: fromJSON(needs.scope.outputs.checks).lean == 'true'
    uses: ./.github/workflows/cmeta-cflow-calculus.yml
    with:
      scope: ${{ needs.scope.outputs.checks }}
    secrets: inherit
  benchmarks:
    needs:
      - scope
      - native
    if: fromJSON(needs.scope.outputs.checks).work == 'true'
    uses: ./.github/workflows/native-io-benchmarks.yml
    with:
      scope: ${{ needs.scope.outputs.checks }}
    secrets: inherit
  package:
    needs:
      - scope
      - native
    # QA-only exact branch, no tag and no publication. Never merge this override.
    if: (github.event_name == 'workflow_dispatch' && inputs.prepare_release) || (github.event_name == 'push' && (github.ref == 'refs/heads/release/salts-2.3-ace-cnet-review' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.repository == 'qigao/salts' && github.head_ref == 'qa/unicode17-mainline-six-rid-6d6fd38')
    uses: ./.github/workflows/sdk-package.yml
    with:
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
  result:
    name: CI result
    needs:
      - scope
      - native
      - formal
      - benchmarks
      - package
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$SCOPE_RESULT" = success
          case ",$SELECTED_RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac

  publish:
    name: Publish tagged Salts.Native SDK
    needs: [scope, native, formal, benchmarks, package, result]
    if: ${{ github.repository == 'qigao/salts' && startsWith(github.ref, 'refs/tags/v') && needs.result.result == 'success' && needs.native.result == 'success' && needs.formal.result == 'success' && needs.benchmarks.result == 'success' && needs.package.result == 'success' }}
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/native-sdk-rc-release.yml
    with:
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
