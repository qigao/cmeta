name: Prepare release package
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  pack:
    name: Pack Salts.Native
    runs-on: ubuntu-24.04
    # Pull-request github.sha is a synthetic merge commit. The SDK archives
    # are built from the real PR HEAD. Keep checkout, manifests and NuGet's
    # repository commit attestation bound to the same immutable source SHA.
    # On tags/push/manual packaging, github.sha is already the source commit.
    env:
      SALTS_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SALTS_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: salts-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test "${#SALTS_SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SALTS_SOURCE_SHA"
          test -f package/sdk/linux-x64/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/linux-x64/include/cmeta/function.h
          test -f package/sdk/linux-x64/include/cflow/function_projection.h
          grep -F "Salts::CFlow" package/sdk/linux-x64/lib/cmake/Salts/SaltsTargets.cmake
          test -f package/sdk/linux-x64/include/cmeta/interface.h
          test -f package/sdk/linux-x64/include/tinytest/detail/equality.h
          test -f package/sdk/linux-x64/include/tinymock.h
          test -f package/sdk/linux-arm64/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/linux-arm64/lib/cmake/Salts/SaltsTargets.cmake
          test -f package/sdk/linux-arm64/include/cmeta/function.h
          test -f package/sdk/linux-arm64/include/cflow/function_projection.h
          test -f package/sdk/linux-arm64/include/cmeta/interface.h
          test -f package/sdk/linux-arm64/include/tinytest/detail/equality.h
          grep -F "Salts::CMeta" package/sdk/linux-arm64/lib/cmake/Salts/SaltsTargets.cmake
          grep -F "Salts::CFlow" package/sdk/linux-arm64/lib/cmake/Salts/SaltsTargets.cmake
          grep -F "Salts::CNet" package/sdk/linux-arm64/lib/cmake/Salts/SaltsTargets.cmake
          test -f package/sdk/windows-x64/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/windows-x64/include/cmeta/function.h
          test -f package/sdk/windows-x64/include/cflow/function_projection.h
          test -f package/sdk/windows-x64/include/cmeta/interface.h
          test -f package/sdk/windows-x64/bin/cnet.dll
          test -f package/sdk/windows-x64/bin/salts.dll
          test ! -f package/sdk/windows-x64/bin/ssl.dll
          test ! -f package/sdk/windows-x64/bin/crypto.dll
          test ! -f package/sdk/windows-x64/bin/gmssl.dll
          test -f package/sdk/android-arm64-v8a/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/android-arm64-v8a/include/cmeta/function.h
          test -f package/sdk/android-arm64-v8a/include/cflow/function_projection.h
          test -f package/sdk/android-arm64-v8a/include/cmeta/interface.h
          test -f package/sdk/ios-arm64/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/ios-arm64/include/cmeta/function.h
          test -f package/sdk/ios-arm64/include/cflow/function_projection.h
          grep -F "cmeta_function_abi_desc" package/sdk/linux-x64/include/cmeta/function.h
          grep -F "cmeta_function_abi_desc" package/sdk/windows-x64/include/cmeta/function.h
          grep -F "cmeta_function_abi_desc" package/sdk/android-arm64-v8a/include/cmeta/function.h
          grep -F "cflow_function_typed_filter_projection_admit" package/sdk/linux-x64/include/cflow/function_projection.h
          grep -F "cflow_function_typed_filter_projection_admit" package/sdk/windows-x64/include/cflow/function_projection.h
          grep -F "cflow_function_typed_filter_projection_admit" package/sdk/android-arm64-v8a/include/cflow/function_projection.h
          mac_header="$(find package/sdk -path '*/include/cmeta/function.h' -path '*macos-*' -print -quit)"
          mac_projection="$(find package/sdk -path '*/include/cflow/function_projection.h' -path '*macos-*' -print -quit)"
          mac_interface="$(find package/sdk -path '*/include/cmeta/interface.h' -path '*macos-*' -print -quit)"
          test -n "$mac_header"
          test -n "$mac_projection"
          test -n "$mac_interface"
          grep -F "cmeta_interface_desc_valid" package/sdk/linux-x64/include/cmeta/interface.h
          grep -F "cmeta_interface_desc_equal" package/sdk/linux-x64/include/cmeta/interface.h
          grep -F "cmeta_interface_desc_valid" package/sdk/windows-x64/include/cmeta/interface.h
          grep -F "cmeta_interface_desc_equal" package/sdk/windows-x64/include/cmeta/interface.h
          grep -F "cmeta_interface_desc_valid" package/sdk/android-arm64-v8a/include/cmeta/interface.h
          grep -F "cmeta_interface_desc_equal" package/sdk/android-arm64-v8a/include/cmeta/interface.h
          grep -F "cmeta_interface_desc_valid" "$mac_interface"
          grep -F "cmeta_interface_desc_equal" "$mac_interface"
          grep -F "cmeta_function_abi_desc" "$mac_header"
          grep -F "cflow_function_typed_filter_projection_admit" "$mac_projection"
          # All six candidate SDKs must publish one byte-identical
          # Unicode ABI header with BOTH additive symbols. A target name
          # alone cannot prove either public C11 declaration is packaged.
          unicode_header_sha=''
          for rid in linux-x64 linux-arm64 windows-x64 macos-arm64 android-arm64-v8a ios-arm64; do
            header="package/sdk/$rid/include/unicode/salts_unicode.h"
            test -f "$header"
            test -f "package/sdk/$rid/include/unicode/salts_unicode_normalize.h"
            test -f "package/sdk/$rid/include/idna/salts_idna.h"
            grep -Fq "Salts::Unicode" "package/sdk/$rid/lib/cmake/Salts/SaltsTargets.cmake"
            grep -Fq 'salts_unicode_is_punctuation_or_symbol(' "$header"
            grep -Fq 'salts_unicode_case_fold(' "$header"
            grep -Fq 'SALTS_UNICODE_ERR_CAPACITY = -4' "$header"
            test "$(grep -Fc 'salts_unicode_is_punctuation_or_symbol(' "$header")" -eq 1
            test "$(grep -Fc 'salts_unicode_case_fold(' "$header")" -eq 1
            current_sha="$(sha256sum "$header" | cut -d ' ' -f1)"
            test -n "$current_sha"
            if [ -z "$unicode_header_sha" ]; then
              unicode_header_sha="$current_sha"
            elif [ "$current_sha" != "$unicode_header_sha" ]; then
              printf 'Mismatched installed Unicode public ABI: %s has %s vs %s\n' \
                "$rid" "$current_sha" "$unicode_header_sha" >&2
              exit 1
            fi
            printf '%s Unicode header SHA-256: %s\n' "$rid" "$current_sha"
          done
          # CNet's 2.3 additive ABI must be present in each shipped RID.
          for rid in linux-x64 linux-arm64 windows-x64 macos-arm64 android-arm64-v8a ios-arm64; do
            header="package/sdk/$rid/include/cnet/cnet.h"
            name_header="package/sdk/$rid/include/cnet/name_lookup.h"
            test -f "$header"
            test -f "$name_header"
            grep -Fq "cnet_connection_preserve_send_on_eof" "$header"
            grep -Fq "CNET_DATAGRAM_SOCKET_CONTROL_VERSION" "$header"
            grep -Fq "cnet_name_lookup_normalize" "$name_header"
            grep -Fq "CNET_NAME_LOOKUP_API_VERSION" "$name_header"
          done
          # The canonical native runtime is a release contract, not merely a
          # source-tree target. Require its headers, imported CMake names and
          # actual static archives in every staged RID before packing NuGet.
          service_host_abi_sha=''
          for rid in linux-x64 linux-arm64 windows-x64 macos-arm64 android-arm64-v8a ios-arm64; do
            root="package/sdk/$rid"
            targets="$root/lib/cmake/Salts/SaltsTargets.cmake"
            test -f "$root/include/salts/configurator.h"
            test -f "$root/include/salts/service_host.h"
            abi_header="$root/include/salts/component_runtime_abi.h"
            provider_header="$root/include/salts/component_provider_abi.h"
            test -f "$abi_header"
            test -f "$provider_header"
            test -f "$targets"
            grep -Fq 'SALTS_COMPONENT_RUNTIME_ABI_VERSION 0x00010000u' "$abi_header"
            for target in Salts::Configurator Salts::ServiceHost Salts::ComponentProviderABI Salts::PluginABI; do
              grep -Fq "$target" "$targets"
            done
            if grep -Eq 'add_library\(Salts::Component(Plugin)? ' "$targets" ||
               grep -Fq 'Salts::ComponentPluginABI' "$targets"; then
              echo "Retired Component runtime target leaked into $rid SDK" >&2
              exit 1
            fi
            test ! -e "$root/include/salts/component.h"
            test ! -e "$root/include/salts/component_plugin.h"
            test ! -e "$root/include/salts/component_plugin_abi.h"
            if [ "$rid" = windows-x64 ]; then
              test -f "$root/lib/salts_configurator.lib"
              test -f "$root/lib/salts_service_host.lib"
            else
              test -f "$root/lib/libsalts_configurator.a"
              test -f "$root/lib/libsalts_service_host.a"
            fi
            current_sha="$(sha256sum "$abi_header" | cut -d ' ' -f1)"
            if [ -z "$service_host_abi_sha" ]; then
              service_host_abi_sha="$current_sha"
            elif [ "$current_sha" != "$service_host_abi_sha" ]; then
              echo "Mismatched ServiceHost ABI header in $rid SDK" >&2
              exit 1
            fi
            printf '%s ServiceHost ABI header SHA-256: %s\n' "$rid" "$current_sha"
          done
          test "$(find package/sdk -maxdepth 2 -name salts-sdk-manifest.txt | wc -l)" -eq 6

          mapfile -t cache_contracts < <(
            grep -h '^vcpkg_cache_contract=' package/sdk/*/salts-sdk-manifest.txt |
              tr -d '\r' |
              sort -u
          )
          mapfile -t cache_revisions < <(
            grep -h '^vcpkg_cache_revision=' package/sdk/*/salts-sdk-manifest.txt |
              tr -d '\r' |
              sort -u
          )

          printf 'vcpkg cache contracts (%d):\n' "${#cache_contracts[@]}"
          printf '  %s\n' "${cache_contracts[@]}"
          printf 'vcpkg cache revisions (%d):\n' "${#cache_revisions[@]}"
          printf '  %s\n' "${cache_revisions[@]}"

          test "${#cache_contracts[@]}" -eq 1
          test "${#cache_revisions[@]}" -ge 1
          while IFS= read -r manifest; do
            test "$(grep -c '^commit=' "$manifest")" -eq 1
            source_commit="$(sed -n 's/^commit=//p' "$manifest" | tr -d '\r')"
            if [ "$source_commit" != "$SALTS_SOURCE_SHA" ]; then
              printf 'SDK source mismatch: %s records %s, expected %s\n' \
                "$manifest" "$source_commit" "$SALTS_SOURCE_SHA" >&2
              exit 1
            fi
            test "$(grep -c '^vcpkg_cache_revision=' "$manifest")" -eq 1
            revision="$(sed -n 's/^vcpkg_cache_revision=//p' "$manifest" | tr -d '\r')"
            test -n "$revision"
            printf '%s -> vcpkg_cache_revision=%s\n' "$manifest" "$revision"
          done < <(find package/sdk -maxdepth 2 -name salts-sdk-manifest.txt -print | sort)
          find package/sdk -maxdepth 2 -name salts-sdk-manifest.txt -print
          du -sh package/sdk
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Create NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack packaging/nuget/Salts.Native.csproj --configuration Release --output dist -p:PackageVersion=${{ inputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package" -p:RepositoryCommit="$SALTS_SOURCE_SHA"
          test -f "dist/Salts.Native.${{ inputs.version }}.nupkg"

          # Qualify the package that will actually be handed to consumers. The
          # staged tree check above cannot detect pack-layout omissions.
          python3 - "dist/Salts.Native.${{ inputs.version }}.nupkg" "${{ inputs.version }}" "$SALTS_SOURCE_SHA" <<'PY'
          import hashlib, re, sys, zipfile
          package_path, version, source_sha = sys.argv[1:]
          rids = (
              'linux-x64', 'linux-arm64', 'windows-x64', 'macos-arm64',
              'android-arm64-v8a', 'ios-arm64',
          )
          abi_digest = None
          with zipfile.ZipFile(package_path) as package:
              names = set(package.namelist())
              expected_manifests = {
                  f'sdk/{rid}/salts-sdk-manifest.txt' for rid in rids
              }
              manifests = {name for name in names
                           if name.endswith('/salts-sdk-manifest.txt')}
              if manifests != expected_manifests:
                  raise SystemExit(
                      f'Incorrect packaged SDK RID set: {manifests ^ expected_manifests}'
                  )
              for rid in rids:
                  root = f'sdk/{rid}/'
                  manifest_path = root + 'salts-sdk-manifest.txt'
                  fields = {}
                  for line in package.read(manifest_path).decode('utf-8-sig').splitlines():
                      if '=' in line:
                          key, value = line.split('=', 1)
                          fields.setdefault(key, []).append(value)
                  for key, expected in (
                      ('version', version), ('commit', source_sha), ('profile', 'release')
                  ):
                      values = fields.get(key, [])
                      if values != [expected]:
                          raise SystemExit(
                              f'{manifest_path}: {key} values {values!r}, expected exactly [{expected!r}]'
                          )
                  for header in (
                      'salts/configurator.h', 'salts/service_host.h',
                      'salts/component_abi.h', 'salts/component_provider_abi.h',
                      'salts/component_runtime_abi.h', 'salts/plugin.h',
                      'salts/plugin_decl.h', 'salts/thread.h',
                      'cmeta/component.h', 'cmeta/function.h',
                  ):
                      item = root + 'include/' + header
                      if item not in names:
                          raise SystemExit(f'{rid}: missing packaged header {header}')
                  for retired_header in (
                      'salts/component.h', 'salts/component_plugin.h',
                      'salts/component_plugin_abi.h',
                  ):
                      if root + 'include/' + retired_header in names:
                          raise SystemExit(f'{rid}: retired runtime header was packaged: {retired_header}')
                  abi_path = root + 'include/salts/component_runtime_abi.h'
                  abi = package.read(abi_path)
                  if b'SALTS_COMPONENT_RUNTIME_ABI_VERSION 0x00010000u' not in abi:
                      raise SystemExit(f'{rid}: wrong packaged ServiceHost ABI epoch')
                  digest = hashlib.sha256(abi).hexdigest()
                  if abi_digest is None:
                      abi_digest = digest
                  elif digest != abi_digest:
                      raise SystemExit(f'{rid}: packaged ServiceHost ABI header differs')
                  cmake_root = root + 'lib/cmake/Salts/'
                  required_cmake_files = (
                      'SaltsConfig.cmake', 'SaltsConfigVersion.cmake',
                      'SaltsTargets.cmake', 'SaltsTargets-release.cmake',
                  )
                  for filename in required_cmake_files:
                      if cmake_root + filename not in names:
                          raise SystemExit(f'{rid}: missing packaged CMake file {filename}')
                  targets_path = cmake_root + 'SaltsTargets.cmake'
                  release_path = cmake_root + 'SaltsTargets-release.cmake'
                  targets = package.read(targets_path).decode('utf-8', errors='strict')
                  release_targets = package.read(release_path).decode('utf-8', errors='strict')
                  active_targets = '\n'.join(
                      line for line in targets.splitlines()
                      if not line.lstrip().startswith('#')
                  )
                  required_targets = (
                      'Salts::Configurator', 'Salts::ServiceHost',
                      'Salts::ComponentABI', 'Salts::ComponentProviderABI',
                      'Salts::PluginABI', 'Salts::Plugin',
                      'Salts::Platform', 'Salts::CMeta', 'Salts::Core',
                  )
                  for target in required_targets:
                      target_definition = re.compile(
                          r'(?m)^\s*add_library\s*\(\s*' + re.escape(target) +
                          r'\s+[A-Z_]+\s+IMPORTED\b'
                      )
                      if target_definition.search(active_targets) is None:
                          raise SystemExit(f'{rid}: missing actual imported target {target}')
                  if (re.search(r'add_library\s*\(\s*Salts::Component(?:Plugin)?\s', active_targets)
                      or re.search(r'add_library\s*\(\s*Salts::ComponentPluginABI\s', active_targets)):
                      raise SystemExit(f'{rid}: retired runtime target was packaged')
                  # The release-specific import file names every linked archive/import library.
                  # Require each referenced binary to be present in this same RID payload.
                  imported_paths = re.findall(
                      r'IMPORTED_(?:IMPLIB|LOCATION)(?:_[A-Z0-9_]+)?\s+"?\$\{_IMPORT_PREFIX\}/([^"\s)]+)',
                      release_targets
                  )
                  for relative_path in imported_paths:
                      relative_path = relative_path.replace('\\', '/')
                      item = root + relative_path
                      if item not in names:
                          raise SystemExit(f'{rid}: imported target binary is missing: {relative_path}')
                  if rid == 'windows-x64':
                      libraries = ('lib/salts_configurator.lib', 'lib/salts_service_host.lib')
                  else:
                      libraries = ('lib/libsalts_configurator.a', 'lib/libsalts_service_host.a')
                  for library in libraries:
                      if root + library not in names:
                          raise SystemExit(f'{rid}: missing packaged runtime archive {library}')
          print('PASS final NuGet payload: six RIDs, one source SHA, canonical ServiceHost ABI')
          PY
          # Re-extract the Linux x64 SDK from the packed artifact and run the
          # actual out-of-tree consumer against those bytes, not the staging tree.
          nupkg_probe="$RUNNER_TEMP/salts-nupkg-consumer"
          rm -rf "$nupkg_probe"
          mkdir -p "$nupkg_probe/sdk/linux-x64"
          python3 - "dist/Salts.Native.${{ inputs.version }}.nupkg" "$nupkg_probe/sdk/linux-x64" <<'PY'
          import pathlib, sys, zipfile
          package_path, destination = sys.argv[1:]
          prefix = 'sdk/linux-x64/'
          root = pathlib.Path(destination)
          with zipfile.ZipFile(package_path) as package:
              for name in package.namelist():
                  if not name.startswith(prefix):
                      continue
                  relative = pathlib.PurePosixPath(name[len(prefix):])
                  if not relative.parts and name.endswith('/'):
                      continue
                  if not relative.parts or relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsafe SDK path in NuGet package: {name}')
                  target = root.joinpath(*relative.parts)
                  if name.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(package.read(name))
          PY
          cmake -S component-runtime/sdk-probe -B "$nupkg_probe/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSALTS_INSTALLED_ROOT="$nupkg_probe/sdk/linux-x64"
          cmake --build "$nupkg_probe/build" --parallel 2
          ctest --test-dir "$nupkg_probe/build" --no-tests=error --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: salts-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error
