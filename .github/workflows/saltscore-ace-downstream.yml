name: M6 SaltsCore installed CMeta ACE downstream

on:
  pull_request:
    paths:
      - "cmake/ci/saltscore-ace-smoke/**"
      - ".github/workflows/saltscore-ace-downstream.yml"
      - "cmeta/**"
      - "component/**"
      - "component-runtime/src/configurator*"
      - "component-runtime/include/salts/configurator.h"
      - "plugin/**"
      - "component-plugin/**"
      - "component-runtime/CMakeLists.txt"
      - "component-runtime/tests/service_host_generation_test.c"
      - "cflow/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ace-core-installed:
    name: ${{ matrix.os }} original CMeta ACE on installed Core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout original Salts sources
        uses: actions/checkout@v4
      - name: Checkout exact SaltsCore candidate
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-core
          ref: a43334721f61101381b9ce6c5a311b5be7851119
          path: saltscore-candidate
          persist-credentials: false
      - name: Build installed Core and run isolated original Salts consumers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C saltscore-candidate rev-parse HEAD)" = a43334721f61101381b9ce6c5a311b5be7851119
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
          else
            generator=(-G Ninja)
          fi
          prefix="$RUNNER_TEMP/saltscore-ace-sdk"
          cmake -S saltscore-candidate -B build-m6-core "${generator[@]}" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build build-m6-core --config Release --parallel 2
          cmake --install build-m6-core --config Release
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="$(cygpath -u "$prefix")/bin:$PATH"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            export DYLD_LIBRARY_PATH="$prefix/lib:${DYLD_LIBRARY_PATH:-}"
          else
            export LD_LIBRARY_PATH="$prefix/lib:${LD_LIBRARY_PATH:-}"
          fi
          cmake -S cmake/ci/saltscore-ace-smoke -B build-m6-ace \
            "${generator[@]}" "-DSALTS_SOURCE_ROOT=$GITHUB_WORKSPACE" \
            "-DCMAKE_PREFIX_PATH=$prefix" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-m6-ace --config Release --parallel 2
          ctest --test-dir build-m6-ace -C Release \
            --output-on-failure --no-tests=error
          test ! -e "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
      - name: Audit final installed ABI ownership and imports
        shell: bash
        run: |
          set -euo pipefail
          python3 cmake/ci/saltscore-ace-smoke/audit-owner.py \
            --prefix "$RUNNER_TEMP/saltscore-ace-sdk" \
            --build-dir build-m6-ace \
            --core-tools saltscore-candidate/tools \
            --report build-m6-ace/m6-abi-audit.json
      - name: Install extracted M6 package and qualify external C11/C++17 SDK
        shell: bash
        run: |
          set -euo pipefail
          m6_prefix="$RUNNER_TEMP/salts-m6-sdk"
          cmake --install build-m6-ace --config Release --prefix "$m6_prefix"
          test -f "$m6_prefix/lib/cmake/SaltsM6/SaltsM6Targets.cmake"
          test ! -e "$m6_prefix/lib/cmake/Salts/SaltsTargets.cmake"
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
            export PATH="$(cygpath -u "$m6_prefix")/bin:$(cygpath -u "$RUNNER_TEMP/saltscore-ace-sdk")/bin:$PATH"
          else
            generator=(-G Ninja)
          fi
          cmake -S cmake/ci/saltscore-ace-consumer -B build-m6-external \
            "${generator[@]}" -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$m6_prefix;$RUNNER_TEMP/saltscore-ace-sdk"
          cmake --build build-m6-external --config Release --parallel 2
          ctest --test-dir build-m6-external -C Release \
            --output-on-failure --no-tests=error
      - name: Relocate both installed SDKs and requalify external Provider DSO lifecycle
        shell: bash
        run: |
          set -euo pipefail
          old_core="$RUNNER_TEMP/saltscore-ace-sdk"
          old_m6="$RUNNER_TEMP/salts-m6-sdk"
          new_core="$RUNNER_TEMP/saltscore-ace-sdk-relocated"
          new_m6="$RUNNER_TEMP/salts-m6-sdk-relocated"
          test -d "$old_core" && test -d "$old_m6"
          test ! -e "$new_core" && test ! -e "$new_m6"
          mv "$old_core" "$new_core"
          mv "$old_m6" "$new_m6"
          test ! -e "$old_core" && test ! -e "$old_m6"
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
            export PATH="$(cygpath -u "$new_m6")/bin:$(cygpath -u "$new_core")/bin:$PATH"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            generator=(-G Ninja)
            export DYLD_LIBRARY_PATH="$new_core/lib:${DYLD_LIBRARY_PATH:-}"
          else
            generator=(-G Ninja)
            export LD_LIBRARY_PATH="$new_core/lib:${LD_LIBRARY_PATH:-}"
          fi
          cmake -S cmake/ci/saltscore-ace-consumer \
            -B build-m6-relocated "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$new_m6;$new_core"
          cmake --build build-m6-relocated --config Release --parallel 2
          ctest --test-dir build-m6-relocated -C Release \
            --output-on-failure --no-tests=error
          python3 cmake/ci/saltscore-ace-consumer/audit-relocated.py \
            --core-tools saltscore-candidate/tools \
            --core-prefix "$new_core" \
            --m6-prefix "$new_m6" \
            --build-dir build-m6-relocated \
            --report build-m6-relocated/abi-relocation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-abi-relocation-${{ matrix.os }}
          path: build-m6-relocated/abi-relocation.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-saltscore-ace-abi-${{ matrix.os }}
          path: build-m6-ace/m6-abi-audit.json
          if-no-files-found: ignore
