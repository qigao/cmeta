name: CNet mixed-curve SHA-512 X.509 oracle

on:
  pull_request:
    paths:
      - "cnet/tests/fixtures/sha512-mixed-*.pem"
      - "cnet/tests/fixtures/unsupported-p521-*.pem"
      - "cnet/tests/cnet_tls_test.c"
      - "cnet/tests/package_config/strategy/**"
      - "cnet/X509_COMPATIBILITY_MATRIX.md"
      - ".github/workflows/cnet-sha512-mixed-x509-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openssl-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent provider-negative ECDSA/SHA-512 fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixtures=cnet/tests/fixtures
          root="$fixtures/sha512-mixed-root-cert.pem"
          leaf="$fixtures/sha512-mixed-server-cert.pem"
          key="$fixtures/sha512-mixed-server-key.pem"
          p521_root="$fixtures/unsupported-p521-root-cert.pem"
          p521_leaf="$fixtures/unsupported-p521-server-cert.pem"

          openssl verify -x509_strict -purpose sslserver -verify_hostname localhost \
            -CAfile "$root" "$leaf"
          openssl verify -x509_strict -purpose sslserver -verify_ip 127.0.0.1 \
            -CAfile "$root" "$leaf"
          if openssl verify -x509_strict -purpose sslserver \
            -verify_hostname wrong.example -CAfile "$root" "$leaf"; then
            echo "mixed-curve fixture unexpectedly admits wrong.example" >&2
            exit 1
          fi

          root_text="$(openssl x509 -in "$root" -noout -text)"
          leaf_text="$(openssl x509 -in "$leaf" -noout -text)"
          grep -Fq 'ASN1 OID: secp384r1' <<<"$root_text"
          grep -Fq 'Signature Algorithm: ecdsa-with-SHA512' <<<"$root_text"
          grep -Fq 'ASN1 OID: prime256v1' <<<"$leaf_text"
          grep -Fq 'Signature Algorithm: ecdsa-with-SHA512' <<<"$leaf_text"

          openssl verify -x509_strict -purpose sslserver -verify_hostname localhost \
            -CAfile "$p521_root" "$p521_leaf"
          openssl x509 -in "$p521_root" -noout -text |
            grep -Fq 'ASN1 OID: secp521r1'

          openssl pkey -in "$key" -pubout -outform DER > server-key-public.der
          openssl x509 -in "$leaf" -pubkey -noout |
            openssl pkey -pubin -outform DER > server-cert-public.der
          cmp server-key-public.der server-cert-public.der
