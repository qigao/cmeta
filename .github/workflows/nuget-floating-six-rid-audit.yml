name: Salts.Native GitHub Packages 2.3.0-* floating six-RID admission

# Deliberately MANUAL and read-only until #1089 historic rc.sha cleanup
# succeeds. It is expected to fail while incomplete higher-ranked packages
# remain in GitHub Packages; it must not block unrelated PR source CI.
'on':
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  real-floating-feed:
    if: github.repository == 'qigao/salts' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exactly the audited Salts feed policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove no candidate workflow still pushes to shared feed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 packaging/nuget/feed_hygiene.py policy .

      - name: Resolve literal 2.3.0-* and download from GitHub Packages with curl
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/salts-literal-floating"
          archive="$probe/Salts.Native.floating.nupkg"
          version_file="$probe/resolved-version.txt"
          rm -rf "$probe"
          mkdir -p "$probe"
          python3 cmake/ci/github-packages.py floating \
            Salts.Native '2.3.0-*' "$archive" "$version_file"
          version="$(tr -d '\r\n' < "$version_file")"
          [[ "$version" =~ ^2[.]3[.]0-[0-9A-Za-z.-]+$ ]]
          package_root="$probe/salts.native/${version,,}"
          mkdir -p "$package_root"
          python3 cmake/ci/github-packages.py extract "$archive" "$package_root"
          sha256sum "$archive" > "$RUNNER_TEMP/salts-floating-package.sha256"
          cp "$version_file" "$RUNNER_TEMP/salts-floating-version.txt"
          {
            echo 'Floating requirement: 2.3.0-*'
            echo "GitHub Packages V3 selected: $version"
            echo 'Transport: curl only; no managed package restore.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require curl-resolved official six-RID source identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < "$RUNNER_TEMP/salts-floating-version.txt")"
          package_root="$RUNNER_TEMP/salts-literal-floating/salts.native/${version,,}"
          python3 packaging/nuget/feed_hygiene.py floating-package \
            "$version" "$package_root" \
            2>&1 | tee "$RUNNER_TEMP/salts-floating-inspection.txt"
          python3 packaging/nuget/feed_hygiene.py floating-package \
            "$version" "$package_root" \
            > "$RUNNER_TEMP/salts-floating-inspection.json"

      - name: Confirm resolved version is an immutable official Git tag/Release
        shell: bash
        run: |
          set -euo pipefail
          readarray -t details < <(python3 - "$RUNNER_TEMP/salts-floating-inspection.json" <<'PY'
          import json, sys
          x = json.load(open(sys.argv[1]))
          if x.get("status") != "PASS" or len(x.get("sdk_rids", [])) != 6:
              raise SystemExit("Only an admitted full six-RID resolution is acceptable")
          print(x["actual_resolved_version"])
          print(x["actual_source_commit"])
          PY
          )
          version="${details[0]}"
          source_sha="${details[1]}"
          [[ "$version" =~ ^2[.]3[.]0(-rc[.][1-9][0-9]*)?$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          tag="v$version"
          actual="$(gh api "repos/qigao/salts/commits/$tag" --jq '.sha')"
          test "$actual" = "$source_sha" || {
            echo "Official git tag commit $actual differs from extracted SDK $source_sha" >&2
            exit 1
          }
          gh release view "$tag" --repo qigao/salts --json assets \
            --jq '.assets[].name' | grep -Fx "Salts.Native.$version.nupkg"
          {
            echo "Restored, genuinely floated official NuGet: Salts.Native $version"
            echo "Confirmed tag: $tag"
            echo "Confirmed exact six-RID source SHA: $source_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exact floating resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salts-literal-floating-six-rid-feed-verification
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/salts-floating-version.txt
            ${{ runner.temp }}/salts-floating-package.sha256
            ${{ runner.temp }}/salts-floating-inspection.txt
            ${{ runner.temp }}/salts-floating-inspection.json
