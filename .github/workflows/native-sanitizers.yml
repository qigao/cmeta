name: Salts LLVM sanitizers

# Separate from the release graph because sanitizer instrumentation changes
# code generation. Instrument the sole CMeta 0.1 CMeta/ACE/CFlow owner
# with the sole pinned native SaltsCore 0.1 owner.
on:
  pull_request:
    paths:
      - "cmeta/include/**"
      - "cmeta/src/**"
      - "plugin/include/**"
      - "plugin/src/**"
      - "ace/include/**"
      - "ace/src/**"
      - "cflow/include/**"
      - "cflow/src/**"
      - "**/CMakeLists.txt"
      - "CMakeLists.txt"
      - "CMake*Presets.json"
      - "cmake/**"
      - "**/tests/**"
      - "tests/**"
      - "cstl/**"
      - "tools/**"
      - "packaging/**"
      - ".github/workflows/native-*.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/include/**"
      - "cmeta/src/**"
      - "plugin/include/**"
      - "plugin/src/**"
      - "ace/include/**"
      - "ace/src/**"
      - "cflow/include/**"
      - "cflow/src/**"
      - "**/CMakeLists.txt"
      - "CMakeLists.txt"
      - "CMake*Presets.json"
      - "cmake/**"
      - "**/tests/**"
      - "tests/**"
      - "cstl/**"
      - "tools/**"
      - "packaging/**"
      - ".github/workflows/native-*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read

jobs:
  native-sanitizers:
    name: CMeta 0.1 LLVM ${{ matrix.kind }} sole native owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CC: clang
      CXX: clang++
      VCPKG_DOWNLOADS: ${{ github.workspace }}/build/vcpkg-downloads
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 256MiB
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - kind: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts-core
          ref: 61d42472583e9923ca22ea2929c651b6a4c12450
          path: _core_owner
          persist-credentials: false
      - name: Select runner-native LLVM for non-published sanitizer builds
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@v0.1.5
        with:
          build-type: toolchain-only
          obfuscator: "false"
      - name: Prepare dependency download cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
      - name: Prepare curl-only tools for the normal Core dependency build
        id: vcpkg
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@v0.1.5
        with:
          mode: read
          restore-packages: "false"
          token: ${{ github.token }}
          manifest-root: _core_owner
          triplet: x64-linux
          host-triplet: x64-linux
      - name: Restore re2c and Unicode host data
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@v0.1.5
        with:
          token: ${{ github.token }}
      - uses: qigao/vcpkg-cache/.github/actions/setup-ccache@v0.1.5
        id: ccache
      - name: Prepare cache paths and runner identity
        id: cache-environment
        shell: pwsh
        run: |
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        id: dependency-cache
        with:
          path: |
            ${{ env.VCPKG_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-sanitizer-${{ matrix.kind }}-${{ env.VCPKG_CACHE_REVISION }}-${{ steps.cache-environment.outputs.image }}--${{ hashFiles('CMake*Presets.json', '_core_owner/vcpkg*.json', '_core_owner/CMake*Presets.json', '_core_owner/CMakeOptions.cmake', '.github/workflows/native-*.yml') }}
          restore-keys: |
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-sanitizer-${{ matrix.kind }}-${{ env.VCPKG_CACHE_REVISION }}-
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ steps.ccache.outputs.version }}-${{ steps.dependency-cache.outputs.cache-primary-key }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.ccache.outputs.version }}-${{ steps.dependency-cache.outputs.cache-primary-key }}-
      - name: Start compiler cache statistics
        id: cache-ready
        shell: bash
        run: |
          ccache --version
          ccache --zero-stats

      - name: Configure exact Core native owner with instrumentation
        shell: bash
        env:
          VCPKG_TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain_file }}
        run: |
          set -euo pipefail
          python3 tools/check_ace_only_sources.py --core-root _core_owner
          test "$(git -C _core_owner rev-parse HEAD)" = \
            61d42472583e9923ca22ea2929c651b6a4c12450
          prefix="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          cmake -S _core_owner -B build-instrumented-core-${{ matrix.kind }} \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_TOOLCHAIN" \
            "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$QIGAO_COMPILER_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_HOST_TRIPLET=x64-linux \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF \
            -DSALTSCORE_BUILD_URI=ON \
            -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_INSTALL_PREFIX=$prefix"
      - name: Save dependency cache after configure
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VCPKG_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Build and install exact instrumented Core owner
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-instrumented-core-${{ matrix.kind }} --parallel 2
          cmake --install build-instrumented-core-${{ matrix.kind }} \
            --config RelWithDebInfo
      - name: Build sole CMeta 0.1 CMeta ACE CFlow sanitizer graph
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          salts="$RUNNER_TEMP/salts3-asan-${{ matrix.kind }}"
          cmake -S . -B build-instrumented-salts-${{ matrix.kind }} \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_COMPILER_TOOLCHAIN_FILE" \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_PREFIX_PATH=$core" "-DCMAKE_INSTALL_PREFIX=$salts"
          cmake --build build-instrumented-salts-${{ matrix.kind }} --parallel 2
          cmake --install build-instrumented-salts-${{ matrix.kind }} \
            --config RelWithDebInfo
      - name: Report compiler cache statistics
        if: always() && steps.cache-ready.outcome == 'success'
        shell: bash
        run: ccache --show-stats --verbose
      - name: Save compiler cache before tests
        if: success() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Execute full original source parity under fail-on-report sanitizers
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          export LD_LIBRARY_PATH="$core/lib:${LD_LIBRARY_PATH:-}"
          if [[ '${{ matrix.kind }}' == 'asan-ubsan' ]]; then
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1:abort_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          else
            export TSAN_OPTIONS='halt_on_error=1:exitcode=66'
          fi
          ctest --test-dir build-instrumented-salts-${{ matrix.kind }} \
            -C RelWithDebInfo --output-on-failure --no-tests=error --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salts-sanitizer-${{ matrix.kind }}-ctest
          path: build-instrumented-salts-${{ matrix.kind }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
