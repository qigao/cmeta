            Tee-Object -FilePath (Join-Path $resultDir "cnet-tls-sg.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./cnet/benchmarks/verify_tls_sg_benchmark.ps1 `
            -Path "$env:CNET_TLS_SG_BENCH_OUTPUT.csv" `
            -Backend $env:CNET_TLS_SG_BENCH_BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run TLS provider parallel attribution
        if: matrix.family == 'linux' && matrix.backend == 'epoll' && fromJSON(inputs.scope).cnet_sg == 'true'
        shell: bash
        env:
          CNET_TLS_PROVIDER_PARALLEL_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_tls_provider_parallel_benchmark
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          benchmark="$GITHUB_WORKSPACE/$CNET_TLS_PROVIDER_PARALLEL_EXECUTABLE"
          test -x "$benchmark"
          jsonl="$result_dir/cnet-tls-provider-parallel.jsonl"
          : > "$jsonl"

          for repeat in 1 2 3; do
            for temperature in fresh warm; do
              for mode in push echo; do
                for payload in 16384 32768 65536; do
                  for owners in 1 2 4 8; do
                    echo "provider repeat=$repeat temperature=$temperature mode=$mode payload=$payload owners=$owners"
                    CNET_TLS_PROVIDER_PARALLEL_OPS=64 \
                      CNET_TLS_MODE="$mode" CNET_TLS_PAYLOAD="$payload" CNET_TLS_OWNERS="$owners" CNET_TLS_TEMPERATURE="$temperature" ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" \
                      | tee -a "${jsonl%.jsonl}.ctest.log" | sed -n 's/^[0-9][0-9]*: \({.*}\)$/\1/p' | tee -a "$jsonl"
                  done
                done
              done
            done
          done

          python3 ./cnet/benchmarks/verify_tls_provider_parallel_benchmark.py "$jsonl" \
            | tee "$result_dir/cnet-tls-provider-parallel.md"
      - name: Run public CNet TLS owner attribution
        if: matrix.family == 'linux' && matrix.backend == 'epoll' && fromJSON(inputs.scope).cnet_sg == 'true'
        shell: bash
        env:
          CNET_TLS_PUBLIC_OWNER_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_tls_public_owner_benchmark
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          benchmark="$GITHUB_WORKSPACE/$CNET_TLS_PUBLIC_OWNER_EXECUTABLE"
          test -x "$benchmark"
          jsonl="$result_dir/cnet-tls-public-owner.jsonl"
          : > "$jsonl"

          for repeat in 1 2 3; do
            for nodelay in 0 1; do
              for temperature in fresh warm; do
                for mode in push echo; do
                  for payload in 16384 32768 65536; do
                    for owners in 1 2 4; do
                      echo "public repeat=$repeat nodelay=$nodelay temperature=$temperature mode=$mode payload=$payload owners=$owners"
                      CNET_TLS_PUBLIC_OWNER_OPS=48 \
                      CNET_TLS_PUBLIC_NODELAY="$nodelay" \
                        CNET_TLS_MODE="$mode" CNET_TLS_PAYLOAD="$payload" CNET_TLS_OWNERS="$owners" CNET_TLS_TEMPERATURE="$temperature" ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" \
                        | tee -a "${jsonl%.jsonl}.ctest.log" | sed -n 's/^[0-9][0-9]*: \({.*}\)$/\1/p' | tee -a "$jsonl"
                    done
                  done
                done
              done
            done
          done

          python3 ./cnet/benchmarks/verify_tls_public_owner_benchmark.py "$jsonl" \
            | tee "$result_dir/cnet-tls-public-owner.md"

          demand_jsonl="$result_dir/cnet-tls-public-demand-ab.jsonl"
          : > "$demand_jsonl"
          for repeat in 1 2 3; do
            for nodelay in 0 1; do
              for demand in prearm single; do
                for payload in 32768 65536; do
                  echo "demand-ab repeat=$repeat nodelay=$nodelay demand=$demand payload=$payload"
                  CNET_TLS_PUBLIC_OWNER_OPS=48 \
                  CNET_TLS_PUBLIC_NODELAY="$nodelay" \
                  CNET_TLS_PUBLIC_RECEIVE_DEMAND="$demand" \
                    CNET_TLS_MODE=echo CNET_TLS_PAYLOAD="$payload" CNET_TLS_OWNERS=1 CNET_TLS_TEMPERATURE=warm ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" \
                    | tee -a "${demand_jsonl%.jsonl}.ctest.log" | sed -n 's/^[0-9][0-9]*: \({.*}\)$/\1/p' | tee -a "$demand_jsonl"
                done
              done
            done
          done

          concurrency_jsonl="$result_dir/cnet-tls-public-concurrency-shape.jsonl"
          : > "$concurrency_jsonl"
          for repeat in 1 2 3; do
            for poll_ms in 0 1; do
              for owners in 1 4 8; do
                for payload in 32768 65536; do
                  echo "concurrency-shape repeat=$repeat poll_ms=$poll_ms owners=$owners payload=$payload"
                  CNET_TLS_PUBLIC_OWNER_OPS=48 \
                  CNET_TLS_PUBLIC_NODELAY=1 \
                  CNET_TLS_PUBLIC_RECEIVE_DEMAND=single \
                  CNET_TLS_PUBLIC_POLL_MS="$poll_ms" \
                    CNET_TLS_MODE=echo CNET_TLS_PAYLOAD="$payload" CNET_TLS_OWNERS="$owners" CNET_TLS_TEMPERATURE=warm ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" \
                    | tee -a "${concurrency_jsonl%.jsonl}.ctest.log" | sed -n 's/^[0-9][0-9]*: \({.*}\)$/\1/p' | tee -a "$concurrency_jsonl"
                done
              done
            done
          done

      - name: Run borrowed-copy versus owned receive benchmark
        if: fromJSON(inputs.scope).cnet_io == 'true'
        shell: pwsh
        env:
          IO_BENCHMARK_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_io_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
          CNET_IO_BENCHMARK_RECEIVE_COMPARE: '1'
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:IO_BENCHMARK_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "CNet receive ownership benchmark executable not found: $benchmark"
          }
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 |
            ForEach-Object { $_ -replace '^[0-9]+: ', '' } |
            Tee-Object -FilePath (Join-Path $resultDir "cnet-receive-ownership.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = @($output | Where-Object { $_ -match '^RECEIVE delta payload=' })
          if ($evidence.Count -ne 3) {
            throw "Expected 3 receive ownership evidence rows, got $($evidence.Count)"
          }
          foreach ($payload in @(64, 65536, 1048576)) {
            if (-not ($evidence | Where-Object { $_ -match "^RECEIVE delta payload=${payload}:" })) {
              throw "Missing receive ownership evidence for payload=$payload"
            }
          }
      - name: Run flatten versus NativeIO SG merge-gate comparison
        if: fromJSON(inputs.scope).cnet_sg == 'true'
        shell: pwsh
        env:
          IO_BENCHMARK_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_io_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
          CNET_IO_BENCHMARK_SG_COMPARE: '1'
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:IO_BENCHMARK_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "SG comparison benchmark executable not found: $benchmark"
          }
          $env:CNET_IO_BENCHMARK_OUTPUT = Join-Path $resultDir "sg-compare"
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 |
            ForEach-Object { $_ -replace '^[0-9]+: ', '' } |
            Tee-Object -FilePath (Join-Path $resultDir "sg-compare.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "$env:CNET_IO_BENCHMARK_OUTPUT.sg.csv" -PathType Leaf)) {
            throw "SG comparison CSV was not produced"
          }
          $windowCsv = "$env:CNET_IO_BENCHMARK_OUTPUT.sg-window.csv"
          if (-not (Test-Path -LiteralPath $windowCsv -PathType Leaf)) {
            throw "SG cross-window qualification CSV was not produced"
          }
          $evidence = $output | Where-Object { $_ -match '^SG delta payload=' }
          if (@($evidence).Count -ne 16) {
            throw "Expected 16 SG paired-delta evidence rows, got $(@($evidence).Count)"
          }
          $windowEvidence = $output | Where-Object { $_ -match '^SG window delta payload=' }
          if (@($windowEvidence).Count -ne 6) {
            throw "Expected 6 SG cross-window evidence rows, got $(@($windowEvidence).Count)"
          }
          $windowRows = @(Import-Csv -LiteralPath $windowCsv)
          if ($windowRows.Count -ne 6) {
            throw "Expected 6 SG cross-window CSV rows, got $($windowRows.Count)"
          }
          $expectedCases = @(
            "65536:16", "65536:17", "65536:32",
            "1048576:16", "1048576:17", "1048576:32"
          )
          foreach ($row in $windowRows) {
            $key = "$($row.payload_bytes):$($row.segments)"
            if ($expectedCases -notcontains $key) {
              throw "Unexpected SG cross-window case: $key"
            }
            $segments = [int]$row.segments
            $expectedWindows = if ($segments -le 16) { 1 } else { 2 }
            if ([int]$row.expected_windows -ne $expectedWindows) {
              throw "SG window count mismatch for $key"
            }
            if ([double]$row.vector_submissions_per_op + 0.000001 -lt $expectedWindows) {
              throw "SG native submission count is below the logical window floor for $key"
            }
            if ([math]::Abs([double]$row.terminal_callbacks_per_op - 1.0) -gt 0.000001) {
              throw "SG logical terminal count is not exactly one per send for $key"
            }
          }
          Write-Host "SG paired-delta evidence: $env:CNET_IO_BENCHMARK_BACKEND"
          $evidence | ForEach-Object { Write-Host $_ }
          Write-Host "SG cross-window evidence: $env:CNET_IO_BENCHMARK_BACKEND"
          $windowEvidence | ForEach-Object { Write-Host $_ }
      - name: Run libuv versus NativeIO direct/coroutine versus CNet retained benchmark
        if: fromJSON(inputs.scope).cnet_io == 'true'
        shell: pwsh
        env:
          IO_BENCHMARK_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_io_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
          BENCHMARK_HOST: ${{ matrix.host }}
          BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:IO_BENCHMARK_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "I/O benchmark executable not found: $benchmark"
          }
          $env:CNET_IO_BENCHMARK_OUTPUT = Join-Path $resultDir "io"
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 | ForEach-Object { $_ -replace '^[0-9]+: ', '' } | Tee-Object -FilePath (Join-Path $resultDir "libuv-native-io-cnet-benchmark.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./cnet/benchmarks/verify_io_benchmark.ps1 -Prefix $env:CNET_IO_BENCHMARK_OUTPUT
          @(
            "report_schema=2"
            "host=$env:BENCHMARK_HOST"
            "commit=$env:BENCHMARK_COMMIT"
            "workflow_sha=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "native_io_backend=$env:CNET_IO_BENCHMARK_BACKEND"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
          ) | Set-Content -LiteralPath (Join-Path $resultDir "metadata.txt")
      - name: Run NativeIO direct versus CNet retained scaling benchmark
        if: matrix.family == 'linux' && fromJSON(inputs.scope).cnet_io == 'true'
        shell: pwsh
        env:
          CNET_SCALING_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_scaling_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:CNET_SCALING_EXECUTABLE
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "CNet scaling benchmark executable not found: $benchmark"
          }
          $env:CNET_SCALING_BENCHMARK_OUTPUT = Join-Path $resultDir "cnet-scaling"
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 | ForEach-Object { $_ -replace '^[0-9]+: ', '' } | Tee-Object -FilePath (Join-Path $resultDir "nativeio-cnet-scaling.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./cnet/benchmarks/verify_scaling_benchmark.ps1 -Path "$env:CNET_SCALING_BENCHMARK_OUTPUT.csv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run NativeIO io_uring idle observe benchmark
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && fromJSON(inputs.scope).native_uring == 'true'
        shell: pwsh
        env:
          NATIVE_IO_IDLE_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_idle_observe_benchmark
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_IDLE_EXECUTABLE
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "idle observe benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_IDLE_OBSERVE_OUTPUT = Join-Path $resultDir "native-io-idle-observe"
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 | ForEach-Object { $_ -replace '^[0-9]+: ', '' } | Tee-Object -FilePath (Join-Path $resultDir "native-io-idle-observe.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_idle_observe_benchmark.ps1 -Path "$env:NATIVE_IO_IDLE_OBSERVE_OUTPUT.csv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run NativeIO io_uring queue-depth benchmark
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && fromJSON(inputs.scope).native_uring == 'true'
        shell: pwsh
        env:
          SALTS_BENCH_PROFILE: ${{ fromJSON(inputs.scope).profile }}
          NATIVE_IO_QD_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_queue_depth_benchmark
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_QD_EXECUTABLE
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "queue-depth benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_QD_BENCHMARK_OUTPUT = Join-Path $resultDir "native-io-queue-depth"
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 | ForEach-Object { $_ -replace '^[0-9]+: ', '' } | Tee-Object -FilePath (Join-Path $resultDir "native-io-queue-depth.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_queue_depth_benchmark.ps1 -Path "$env:NATIVE_IO_QD_BENCHMARK_OUTPUT.csv" -Profile $env:SALTS_BENCH_PROFILE
      - name: Trace NativeIO io_uring queue-depth control path
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && fromJSON(inputs.scope).forensic == 'true'
        shell: bash
        env:
          SALTS_BENCH_PROFILE: ${{ fromJSON(inputs.scope).profile }}
          NATIVE_IO_QD_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_queue_depth_benchmark
        run: |
          set -euo pipefail
          trace_dir="native-io-results/queue-depth-syscalls"
          mkdir -p "$trace_dir"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_QD_EXECUTABLE"
          for qd in 1 8 32 64; do
            export NATIVE_IO_QD_TRACE="$qd:32768"
            label="qd-$qd-payload-32768"
            SALTS_BENCH_TRACE_PREFIX="$GITHUB_WORKSPACE/$trace_dir/$label.trace" \
              ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^native_io_queue_depth_benchmark_trace$" \
              > "$trace_dir/$label.log" 2>&1
          done
          unset NATIVE_IO_QD_TRACE
      - name: Summarize NativeIO queue-depth syscall evidence
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && fromJSON(inputs.scope).forensic == 'true'
        shell: pwsh
        run: |
          ./native-io/benchmarks/summarize_queue_depth_trace.ps1 -Directory native-io-results/queue-depth-syscalls |
            Tee-Object -FilePath native-io-results/queue-depth-syscalls/summary.txt
      - name: Collect isolated Linux syscall evidence
        if: matrix.family == 'linux' && fromJSON(inputs.scope).forensic == 'true'
        shell: bash
        env:
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
          IO_BENCHMARK_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_io_benchmark
        run: |
          set -euo pipefail
          # Traced timings are never scores. Each file is one thread; stderr
          # markers delimit the 512 measured RTTs after setup and warmup.
          mkdir -p native-io-results/syscalls
          strace --version > native-io-results/syscalls/tool-version.txt
          for workload in tcp:1024 tcp:32768 tcp:65536 udp:8192; do
            for driver in libuv native coroutine cnet; do
              export CNET_IO_BENCHMARK_TRACE="$driver:$workload"
              label="${CNET_IO_BENCHMARK_TRACE//:/-}"
              SALTS_BENCH_TRACE_PREFIX="$GITHUB_WORKSPACE/native-io-results/syscalls/$label.trace" \
                ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^cnet_io_benchmark_trace$" \
                > "native-io-results/syscalls/$label.log" 2>&1
            done
          done
          printf '%s\n' \
            'Traces are independent reruns, not explanations of individual untraced outliers.' \
            'Only count the client thread between IO_BENCH_MEASURE_BEGIN/END markers.' \
            'Other thread files contain the echo peer; syscall elapsed includes scheduling.' \
            'io_uring_enter counts are NOT SQE counts. API call counts are NOT syscall counts.' \
            'poll/ppoll include io_uring ring/wake-fd waits; they are separate from epoll waits and io_uring_enter.' \
            'libuv can submit epoll control via io_uring; zero direct epoll_ctl calls do not mean zero registration work.' \
            'CPU stacks and runnable/blocked split are not collected by strace; use perf on a profiling host.' \
            > native-io-results/syscalls/README.txt
      - name: Summarize measured client syscall counts
        if: matrix.family == 'linux' && fromJSON(inputs.scope).forensic == 'true'
        shell: pwsh
        run: |
          ./cnet/benchmarks/summarize_io_trace.ps1 -Directory native-io-results/syscalls |
            Tee-Object -FilePath native-io-results/syscalls/summary.txt
      - name: Trace macOS client kqueue registration and waits
        if: matrix.family == 'mac' && fromJSON(inputs.scope).cnet_io == 'true'
        shell: pwsh
        env:
          CNET_IO_BENCHMARK_BACKEND: kqueue
        run: |
          $ErrorActionPreference = 'Stop'
          $traceDir = Join-Path $env:GITHUB_WORKSPACE 'native-io-results/kqueue-trace'
          New-Item -ItemType Directory -Force -Path $traceDir | Out-Null
          ctest --test-dir '${{ matrix.build_dir }}' --no-tests=error --output-on-failure -R '^cnet_kqueue_trace_test$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = [Collections.Generic.List[string]]::new()
          $rows.Add('workload,repeat,round_trips,wall_ns,client_cpu_ns,p50_ns,p95_ns,change_calls,change_ns,change_max_ns,change_errors,wait_calls,wait_ns,wait_max_ns,wait_errors,adds,deletes,change_items,returned_events')
          foreach ($workload in @('tcp:1024', 'tcp:32768', 'tcp:65536', 'udp:8192')) {
            foreach ($driver in @('libuv', 'native', 'coroutine', 'cnet')) {
              $env:CNET_IO_BENCHMARK_TRACE = "$($driver):$workload"
              $label = $env:CNET_IO_BENCHMARK_TRACE.Replace(':', '-')
              $output = ctest --test-dir '${{ matrix.build_dir }}' --no-tests=error -V -R '^cnet_io_benchmark_kqueue_trace$' 2>&1 |
                ForEach-Object { $_ -replace '^[0-9]+: ', '' } |
                Tee-Object -FilePath (Join-Path $traceDir "$label.log")
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $measured = @($output | Where-Object { $_ -like 'KQUEUE_TRACE,*' })
              if ($measured.Count -ne 5) { throw "Expected five measured trace windows: $label" }
              foreach ($line in $measured) {
                if ($line.Split(',').Count -ne 20) { throw "Invalid measured trace columns: $label" }
                $rows.Add($line.Substring('KQUEUE_TRACE,'.Length))
              }
            }
          }
          $rows | Set-Content -LiteralPath (Join-Path $traceDir 'summary.csv')
          @(
            'Client thread only, five independent reruns per workload; setup/warmup/echo peer excluded.'
            'A separate executable interposes kevent in both libuv and NativeIO; ordinary A/B has no probes.'
            'change_calls: event capacity zero; wait_calls: event capacity positive, possibly with batched changes.'
            'adds/deletes count requested change items, including retries; errors are syscall return errors.'
            'kevent wall durations include kernel wait and scheduling; they are not CPU cost or baseline RTT.'
            'No CPU stacks or runnable/blocked split is collected. Traces do not explain individual A/B outliers.'
          ) | Set-Content -LiteralPath (Join-Path $traceDir 'README.txt')
      - name: Prune successful PR forensic artifacts
        if: success() && github.event_name == 'pull_request' && fromJSON(inputs.scope).forensic != 'true'
        shell: pwsh
        run: |
          ./cmake/ci/prune-benchmark-artifacts.ps1 -EvidenceDir (Join-Path $env:GITHUB_WORKSPACE "native-io-results")
      - name: Render benchmark verdicts
        if: always() && fromJSON(inputs.scope).evidence == 'true'
        shell: pwsh
        env:
          BENCHMARK_JOB_STATUS: ${{ job.status }}
        run: |
          ./cmake/ci/render-benchmark-verdicts.ps1 `
            -PolicyPath cmake/ci/benchmark-policy.json `
            -EvidenceDir native-io-results `
            -Backend "${{ matrix.backend }}" `
            -JobStatus "$env:BENCHMARK_JOB_STATUS" `
            -WriteSummary
      - name: Upload I/O benchmark evidence
        if: always() && fromJSON(inputs.scope).evidence == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: io-benchmark-${{ matrix.artifact }}
          path: native-io-results
          if-no-files-found: error
          retention-days: 30
    env:
      PROJECT_ROOT: ${{ github.workspace }}
 `
            -R '^(cflow_(actor_mailbox|ace_throughput)_benchmark|thread_pool_lf_benchmark)        if: matrix.family == 'linux' && fromJSON(inputs.scope).forensic == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Prepare macOS GNU runtime
        if: matrix.family == 'mac'
        shell: bash
        run: brew install gcc@15
      - name: Measure fixed-budget IPC and UDP owners
        if: fromJSON(inputs.scope).transport_owner == 'true'
        shell: pwsh
        env:
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^cnet_transport_owner_benchmark$" 2>&1 |
