      - name: Prepare Linux benchmark CPU topology
        if: matrix.family == 'linux' && (fromJSON(inputs.scope).native_owner == 'true' || fromJSON(inputs.scope).cnet_owner == 'true' || fromJSON(inputs.scope).coroutine == 'true')
        shell: bash
        env:
          BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          allowed="$(taskset -pc "$BASHPID" | sed 's/.*: //')"
          topology="$result_dir/native-io-owner-handoff-topology.csv"
          lscpu -p=CPU,CORE,SOCKET > "$topology"

          expand_cpuset() {
            local spec="$1"
            local part start end cpu
            IFS=',' read -ra parts <<< "$spec"
            for part in "${parts[@]}"; do
              if [[ "$part" == *-* ]]; then
                start="${part%-*}"
                end="${part#*-}"
                for ((cpu = start; cpu <= end; ++cpu)); do echo "$cpu"; done
              else
                echo "$part"
              fi
            done
          }

          mapfile -t cpus < <(expand_cpuset "$allowed")
          if (( ${#cpus[@]} == 0 )); then
            echo "No CPUs found in allowed set: $allowed" >&2
            exit 1
          fi
          first="${cpus[0]}"
          first_key="$(awk -F, -v cpu="$first" '$1 == cpu {print $2 ":" $3; exit}' "$topology")"
          if [[ -z "$first_key" ]]; then
            echo "CPU topology is unavailable for CPU $first" >&2
            exit 1
          fi
          same_core=""
          distinct_core=""
          for cpu in "${cpus[@]:1}"; do
            key="$(awk -F, -v wanted="$cpu" '$1 == wanted {print $2 ":" $3; exit}' "$topology")"
            [[ -z "$key" ]] && continue
            if [[ "$key" == "$first_key" && -z "$same_core" ]]; then
              same_core="$cpu"
            elif [[ "$key" != "$first_key" && -z "$distinct_core" ]]; then
