            exit 1
          fi
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -f "$cpu_sets" ]]; then
            echo "Benchmark CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
