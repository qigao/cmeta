                for payload in 32768 65536; do
                  echo "demand-ab repeat=$repeat nodelay=$nodelay demand=$demand payload=$payload"
                  CNET_TLS_PUBLIC_OWNER_OPS=48 \
                  CNET_TLS_PUBLIC_NODELAY="$nodelay" \
                  CNET_TLS_PUBLIC_RECEIVE_DEMAND="$demand" \
                    CNET_TLS_MODE=echo CNET_TLS_PAYLOAD="$payload" CNET_TLS_OWNERS=1 CNET_TLS_TEMPERATURE=warm ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" \
                    | tee -a "${demand_jsonl%.jsonl}.ctest.log" | sed -n 's/^[0-9][0-9]*: \({.*}\)$/\1/p' | tee -a "$demand_jsonl"
                done
              done
            done
          done

          concurrency_jsonl="$result_dir/cnet-tls-public-concurrency-shape.jsonl"
          : > "$concurrency_jsonl"
          for repeat in 1 2 3; do
            for poll_ms in 0 1; do
              for owners in 1 4 8; do
                for payload in 32768 65536; do
                  echo "concurrency-shape repeat=$repeat poll_ms=$poll_ms owners=$owners payload=$payload"
                  CNET_TLS_PUBLIC_OWNER_OPS=48 \
                  CNET_TLS_PUBLIC_NODELAY=1 \
                  CNET_TLS_PUBLIC_RECEIVE_DEMAND=single \
                  CNET_TLS_PUBLIC_POLL_MS="$poll_ms" \
                    CNET_TLS_MODE=echo CNET_TLS_PAYLOAD="$payload" CNET_TLS_OWNERS="$owners" CNET_TLS_TEMPERATURE=warm ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" \
                    | tee -a "${concurrency_jsonl%.jsonl}.ctest.log" | sed -n 's/^[0-9][0-9]*: \({.*}\)$/\1/p' | tee -a "$concurrency_jsonl"
                done
              done
            done
          done

      - name: Run borrowed-copy versus owned receive benchmark
