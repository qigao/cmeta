name: NativeIO and CNet benchmarks
'on':
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  policy:
    name: Benchmark policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate benchmark decision policy
        shell: pwsh
        run: |
          ./cmake/ci/verify-benchmark-policy.ps1 -ProjectRoot .
      - name: Validate PR artifact pruning contract
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "benchmark-prune-contract"
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -LiteralPath (Join-Path $root "io.samples.csv") -Value "raw"
          Set-Content -LiteralPath (Join-Path $root "io.runs.csv") -Value "summary"
          Set-Content -LiteralPath (Join-Path $root "benchmark-verdicts.csv") -Value "verdict"
          foreach ($name in @("syscalls","stream-style-syscalls","queue-depth-syscalls")) {
            $dir = Join-Path $root $name
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -LiteralPath (Join-Path $dir "evidence.trace") -Value "trace"
          }
          ./cmake/ci/prune-benchmark-artifacts.ps1 -EvidenceDir $root
          foreach ($removed in @("io.samples.csv","syscalls","stream-style-syscalls","queue-depth-syscalls")) {
            if (Test-Path -LiteralPath (Join-Path $root $removed)) { throw "forensic artifact was not pruned: $removed" }
          }
          foreach ($kept in @("io.runs.csv","benchmark-verdicts.csv")) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $kept) -PathType Leaf)) { throw "summary artifact was pruned: $kept" }
          }
          Remove-Item -LiteralPath $root -Recurse -Force
  benchmark:
    needs: policy
    if: fromJSON(inputs.scope).work == 'true'
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: epoll / Ubuntu 24.04 GCC
            runner: ubuntu-24.04
            family: linux
            backend: epoll
            artifact: linux-epoll
            build_dir: build/linux-gcc-release
            build_artifact: linux-release
          - host: io_uring / Ubuntu 24.04 GCC
            runner: ubuntu-24.04
            family: linux
            backend: io_uring
            artifact: linux-io-uring
            build_dir: build/linux-gcc-release
            build_artifact: linux-release
          - host: IOCP / Windows 2025 MSVC v145
            runner: windows-2025
            family: windows
            backend: iocp
            artifact: windows-iocp
            build_dir: build/Msvc-Release
            build_artifact: windows-release
          - host: kqueue / macOS 15 AppleClang
            runner: macos-15
            family: mac
            backend: kqueue
            artifact: macos-kqueue
            build_dir: build/mac-arm64-appleclang-package-release
            build_artifact: macos-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore compiled benchmark inputs
        uses: ./.github/actions/restore-native-build
        with:
          artifact: native-${{ matrix.build_artifact }}
          build-dir: ${{ matrix.build_dir }}
      # Throughput sampling consumes the exact native build artifact, never
      # delays functional CI, and runs Linux only once (epoll, not io_uring).
      - name: Sample Actor mailbox / ACE / Leader-Followers throughput
        id: actor_benchmark
        if: ${{ fromJSON(inputs.scope).ace_actor == 'true' && matrix.backend != 'io_uring' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path native-io-results | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE "native-io-results/actor-mailbox-benchmark.log"
          ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -LE '^        if: matrix.family == 'linux' && fromJSON(inputs.scope).forensic == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Prepare macOS GNU runtime
        if: matrix.family == 'mac'
        shell: bash
        run: brew install gcc@15
      - name: Measure fixed-budget IPC and UDP owners
        if: fromJSON(inputs.scope).transport_owner == 'true'
        shell: pwsh
        env:
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^cnet_transport_owner_benchmark$" 2>&1 |
            Tee-Object -FilePath (Join-Path $resultDir "cnet-transport-owner.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare PR-base and candidate CNet owner
        if: matrix.family == 'windows' && fromJSON(inputs.scope).cnet_compare == 'true' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          CNET_IO_BENCHMARK_BACKEND: iocp
          CNET_COMPARE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CNET_COMPARE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $env:CNET_COMPARE_BASELINE_DSO = Join-Path $env:GITHUB_WORKSPACE "build/pr-base/build/Msvc-Release/bin/cnet.dll"
          $env:CNET_COMPARE_CANDIDATE_DSO = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.build_dir }}/bin/cnet.dll"
          $env:CNET_COMPARE_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.build_dir }}/bin/cnet_owner_lifecycle_compare.exe"
          foreach ($path in @($env:CNET_COMPARE_BASELINE_DSO,
                              $env:CNET_COMPARE_CANDIDATE_DSO,
                              $env:CNET_COMPARE_EXECUTABLE)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "CNet owner comparison input not found: $path"
            }
          }
          $report = Join-Path $resultDir "cnet-owner-base-vs-direct.md"
          $env:CNET_COMPARE_REPORT = $report
          ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^cnet_owner_lifecycle_compare$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "base_sha=$env:CNET_COMPARE_BASE_SHA"
            "candidate_sha=$env:CNET_COMPARE_HEAD_SHA"
            "baseline_dso=$env:CNET_COMPARE_BASELINE_DSO"
            "candidate_dso=$env:CNET_COMPARE_CANDIDATE_DSO"
          ) | Set-Content -LiteralPath (Join-Path $resultDir "cnet-owner-compare-metadata.txt")
      - name: Run NativeIO Sharded same-owner versus cross-owner routing benchmark
        if: fromJSON(inputs.scope).native_owner == 'true'
        shell: pwsh
        env:
          NATIVE_IO_SHARDED_BENCH_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_sharded_routing_benchmark
          NATIVE_IO_SHARDED_BENCH_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_SHARDED_BENCH_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "NativeIO Sharded routing benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_SHARDED_BENCH_OUTPUT = Join-Path $resultDir "native-io-sharded-routing"
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 |
            ForEach-Object { $_ -replace '^[0-9]+: ', '' } |
            Tee-Object -FilePath (Join-Path $resultDir "native-io-sharded-routing.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_sharded_routing_benchmark.ps1 `
            -Path "$env:NATIVE_IO_SHARDED_BENCH_OUTPUT.csv" `
            -Backend $env:NATIVE_IO_SHARDED_BENCH_BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Linux benchmark CPU topology
        if: matrix.family == 'linux' && (fromJSON(inputs.scope).native_owner == 'true' || fromJSON(inputs.scope).cnet_owner == 'true' || fromJSON(inputs.scope).coroutine == 'true')
        shell: bash
        env:
          BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          allowed="$(taskset -pc "$BASHPID" | sed 's/.*: //')"
          topology="$result_dir/native-io-owner-handoff-topology.csv"
          lscpu -p=CPU,CORE,SOCKET > "$topology"

          expand_cpuset() {
            local spec="$1"
            local part start end cpu
            IFS=',' read -ra parts <<< "$spec"
            for part in "${parts[@]}"; do
              if [[ "$part" == *-* ]]; then
                start="${part%-*}"
                end="${part#*-}"
                for ((cpu = start; cpu <= end; ++cpu)); do echo "$cpu"; done
              else
                echo "$part"
              fi
            done
          }

          mapfile -t cpus < <(expand_cpuset "$allowed")
          if (( ${#cpus[@]} == 0 )); then
            echo "No CPUs found in allowed set: $allowed" >&2
            exit 1
          fi
          first="${cpus[0]}"
          first_key="$(awk -F, -v cpu="$first" '$1 == cpu {print $2 ":" $3; exit}' "$topology")"
          if [[ -z "$first_key" ]]; then
            echo "CPU topology is unavailable for CPU $first" >&2
            exit 1
          fi
          same_core=""
          distinct_core=""
          for cpu in "${cpus[@]:1}"; do
            key="$(awk -F, -v wanted="$cpu" '$1 == wanted {print $2 ":" $3; exit}' "$topology")"
            [[ -z "$key" ]] && continue
            if [[ "$key" == "$first_key" && -z "$same_core" ]]; then
              same_core="$cpu"
            elif [[ "$key" != "$first_key" && -z "$distinct_core" ]]; then
              distinct_core="$cpu"
            fi
          done

          {
            echo "backend=$BENCHMARK_BACKEND"
            echo "runner_allowed_cpu_set=$allowed"
            echo "one_cpu_set=$first"
            echo "two_cpu_same_core_set=$([[ -n "$same_core" ]] && echo "$first,$same_core" || echo unavailable)"
            echo "two_cpu_distinct_core_set=$([[ -n "$distinct_core" ]] && echo "$first,$distinct_core" || echo unavailable)"
          } > "$result_dir/native-io-owner-handoff-cpu-set.txt"
      - name: Run NativeIO owner-to-owner handoff CPU-set sweep
        if: matrix.family == 'linux' && fromJSON(inputs.scope).native_owner == 'true'
        shell: bash
        env:
          SALTS_BENCH_PROFILE: ${{ fromJSON(inputs.scope).profile }}
          NATIVE_IO_OWNER_HANDOFF_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_handoff_benchmark
          NATIVE_IO_OWNER_HANDOFF_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_OWNER_HANDOFF_EXECUTABLE"
          if [[ ! -x "$benchmark" ]]; then
            echo "NativeIO owner-handoff benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -f "$cpu_sets" ]]; then
            echo "Benchmark CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            local prefix="$result_dir/native-io-owner-handoff-$label"
            export NATIVE_IO_OWNER_HANDOFF_CPU_SET="$label"
            export NATIVE_IO_OWNER_HANDOFF_OUTPUT="$prefix"
            taskset -c "$cpuset" ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" 2>&1 | tee "$prefix.md"
            pwsh ./native-io/benchmarks/verify_owner_handoff_benchmark.ps1 \
              -Path "$prefix.csv" \
              -Backend "$NATIVE_IO_OWNER_HANDOFF_BACKEND" \
              -CpuSet "$label" \
              -Profile "$SALTS_BENCH_PROFILE"
          }

          run_case one_cpu "$one_cpu_set"
          if [[ "$two_cpu_same_core_set" != "unavailable" ]]; then
            run_case two_cpu_same_core "$two_cpu_same_core_set"
          else
            echo "No second logical CPU on the first physical core; SMT-pair case skipped."
          fi
          if [[ "$two_cpu_distinct_core_set" != "unavailable" ]]; then
            run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"
          else
            echo "No CPU on a distinct physical core; distinct-core case skipped."
          fi
      - name: Run NativeIO owner one-way mailbox CPU-set sweep
        if: matrix.family == 'linux' && fromJSON(inputs.scope).native_owner == 'true'
        shell: bash
        env:
          SALTS_BENCH_PROFILE: ${{ fromJSON(inputs.scope).profile }}
          NATIVE_IO_OWNER_MAILBOX_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_mailbox_benchmark
          NATIVE_IO_OWNER_MAILBOX_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_OWNER_MAILBOX_EXECUTABLE"
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -x "$benchmark" ]]; then
            echo "NativeIO owner-mailbox benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ ! -f "$cpu_sets" ]]; then
            echo "Owner-handoff CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            [[ -z "$cpuset" || "$cpuset" == "unavailable" ]] && return 0
            local prefix="$result_dir/native-io-owner-mailbox-$label"
            export NATIVE_IO_OWNER_MAILBOX_CPU_SET="$label"
            export NATIVE_IO_OWNER_MAILBOX_OUTPUT="$prefix"
            taskset -c "$cpuset" ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" 2>&1 | tee "$prefix.md"
            pwsh ./native-io/benchmarks/verify_owner_mailbox_benchmark.ps1 \
              -Path "$prefix.csv" \
              -Backend "$NATIVE_IO_OWNER_MAILBOX_BACKEND" \
              -CpuSet "$label" \
              -Profile "$SALTS_BENCH_PROFILE"
          }

          run_case one_cpu "$one_cpu_set"
          run_case two_cpu_same_core "$two_cpu_same_core_set"
          run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"
      - name: Run NativeIO owner one-way mailbox default benchmark
        if: matrix.family != 'linux' && fromJSON(inputs.scope).native_owner == 'true'
        shell: pwsh
        env:
          SALTS_BENCH_PROFILE: ${{ fromJSON(inputs.scope).profile }}
          NATIVE_IO_OWNER_MAILBOX_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_mailbox_benchmark
          NATIVE_IO_OWNER_MAILBOX_BACKEND: ${{ matrix.backend }}
          NATIVE_IO_OWNER_MAILBOX_CPU_SET: default
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_OWNER_MAILBOX_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "NativeIO owner-mailbox benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_OWNER_MAILBOX_OUTPUT = Join-Path $resultDir "native-io-owner-mailbox-default"
          $output = ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$([IO.Path]::GetFileNameWithoutExtension($benchmark))$" 2>&1 |
            ForEach-Object { $_ -replace '^[0-9]+: ', '' } |
            Tee-Object -FilePath (Join-Path $resultDir "native-io-owner-mailbox-default.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_owner_mailbox_benchmark.ps1 `
            -Path "$env:NATIVE_IO_OWNER_MAILBOX_OUTPUT.csv" `
            -Backend $env:NATIVE_IO_OWNER_MAILBOX_BACKEND `
            -CpuSet default `
            -Profile $env:SALTS_BENCH_PROFILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run NativeIO owner-local parallel CPU-set sweep
        if: matrix.family == 'linux' && fromJSON(inputs.scope).native_owner == 'true'
        shell: bash
        env:
          NATIVE_IO_OWNER_LOCAL_PARALLEL_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_local_parallel_benchmark
          NATIVE_IO_OWNER_LOCAL_PARALLEL_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_OWNER_LOCAL_PARALLEL_EXECUTABLE"
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -x "$benchmark" ]]; then
            echo "NativeIO owner-local parallel benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ ! -f "$cpu_sets" ]]; then
            echo "CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            [[ -z "$cpuset" || "$cpuset" == "unavailable" ]] && return 0
            local prefix="$result_dir/native-io-owner-local-parallel-$label"
            export NATIVE_IO_OWNER_LOCAL_PARALLEL_CPU_SET="$label"
            export NATIVE_IO_OWNER_LOCAL_PARALLEL_OUTPUT="$prefix"
            taskset -c "$cpuset" ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" 2>&1 | tee "$prefix.md"
            pwsh ./native-io/benchmarks/verify_owner_local_parallel_benchmark.ps1 \
              -Path "$prefix.csv" \
              -Backend "$NATIVE_IO_OWNER_LOCAL_PARALLEL_BACKEND" \
              -CpuSet "$label"
          }

          run_case one_cpu "$one_cpu_set"
          run_case two_cpu_same_core "$two_cpu_same_core_set"
          run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"
      - name: Run CNet independent-owner CPU topology sweep
        if: matrix.family == 'linux' && fromJSON(inputs.scope).cnet_owner == 'true'
        shell: bash
        env:
          CNET_OWNER_PARALLEL_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_owner_parallel_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          benchmark="$GITHUB_WORKSPACE/$CNET_OWNER_PARALLEL_EXECUTABLE"
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -x "$benchmark" ]]; then
            echo "CNet owner-parallel benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ ! -f "$cpu_sets" ]]; then
            echo "CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            [[ -z "$cpuset" || "$cpuset" == "unavailable" ]] && return 0
            local cpu_a="${cpuset%%,*}"
            local cpu_b="$cpu_a"
            if [[ "$cpuset" == *,* ]]; then
              cpu_b="${cpuset##*,}"
            fi
            local prefix="$result_dir/cnet-owner-parallel-$label"
            export CNET_OWNER_PARALLEL_TOPOLOGY="$label"
            export CNET_OWNER_PARALLEL_CPU_A="$cpu_a"
            export CNET_OWNER_PARALLEL_CPU_B="$cpu_b"
            export CNET_OWNER_PARALLEL_OUTPUT="$prefix"

            ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" 2>&1 | tee "$prefix.md"
            pwsh ./cnet/benchmarks/verify_owner_parallel_benchmark.ps1 \
              -Path "$prefix.csv" \
              -Backend "$CNET_IO_BENCHMARK_BACKEND" \
              -Topology "$label" \
              -CpuA "$cpu_a" \
              -CpuB "$cpu_b"

          }

          run_case one_cpu "$one_cpu_set"
          run_case two_cpu_same_core "$two_cpu_same_core_set"
          run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"
      - name: Run CNet shared multi-owner engine CPU topology sweep
        if: matrix.family == 'linux' && fromJSON(inputs.scope).cnet_owner == 'true'
        shell: bash
        env:
          CNET_SHARDS_PARALLEL_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_shards_parallel_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          benchmark="$GITHUB_WORKSPACE/$CNET_SHARDS_PARALLEL_EXECUTABLE"
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -x "$benchmark" ]]; then
            echo "CNet shared-engine benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ ! -f "$cpu_sets" ]]; then
            echo "CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            [[ -z "$cpuset" || "$cpuset" == "unavailable" ]] && return 0
            local cpu_a="${cpuset%%,*}"
            local cpu_b="$cpu_a"
            if [[ "$cpuset" == *,* ]]; then
              cpu_b="${cpuset##*,}"
            fi

            local control="$result_dir/cnet-owner-parallel-$label.csv"
            local prefix="$result_dir/cnet-shards-parallel-$label"
            if [[ ! -f "$control" ]]; then
              echo "independent-owner control evidence not found: $control" >&2
              exit 1
            fi

            export CNET_OWNER_PARALLEL_TOPOLOGY="$label"
            export CNET_OWNER_PARALLEL_CPU_A="$cpu_a"
            export CNET_OWNER_PARALLEL_CPU_B="$cpu_b"
            export CNET_SHARDS_PARALLEL_OUTPUT="$prefix"

            ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" 2>&1 | tee "$prefix.md"
            pwsh ./cnet/benchmarks/verify_shards_parallel_benchmark.ps1 \
              -Path "$prefix.csv" \
              -ControlPath "$control" \
              -Backend "$CNET_IO_BENCHMARK_BACKEND" \
              -Topology "$label" \
              -CpuA "$cpu_a" \
              -CpuB "$cpu_b"

          }

          run_case one_cpu "$one_cpu_set"
          run_case two_cpu_same_core "$two_cpu_same_core_set"
          run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"
      - name: Run CNet external-progress owner-affine CPU topology sweep
        if: matrix.family == 'linux' && fromJSON(inputs.scope).cnet_owner == 'true'
        shell: bash
        env:
          CNET_EXTERNAL_OWNER_PARALLEL_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_external_owner_parallel_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          benchmark="$GITHUB_WORKSPACE/$CNET_EXTERNAL_OWNER_PARALLEL_EXECUTABLE"
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
