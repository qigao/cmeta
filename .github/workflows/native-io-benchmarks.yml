          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_OWNER_MAILBOX_EXECUTABLE"
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -x "$benchmark" ]]; then
            echo "NativeIO owner-mailbox benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ ! -f "$cpu_sets" ]]; then
            echo "Owner-handoff CPU-set evidence not found: $cpu_sets" >&2
