      - name: Prepare Linux benchmark CPU topology
        if: matrix.family == 'linux' && (fromJSON(inputs.scope).native_owner == 'true' || fromJSON(inputs.scope).cnet_owner == 'true' || fromJSON(inputs.scope).coroutine == 'true')
        shell: bash
        env:
          BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          allowed="$(taskset -pc "$BASHPID" | sed 's/.*: //')"
          topology="$result_dir/native-io-owner-handoff-topology.csv"
          lscpu -p=CPU,CORE,SOCKET > "$topology"

          expand_cpuset() {
            local spec="$1"
            local part start end cpu
            IFS=',' read -ra parts <<< "$spec"
            for part in "${parts[@]}"; do
              if [[ "$part" == *-* ]]; then
                start="${part%-*}"
                end="${part#*-}"
                for ((cpu = start; cpu <= end; ++cpu)); do echo "$cpu"; done
              else
                echo "$part"
              fi
            done
          }

          mapfile -t cpus < <(expand_cpuset "$allowed")
          if (( ${#cpus[@]} == 0 )); then
            echo "No CPUs found in allowed set: $allowed" >&2
            exit 1
          fi
          first="${cpus[0]}"
          first_key="$(awk -F, -v cpu="$first" '$1 == cpu {print $2 ":" $3; exit}' "$topology")"
          if [[ -z "$first_key" ]]; then
            echo "CPU topology is unavailable for CPU $first" >&2
            exit 1
          fi
          same_core=""
          distinct_core=""
          for cpu in "${cpus[@]:1}"; do
            key="$(awk -F, -v wanted="$cpu" '$1 == wanted {print $2 ":" $3; exit}' "$topology")"
            [[ -z "$key" ]] && continue
            if [[ "$key" == "$first_key" && -z "$same_core" ]]; then
              same_core="$cpu"
            elif [[ "$key" != "$first_key" && -z "$distinct_core" ]]; then
              distinct_core="$cpu"
            fi
          done

          {
            echo "backend=$BENCHMARK_BACKEND"
            echo "runner_allowed_cpu_set=$allowed"
            echo "one_cpu_set=$first"
            echo "two_cpu_same_core_set=$([[ -n "$same_core" ]] && echo "$first,$same_core" || echo unavailable)"
            echo "two_cpu_distinct_core_set=$([[ -n "$distinct_core" ]] && echo "$first,$distinct_core" || echo unavailable)"
          } > "$result_dir/native-io-owner-handoff-cpu-set.txt"
      - name: Run NativeIO owner-to-owner handoff CPU-set sweep
        if: matrix.family == 'linux' && fromJSON(inputs.scope).native_owner == 'true'
        shell: bash
        env:
          SALTS_BENCH_PROFILE: ${{ fromJSON(inputs.scope).profile }}
          NATIVE_IO_OWNER_HANDOFF_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_handoff_benchmark
          NATIVE_IO_OWNER_HANDOFF_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_OWNER_HANDOFF_EXECUTABLE"
          if [[ ! -x "$benchmark" ]]; then
            echo "NativeIO owner-handoff benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -f "$cpu_sets" ]]; then
            echo "Benchmark CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            local prefix="$result_dir/native-io-owner-handoff-$label"
            export NATIVE_IO_OWNER_HANDOFF_CPU_SET="$label"
            export NATIVE_IO_OWNER_HANDOFF_OUTPUT="$prefix"
            taskset -c "$cpuset" ctest --test-dir "${{ matrix.build_dir }}" --no-tests=error -V -R "^$(basename "$benchmark")$" 2>&1 | tee "$prefix.md"
            pwsh ./native-io/benchmarks/verify_owner_handoff_benchmark.ps1 \
              -Path "$prefix.csv" \
              -Backend "$NATIVE_IO_OWNER_HANDOFF_BACKEND" \
              -CpuSet "$label" \
              -Profile "$SALTS_BENCH_PROFILE"
          }

          run_case one_cpu "$one_cpu_set"
          if [[ "$two_cpu_same_core_set" != "unavailable" ]]; then
            run_case two_cpu_same_core "$two_cpu_same_core_set"
          else
            echo "No second logical CPU on the first physical core; SMT-pair case skipped."
          fi
          if [[ "$two_cpu_distinct_core_set" != "unavailable" ]]; then
            run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"
          else
            echo "No CPU on a distinct physical core; distinct-core case skipped."
          fi
