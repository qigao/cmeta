name: Salts.Native Component candidate (Linux x64)

# Integration-only Linux-x64 Actions artifact. Never publish a one-RID NuGet to
# the shared package feed; see release hygiene #1089.
on:
  push:
    branches:
      - feature/cmeta-pattern-component-runtime
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  # A published SHA remains buildable even when the integration branch advances.
  group: salts-component-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'qigao/salts' && github.ref == 'refs/heads/feature/cmeta-pattern-component-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact integration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Derive immutable candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          manifest_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["version-semver"])')"
          test -n "$version"
          test "$manifest_version" = "$version"
          candidate_version="$version-cmeta.$GITHUB_SHA"
          echo "version=$candidate_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Salts.Native candidate: $candidate_version"

      - name: Restore canonical re2c
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3

      - name: Configure shared vcpkg cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read

      - name: Prepare Linux build host
        uses: ./.github/actions/setup-build-host

      - name: Restore candidate compiler cache
        id: compiler_cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: linux-component-candidate

      - name: Configure and build candidate SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          cmake --preset release-linux-ninja \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_OVERLAY_PORTS="$VCPKG_OVERLAY_PORTS" \
            -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS"
          cmake --build build/linux-gcc-release --parallel 2

      - name: Qualify CMeta Component and generation contracts
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-gcc-release \
            -R '^cmeta_native_component' \
            --no-tests=error --output-on-failure --timeout 180

      - name: Install and attest candidate SDK
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/package/sdk/linux-x64"
          cmake --install build/linux-gcc-release --prefix "$prefix"
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          test -f "$prefix/include/salts/configurator.h"
          test -f "$prefix/include/salts/service_host.h"
          grep -Fq 'Salts::Configurator' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::ServiceHost' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::ComponentProviderABI' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          ! grep -Eq 'add_library\(Salts::Component(Plugin)? ' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          test ! -e "$prefix/include/salts/component.h"
          test ! -e "$prefix/include/salts/component_plugin.h"
          cat > "$prefix/salts-sdk-manifest.txt" <<EOF
          version=$CANDIDATE_VERSION
          commit=$GITHUB_SHA
          rid=linux-x64
          profile=candidate
          EOF

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack exact Salts.Native candidate
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          dotnet pack packaging/nuget/Salts.Native.csproj \
            --configuration Release --output dist \
            -p:PackageVersion="$CANDIDATE_VERSION" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RepositoryCommit="$GITHUB_SHA"
          nupkg="dist/Salts.Native.$CANDIDATE_VERSION.nupkg"
          test -f "$nupkg"
          python3 - "$nupkg" "$CANDIDATE_VERSION" "$GITHUB_SHA" <<'PY'
          import sys, zipfile
          path, version, sha = sys.argv[1:]
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              manifests = [n for n in names if n.endswith('/salts-sdk-manifest.txt')]
              if manifests != ['sdk/linux-x64/salts-sdk-manifest.txt']:
                  raise SystemExit(f'unexpected candidate RID layout: {manifests}')
              data = dict(line.split('=', 1) for line in z.read(manifests[0]).decode().splitlines() if '=' in line)
              expected = dict(version=version, commit=sha, rid='linux-x64', profile='candidate')
              if data != expected:
                  raise SystemExit(f'candidate manifest mismatch: {data} != {expected}')
              for name in ('sdk/linux-x64/lib/cmake/Salts/SaltsConfig.cmake',
                           'sdk/linux-x64/include/salts/service_host.h'):
                  if name not in names:
                      raise SystemExit(f'missing SDK entry {name}')
          PY
          sha256sum "$nupkg" | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: salts-native-candidate-linux-x64
          path: |
            dist/*.nupkg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Record Actions-only candidate admission
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/Salts.Native.$CANDIDATE_VERSION.nupkg"
          {
            echo '### Integration-only Salts.Native candidate'
            echo "- Exact version: \`$CANDIDATE_VERSION\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo '- RID: linux-x64 only'
            echo '- Disposition: Actions artifact only; NOT pushed to shared NuGet feed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report ccache compilation statistics
        if: ${{ always() && steps.compiler_cache.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ccache --show-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
