name: Publish Salts.Native tagged SDK

# Reusable final stage: only Salts CI calls this after tag-scoped full
# build, sanitizers, host CTests, six installed RIDs, and package succeeded.
# It has no independent push/dispatch trigger and cannot bypass the CI gate.
'on':
  workflow_call:
    inputs:
      version:
        description: Validated NuGet version derived from the immutable Git tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet and GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable tag, version and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          test "$TAG" = "v$RELEASE_VERSION"
          cmake_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          manifest_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["version-semver"])')"
          test "$cmake_version" = "$manifest_version"
          base_version="$(printf '%s' "$RELEASE_VERSION" | cut -d- -f1)"
          test "$base_version" = "$manifest_version"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable GitHub Release $TAG" >&2
            exit 1
          fi

      - name: Restore exact-tag six-platform SDK package
        uses: actions/download-artifact@v4
        with:
          name: salts-native-nuget
          path: dist

      - name: Verify NuGet contents, version and source SHA
        shell: bash
        run: |
          set -euo pipefail
          package="dist/Salts.Native.$RELEASE_VERSION.nupkg"
          test -f "$package"
          python3 - "$package" "$RELEASE_VERSION" "$SOURCE_SHA" <<'PY'
          import hashlib, re, sys, zipfile
          path,version,sha=sys.argv[1:]
          rids={'linux-x64','linux-arm64','windows-x64','macos-arm64',
                'android-arm64-v8a','ios-arm64'}
          abi_header_sha=None
          with zipfile.ZipFile(path) as pkg:
              names=set(pkg.namelist())
              manifests={n for n in names if n.endswith('/salts-sdk-manifest.txt')}
              expected={f'sdk/{rid}/salts-sdk-manifest.txt' for rid in rids}
              if manifests!=expected:
                  raise SystemExit(f'Incorrect SDK RID set: {manifests ^ expected}')
              for entry in expected:
                  fields={}
                  for line in pkg.read(entry).decode('utf-8-sig').splitlines():
                      if '=' in line:
                          key,value=line.split('=',1)
                          fields.setdefault(key,[]).append(value)
                  for key,want in [('version',version),('commit',sha),('profile','release')]:
                      values=fields.get(key,[])
                      if values != [want]:
                          raise SystemExit(f'{entry}: {key} values {values!r}, expected exactly [{want!r}]')
                  rid=entry.split('/')[1]
                  root=f'sdk/{rid}/'
                  for header in ('cmeta/function.h','cmeta/component.h',
                                 'cnet/cnet.h','cnet/name_lookup.h',
                                 'salts/configurator.h','salts/service_host.h',
                                 'salts/component_abi.h','salts/component_provider_abi.h',
                                 'salts/component_runtime_abi.h','salts/plugin.h',
                                 'salts/plugin_decl.h','salts/thread.h'):
                      item=root+'include/'+header
                      if item not in names:
                          raise SystemExit(f'{rid}: missing {header}')
                  for retired_header in ('salts/component.h','salts/component_plugin.h',
                                         'salts/component_plugin_abi.h'):
                      if root+'include/'+retired_header in names:
                          raise SystemExit(f'{rid}: retired runtime header packaged: {retired_header}')
                  abi_path=root+'include/salts/component_runtime_abi.h'
                  abi=pkg.read(abi_path)
                  if b'SALTS_COMPONENT_RUNTIME_ABI_VERSION 0x00010000u' not in abi:
                      raise SystemExit(f'{rid}: unexpected ServiceHost ABI epoch')
                  digest=hashlib.sha256(abi).hexdigest()
                  if abi_header_sha is None:
                      abi_header_sha=digest
                  elif digest != abi_header_sha:
                      raise SystemExit(f'{rid}: ServiceHost ABI header differs across RIDs')
                  cmake_root=root+'lib/cmake/Salts/'
                  required_cmake_files=('SaltsConfig.cmake','SaltsConfigVersion.cmake',
                                        'SaltsTargets.cmake','SaltsTargets-release.cmake')
                  for filename in required_cmake_files:
                      if cmake_root+filename not in names:
                          raise SystemExit(f'{rid}: missing CMake file {filename}')
                  target_path=cmake_root+'SaltsTargets.cmake'
                  release_path=cmake_root+'SaltsTargets-release.cmake'
                  targets=pkg.read(target_path).decode('utf-8',errors='strict')
                  release_targets=pkg.read(release_path).decode('utf-8',errors='strict')
                  active_targets='\n'.join(line for line in targets.splitlines()
                                             if not line.lstrip().startswith('#'))
                  required_targets=('Salts::Configurator','Salts::ServiceHost',
                                    'Salts::ComponentABI','Salts::ComponentProviderABI',
                                    'Salts::PluginABI','Salts::Plugin','Salts::Platform',
                                    'Salts::CMeta','Salts::Core')
                  for target in required_targets:
                      definition=re.compile(r'(?m)^\s*add_library\s*\(\s*'+
                                             re.escape(target)+r'\s+[A-Z_]+\s+IMPORTED\b')
                      if definition.search(active_targets) is None:
                          raise SystemExit(f'{rid}: missing actual imported target {target}')
                  if (re.search(r'add_library\s*\(\s*Salts::Component(?:Plugin)?\s',active_targets)
                      or re.search(r'add_library\s*\(\s*Salts::ComponentPluginABI\s',active_targets)):
                      raise SystemExit(f'{rid}: retired runtime target exported')
                  for relative_path in re.findall(
                      r'IMPORTED_(?:IMPLIB|LOCATION)(?:_[A-Z0-9_]+)?\s+"?\$\{_IMPORT_PREFIX\}/([^"\s)]+)',
                      release_targets):
                      relative_path=relative_path.replace('\\','/')
                      if root+relative_path not in names:
                          raise SystemExit(f'{rid}: missing imported binary {relative_path}')
                  if rid=='windows-x64':
                      libraries=('lib/salts_configurator.lib','lib/salts_service_host.lib')
                  else:
                      libraries=('lib/libsalts_configurator.a','lib/libsalts_service_host.a')
                  for library in libraries:
                      if root+library not in names:
                          raise SystemExit(f'{rid}: missing runtime library {library}')
          PY
          # Prove that the packed Linux x64 package is a usable installed SDK.
          nupkg_probe="$RUNNER_TEMP/salts-nupkg-consumer"
          rm -rf "$nupkg_probe"
          mkdir -p "$nupkg_probe/sdk/linux-x64"
          python3 - "$package" "$nupkg_probe/sdk/linux-x64" <<'PY'
          import pathlib,sys,zipfile
          package_path,destination=sys.argv[1:]
          prefix='sdk/linux-x64/'
          root=pathlib.Path(destination)
          with zipfile.ZipFile(package_path) as pkg:
              for name in pkg.namelist():
                  if not name.startswith(prefix):
                      continue
                  relative=pathlib.PurePosixPath(name[len(prefix):])
                  if not relative.parts and name.endswith('/'):
                      continue
                  if not relative.parts or relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsafe SDK path in NuGet package: {name}')
                  target=root.joinpath(*relative.parts)
                  if name.endswith('/'):
                      target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(pkg.read(name))
          PY
          cmake -S component-runtime/sdk-probe -B "$nupkg_probe/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSALTS_INSTALLED_ROOT="$nupkg_probe/sdk/linux-x64"
          cmake --build "$nupkg_probe/build" --parallel 2
          ctest --test-dir "$nupkg_probe/build" --no-tests=error --output-on-failure
          sha256sum "$package" | tee dist/SHA256SUMS

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Reject a pre-existing version before any upload. Never confuse an
      # already-published feed package with the current immutable tag artifact.
      # A partial prior publication needs an explicit, audited recovery path.
      - name: Refuse existing NuGet package version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate '/users/qigao/packages/nuget/Salts.Native/versions?per_page=100' \
            > "$RUNNER_TEMP/salts-published-versions.json"
          python3 packaging/nuget/feed_hygiene.py publish-unique \
            "$RELEASE_VERSION" "$RUNNER_TEMP/salts-published-versions.json"

      - name: Publish immutable NuGet package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/salts-tag-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet nuget push "dist/Salts.Native.$RELEASE_VERSION.nupkg" \
            --api-key "$GITHUB_TOKEN" --source github --configfile "$config"

      - name: Publish GitHub prerelease or stable release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then
            gh release create "$TAG" \
              "dist/Salts.Native.$RELEASE_VERSION.nupkg" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_SHA" \
              --title "Salts $RELEASE_VERSION" --generate-notes --prerelease
          else
            gh release create "$TAG" \
              "dist/Salts.Native.$RELEASE_VERSION.nupkg" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_SHA" \
              --title "Salts $RELEASE_VERSION" --generate-notes --latest
          fi
