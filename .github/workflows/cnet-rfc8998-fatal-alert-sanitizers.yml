name: CNet RFC8998 fatal-alert sanitizer gate

'on':
  pull_request:
    paths:
      - 'cnet/src/cnet_owner.c'
      - 'cnet/src/cnet_tls.c'
      - 'cnet/tests/cnet_shangmi_tls13_fatal_owner_test.c'
      - 'cnet/tests/cnet_shangmi_tls13_profile_test.c'
      - 'cnet/tests/cnet_tls_handshake_framing_test.c'
      - 'cnet/tests/verify_gmssl_shangmi_tls13.py'
      - 'cnet/tests/CMakeLists.txt'
      - 'vcpkg-configuration.json'
      - '.github/workflows/cnet-rfc8998-fatal-alert-sanitizers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cnet-rfc8998-fatal-san-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fatal-alert-san:
    # Candidate-only while provider revision 3.2.0#11 remains in Draft.
    # Do not publish a stable SDK or enable a fallback provider here.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/cnet-tls-fatal-alert-drain' || github.head_ref == 'feature/cnet-rfc8998-gmssl-r11-registry' || github.head_ref == 'feature/rfc8998-bootstrap-action-sha-pin'
    name: NativeIO fatal alert / ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan-ubsan
            address: ON
            undefined: ON
            thread: OFF
          - sanitizer: tsan
            address: OFF
            undefined: OFF
            thread: ON
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore shared re2c tools
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3
      - name: Prepare shared vcpkg cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3
        with:
          mode: read
      - name: Verify exact GmSSL 3.2.0 revision 11 registry pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("vcpkg-configuration.json", encoding="utf-8") as f:
              config = json.load(f)
          gmssl = [r for r in config.get("registries", [])
                   if "gmssl" in r.get("packages", [])]
          expected = "9fc853a8a3a779e0115040d30caab3c05d777f44"
          assert len(gmssl) == 1
          assert gmssl[0]["reference"] == gmssl[0]["baseline"] == expected
          PY
      - name: Prepare native CNet build toolchain
        uses: ./.github/actions/setup-build-host
      - name: Restore compiler cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: cnet-rfc8998-fatal-${{ matrix.sanitizer }}
      - name: Configure and build exact-Provider sanitized CNet
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/cnet-rfc8998-fatal-${{ matrix.sanitizer }}"
          cmake --preset linux-release-ci -B "$root" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TESTS=ON -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMETA_BUILD_BENCHMARKS=OFF \
            -DNATIVE_IO_BUILD_BENCHMARKS=OFF \
            -DCNET_BUILD_BENCHMARKS=OFF \
            -DENABLE_SANITIZER_ADDRESS=${{ matrix.address }} \
            -DENABLE_SANITIZER_UNDEFINED=${{ matrix.undefined }} \
            -DENABLE_SANITIZER_THREAD=${{ matrix.thread }}
          cmake --build "$root" --parallel 2 \
            --target cnet_shangmi_tls13_fatal_owner_probe \
                     cnet_shangmi_tls13_profile_probe \
                     cnet_tls_handshake_framing_test
      - name: Verify CNet Owner terminal, cancellations and handshake framing
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/cnet-rfc8998-fatal-${{ matrix.sanitizer }}"
          ctest --test-dir "$root" --no-tests=error --output-on-failure \
            --timeout 150 --repeat until-fail:3 \
            -R '^(cnet_shangmi_tls13_fatal_owner_(test|cancel_test|deadline_test)|cnet_shangmi_tls13_profile_test|cnet_tls_handshake_framing_test)$'
