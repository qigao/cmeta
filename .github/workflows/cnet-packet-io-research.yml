name: CNet Packet IO Research
'on':
  pull_request:
    paths:
      - 'experiments/cnet-packet-io/**'
      - '.github/workflows/cnet-packet-io-research.yml'
  workflow_dispatch:
    inputs:
      qualify_dpdk:
        description: 'Run additional system-DPDK net_ring qualification'
        type: boolean
        default: true
      qualify_sdk:
        description: 'Run exact Salts.Native 2.3 candidate SDK ABI consumer'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: cnet-packet-io-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fake-owner:
    name: Fake PMD C11 ${{ matrix.compiler }} (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, sanitizer: asan-ubsan, sanitizer_flags: '-fsanitize=address,undefined' }
          - { compiler: clang, sanitizer: asan-ubsan, sanitizer_flags: '-fsanitize=address,undefined' }
          - { compiler: gcc, sanitizer: tsan, sanitizer_flags: '-fsanitize=thread' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure standalone C11 research target
        shell: bash
        run: |
          cmake -S experiments/cnet-packet-io -B build/cnet-packet-${{ matrix.compiler }}-${{ matrix.sanitizer }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_C_FLAGS=-Wall -Wextra -Werror -pedantic ${{ matrix.sanitizer_flags }} -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.sanitizer_flags }}' \
            -DPACKET_IO_ENABLE_DPDK=OFF
      - name: Build and run deterministic fake-PMD tests
        shell: bash
        run: |
          cmake --build build/cnet-packet-${{ matrix.compiler }}-${{ matrix.sanitizer }} --parallel 2
          ctest --test-dir build/cnet-packet-${{ matrix.compiler }}-${{ matrix.sanitizer }} --output-on-failure

  dpdk-net-ring:
    name: Real DPDK net_ring ethdev
    if: github.event_name == 'pull_request' || inputs.qualify_dpdk == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system DPDK (not vcpkg or package cache)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libdpdk-dev pkg-config
          pkg-config --modversion libdpdk
      - name: Configure optional DPDK ring integration
        shell: bash
        run: |
          cmake -S experiments/cnet-packet-io -B build/cnet-packet-dpdk \
            -DCMAKE_BUILD_TYPE=Release \
            -DPACKET_IO_ENABLE_DPDK=ON
          cmake --build build/cnet-packet-dpdk --parallel 2
      - name: Require real rte_ethdev TX/RX and stop-drain qualification
        shell: bash
        run: |
          # Execute the program, not merely ctest's SKIP_RETURN_CODE 77:
          # unavailable EAL must NOT be misrepresented as a passing PMD run.
          ./build/cnet-packet-dpdk/packet_io_dpdk_ring_test

  gmssl-r2-owner:
    name: Pinned GmSSL 3.2 R2 MAC Owner lease
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build exact GmSSL source pinned by Salts vcpkg registry
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/gmssl-src"
          build="$RUNNER_TEMP/gmssl-build"
          prefix="$RUNNER_TEMP/gmssl-research-prefix"
          pin=7c9f02904ef33e59c87b4f16621cc8fd434e7579
          mkdir -p "$source"
          git -C "$source" init --quiet
          git -C "$source" remote add origin https://github.com/guanzhi/GmSSL.git
          git -C "$source" fetch --quiet --depth=1 origin "$pin"
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$pin"
          cmake -S "$source" -B "$build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=OFF -DENABLE_SHA2=ON \
            -DENABLE_SHA1=ON -DENABLE_AES=ON -DENABLE_SECP256R1=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_LMS=OFF -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF
          cmake --build "$build" --target gmssl --parallel 4
          library="$(find "$build" -maxdepth 3 -type f -name libgmssl.a -print -quit)"
          test -n "$library"
          mkdir -p "$prefix/lib" "$prefix/include" "$prefix/share/gmssl"
          cp "$library" "$prefix/lib/libgmssl.a"
          cp -a "$source/include/gmssl" "$prefix/include/"
          # The pinned vcpkg port exports the same target and SHA2 definitions.
          # This isolated CI config is a link adapter, NOT an installed Salts SDK.
          cat > "$prefix/share/gmssl/GmSSLConfig.cmake" <<EOF
          add_library(GmSSL::GmSSL STATIC IMPORTED)
          set_target_properties(GmSSL::GmSSL PROPERTIES
            IMPORTED_LOCATION "$prefix/lib/libgmssl.a"
            INTERFACE_INCLUDE_DIRECTORIES "$prefix/include"
            INTERFACE_COMPILE_DEFINITIONS "ENABLE_SHA2;ENABLE_SHA1;ENABLE_AES")
          EOF
          echo "GMSSL_RESEARCH_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Configure and execute GmSSL versus independent OpenSSL oracle
        shell: bash
        run: |
          set -euo pipefail
          cmake -S experiments/cnet-packet-io -B build/cnet-packet-gmssl \
            -DCMAKE_BUILD_TYPE=Release -DPACKET_IO_ENABLE_DPDK=OFF \
            -DPACKET_IO_ENABLE_GMSSL=ON \
            "-DGmSSL_DIR=$GMSSL_RESEARCH_PREFIX/share/gmssl"
          cmake --build build/cnet-packet-gmssl --parallel 4
          ctest --test-dir build/cnet-packet-gmssl --output-on-failure \
            -R '^packet_(gmssl_mac_conformance|reliable_conformance|reliable_packet_io|io_fake_owner)$'

  installed-cmeta-sdk:
    name: Salts.Native 2.3.0-rc.14 installed C11 C++17 MAC consumer
    if: github.event_name == 'pull_request' || inputs.qualify_sdk == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download exact published release and attest immutable SDK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v2.3.0-rc.14 --repo qigao/salts \
            --pattern 'Salts.Native.2.3.0-rc.14.nupkg' \
            --pattern SHA256SUMS --dir dist
          sha256sum --check dist/SHA256SUMS
          echo 'fe8f5915adc0c7a0f5c52af75fa8cd188d6364dabda483013d842de242eb7a35  dist/Salts.Native.2.3.0-rc.14.nupkg' | sha256sum --check
          python3 - <<'PY'
          import os, zipfile
          path = 'dist/Salts.Native.2.3.0-rc.14.nupkg'
          with zipfile.ZipFile(path) as pkg:
              names = set(pkg.namelist())
              manifest = 'sdk/linux-x64/salts-sdk-manifest.txt'
              assert manifest in names, 'No attested Linux x64 SDK manifest'
              meta = dict(line.split('=',1) for line in pkg.read(manifest).decode('utf-8-sig').splitlines() if '=' in line)
              for key,expected in [('version','2.3.0-rc.14'),('commit','c8a1a3d5e259a89ad42e75f1e4c3142e6b106ee1'),('rid','linux-x64'),('profile','release')]:
                  assert meta.get(key) == expected, (key,meta.get(key),expected)
              required = ('sdk/linux-x64/lib/cmake/Salts/SaltsConfig.cmake',
                          'sdk/linux-x64/lib/cmake/Salts/SaltsConfigVersion.cmake',
                          'sdk/linux-x64/lib/cmake/Salts/SaltsTargets.cmake',
                          'sdk/linux-x64/include/cmeta_crypto.h')
              for file in required:
                  assert file in names, 'Missing installed SDK entry: '+file
              pkg.extractall('_sdk')
          PY
          echo "SDK_ROOT=$GITHUB_WORKSPACE/_sdk/sdk/linux-x64" >> "$GITHUB_ENV"
      - name: Configure and compile real exported Salts Core ABI
        shell: bash
        run: |
          set -euo pipefail
          cmake -S experiments/cnet-packet-io -B build/cnet-packet-sdk \
            -DCMAKE_BUILD_TYPE=Release -DPACKET_IO_ENABLE_CMETA_SDK=ON \
            -DPACKET_IO_ENABLE_DPDK=OFF -DPACKET_IO_ENABLE_GMSSL=OFF \
            "-DCMAKE_PREFIX_PATH=$SDK_ROOT" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE
          cmake --build build/cnet-packet-sdk --parallel 2
          LD_LIBRARY_PATH="$SDK_ROOT/lib:$SDK_ROOT/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build/cnet-packet-sdk --output-on-failure
      - name: Reject prior 2.2 SDK admission without fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/salts-sdk-negative"
          printf '%s\n' 'cmake_minimum_required(VERSION 3.20)' \
            'project(salts_sdk_negative C)' \
            'find_package(Salts 2.2 CONFIG REQUIRED)' \
            > "$RUNNER_TEMP/salts-sdk-negative/CMakeLists.txt"
          if cmake -S "$RUNNER_TEMP/salts-sdk-negative" \
            -B "$RUNNER_TEMP/salts-sdk-negative/build" \
            "-DCMAKE_PREFIX_PATH=$SDK_ROOT" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE \
            > "$RUNNER_TEMP/sdk-negative.log" 2>&1; then
            echo 'Invalid: Salts 2.3 installed SDK accepted 2.2 consumer' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/sdk-negative.log"
          grep -Fq '2.3.0' "$RUNNER_TEMP/sdk-negative.log"
          grep -Eq 'not compatible|incompatible|Could not find' "$RUNNER_TEMP/sdk-negative.log"
