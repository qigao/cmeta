name: Static CFlow/CSTL actual source owner ASan gate

'on':
  pull_request:
    paths:
      - 'cflow/CMakeLists.txt'
      - 'cstl/CMakeLists.txt'
      - 'cmake/ci/private-static-owner/linux_source_asan.py'
      - '.github/workflows/private-static-owner-asan.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: static-source-cmeta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-owner-asan:
    if: >-
      github.repository == 'qigao/salts' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'feature/static-cstl-cflow-private-owner-1180' &&
        github.event.pull_request.head.repo.full_name == 'qigao/salts') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/feature/static-cstl-cflow-private-owner-1180'))
    name: Actual producer static CFlow/CSTL plus two DSO ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_PRIVATE_OWNER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout actual current producer source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact independent CFlow dual-DSO fixture
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 40291201bd046775c814f5220511c390511381cf
          path: build/private-owner-fixtures/cflow
          persist-credentials: false
      - name: Checkout exact independent CSTL dual-DSO fixture
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 140edcb57483dd704df0226b2c91362d9c0cc2cd
          path: build/private-owner-fixtures/cstl
          persist-credentials: false
      - name: Restore fixed vcpkg dependency graph
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read
      - name: Restore fixed re2c host generator
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@0dc254695917bc180504d916240292e9096e9da5
      - name: Prepare Linux C11 build prerequisites
        uses: ./.github/actions/setup-build-host
      - name: Verify actual static targets and both native C11 DSO families under unsuppressed sanitizers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRIVATE_OWNER_SHA"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          python3 cmake/ci/private-static-owner/linux_source_asan.py --mode static-hidden
      - name: Record exact candidate provenance even on failed gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/salts-cflow-evidence-static-hidden"
          mkdir -p "$folder"
          {
            echo "producer_original_current_source_head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo 'test_visibility_overlay_applied=FALSE'
            echo 'actual_salts_static_owner_policy=STATIC_HIDDEN_CFLOW_CSTL'
            echo 'expected_shared_CFlow_libraries=NONE'
            echo 'native_CFlow_and_CSTL_owners=IMAGE_LOCAL'
            echo 'sanitizers=ASAN_UBSAN'
            echo 'sanitizer_suppression=NONE'
            echo 'release_published=FALSE'
          } > "$folder/provenance.txt"
      - name: Publish native image, compile, link and ASan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salts-source-private-cflow-cstl-asan
          path: ${{ runner.temp }}/salts-cflow-evidence-static-hidden
          retention-days: 14
          if-no-files-found: warn
