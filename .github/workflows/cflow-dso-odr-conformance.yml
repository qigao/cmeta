name: CFlow CMeta descriptor cross-DSO ownership comparison

'on':
  pull_request:
    paths:
      - '.github/workflows/cflow-dso-odr-conformance.yml'
      - 'cmake/ci/cflow-dso-odr/**'
  push:
    branches:
      - test/cflow-dso-odr-topologies-1180
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-cflow-odr-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: >-
      github.repository == 'qigao/salts' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'test/cflow-dso-odr-topologies-1180' &&
        github.event.pull_request.head.repo.full_name == 'qigao/salts') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/test/cflow-dso-odr-topologies-1180') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/test/cflow-dso-odr-topologies-1180'))
    name: CFlow ${{ matrix.mode }} / real dual DSO ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode:
          - static-default
          - static-hidden
          - shared-single
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout exact immutable Salts rc.15 source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 21bdb1145fbb2b39ee3fa644173ec037adba7b87
          path: salts-source
          persist-credentials: false

      - name: Restore pinned vcpkg cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read

      - name: Restore pinned re2c tools
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@0dc254695917bc180504d916240292e9096e9da5

      - name: Install native compilation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm binutils pkg-config
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"

      - name: Audit source-built independent CFlow DSO ownership
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 cmake/ci/cflow-dso-odr/run_compare.py --mode "$MODE"

      - name: Record immutable source and branch provenance
        if: always()
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/salts-cflow-evidence-$MODE"
          mkdir -p "$evidence"
          {
            echo "review_head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo 'exact_original_salts_source=21bdb1145fbb2b39ee3fa644173ec037adba7b87'
            echo "mode=$MODE"
            echo "job_status=$JOB_STATUS"
            echo 'asan_odr_suppression=NONE'
            echo 'production_sdk_linkage_changed=NO'
            echo 'test_scope=LINUX_ONLY'
          } > "$evidence/provenance.txt"

      - name: Upload exact compare evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cflow-dso-odr-${{ matrix.mode }}
          path: ${{ runner.temp }}/salts-cflow-evidence-${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 14
