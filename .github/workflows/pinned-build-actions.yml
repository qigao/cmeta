name: Salts curl package transport provenance

'on':
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-vcpkg-curl-cache/**'
      - 'cmake/ci/verify-pinned-vcpkg-actions.py'
      - 'cmake/ci/github-packages.py'
      - 'cmake/ci/restore-vcpkg-cache.py'
      - 'cmake/ci/setup-vcpkg-curl-cache.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-provider-actions:
    name: Require curl-only package transport across Salts build workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove Mono, managed restore and mutable provider refs fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 cmake/ci/verify-pinned-vcpkg-actions.py --self-test

      - name: Audit every actual workflow's package transport
        shell: bash
        run: |
          set -euo pipefail
          python3 cmake/ci/verify-pinned-vcpkg-actions.py --repo . \
            | tee "$RUNNER_TEMP/pinned-build-actions.json"
          python3 - "$RUNNER_TEMP/pinned-build-actions.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('status') != 'PASS':
              raise SystemExit('curl transport policy did not pass')
          migrated=data.get('curl_migrated_workflows', [])
          if len(migrated) != 6 or 'native-build.yml' not in migrated:
              raise SystemExit(f'unexpected migrated workflow set: {migrated}')
          if data.get('external_provider_references') != []:
              raise SystemExit('shared vcpkg/re2c provider action references remain')
          PY

      - name: Preserve exact curl transport policy evidence
        uses: actions/upload-artifact@v4
        with:
          name: salts-curl-package-transport-policy
          path: ${{ runner.temp }}/pinned-build-actions.json
          if-no-files-found: error
          retention-days: 30
