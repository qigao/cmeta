name: CFlow 1105 original TurboSCXML Worker TSan

'on':
  pull_request:
    paths:
      - ".github/workflows/cflow-1105-consumer-tsan.yml"
      - "cflow/src/actor.c"
      - "cflow/src/subscription.c"
      - "cflow/include/cflow/actor.h"
      - "cflow/tests/cflow_actor_test.c"

permissions:
  contents: read
  packages: read

concurrency:
  group: cflow-1105-consumer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  original-worker-reproducer:
    if: github.head_ref == 'fix/cflow-1105-cross-thread-stop' || github.head_ref == 'integrate/cflow-1107-master'
    name: Original TurboSCXML Worker Actor, full source TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cflow-1105-consumer-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      TSAN_OPTIONS: "halt_on_error=1:exitcode=66"
    steps:
      - name: Checkout exact Salts repair head (never published SDK)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout immutable published SaltsUtils RC2 source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: c96a47b05292e3bbebba0b016c0b18c71bce8cde
          path: build/cflow-1105-consumer/sources/salts-utils
          persist-credentials: false

      - name: Checkout original TurboSCXML Worker Scheduler reproducer
        uses: actions/checkout@v4
        with:
          repository: qigao/turbo-scxml
          ref: 1360b66dc49bc8d5dedec65e304ec74edf2f7988
          path: build/cflow-1105-consumer/sources/turbo-scxml
          persist-credentials: false

      - name: Configure pinned shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3
        with:
          mode: read

      - name: Restore Salts re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare source TSan build tools and identity evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config ccache python3
          ccache --zero-stats
          mkdir -p build/cflow-1105-consumer
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C build/cflow-1105-consumer/sources/salts-utils rev-parse HEAD)" = c96a47b05292e3bbebba0b016c0b18c71bce8cde
          test "$(git -C build/cflow-1105-consumer/sources/turbo-scxml rev-parse HEAD)" = 1360b66dc49bc8d5dedec65e304ec74edf2f7988
          {
            printf 'salts_unpublished_repair_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'saltsutils_published_rc2_source=c96a47b05292e3bbebba0b016c0b18c71bce8cde\n'
            printf 'turboscxml_original_worker_source=1360b66dc49bc8d5dedec65e304ec74edf2f7988\n'
            printf 'qualification=isolated-original-consumer-full-source-tsan\n'
            printf 'native_sdk_published_or_modified=false\n'
            printf 'third_party_vcpkg_binary_cache=not_tsan_instrumented\n'
          } > build/cflow-1105-consumer/provenance.txt
          cat build/cflow-1105-consumer/provenance.txt

      - name: Build and install unpublished Salts repair source with TSan
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/cflow-1105-repair-sdks/salts"
          cmake --preset linux-tsan-ci -S "$GITHUB_WORKSPACE" \
            -B "$GITHUB_WORKSPACE/build/cflow-1105-consumer/build-salts" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$sdk" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_THREAD=ON
          cmake --build build/cflow-1105-consumer/build-salts --parallel 2
          cmake --install build/cflow-1105-consumer/build-salts
          test -f "$sdk/lib/cmake/Salts/SaltsConfig.cmake"

      - name: Build and install immutable SaltsUtils RC2 source with TSan
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/cflow-1105-repair-sdks/salts"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          src="$GITHUB_WORKSPACE/build/cflow-1105-consumer/sources/salts-utils"
          sdk="$RUNNER_TEMP/cflow-1105-repair-sdks/salts-utils"
          cmake --preset ci-linux-release-user -S "$src" \
            -B "$GITHUB_WORKSPACE/build/cflow-1105-consumer/build-utils" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$sdk" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DENABLE_SANITIZER_THREAD=ON
          cmake --build build/cflow-1105-consumer/build-utils --parallel 2
          cmake --install build/cflow-1105-consumer/build-utils
          test -f "$sdk/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"

      - name: Build original Worker Scheduler consumer against source TSan graph
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/cflow-1105-repair-sdks/salts"
          export SALTS_UTILS_ROOT="$RUNNER_TEMP/cflow-1105-repair-sdks/salts-utils"
          export DATABIND_ROOT="$SALTS_UTILS_ROOT"
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          src="$GITHUB_WORKSPACE/build/cflow-1105-consumer/sources/turbo-scxml"
          cmake --preset ci-component-release-user -S "$src" \
            -B "$GITHUB_WORKSPACE/build/cflow-1105-consumer/build-scxml" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching
          cmake --build build/cflow-1105-consumer/build-scxml --parallel 2
          grep -F "Salts_DIR:PATH=$SALTS_ROOT" build/cflow-1105-consumer/build-scxml/CMakeCache.txt
          grep -F "SaltsUtils_DIR:PATH=$SALTS_UTILS_ROOT" build/cflow-1105-consumer/build-scxml/CMakeCache.txt

      - name: Verify TSan instrumentation for all first-party compilation units
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/cflow-1105-consumer/instrumentation.txt
          import json
          from pathlib import Path
          root = Path("build/cflow-1105-consumer")
          for label, relative in [
              ("Salts-repair", "build-salts"),
              ("SaltsUtils-RC2", "build-utils"),
              ("TurboSCXML-original-Worker", "build-scxml"),
          ]:
              commands = json.loads((root / relative / "compile_commands.json").read_text())
              missing = [
                  cmd.get("file", "<unknown>")
                  for cmd in commands
                  if "-fsanitize=thread" not in cmd.get(
                      "command", " ".join(cmd.get("arguments", []))
                  )
              ]
              print(f"{label}: compiled={len(commands)} missing_tsan={len(missing)}")
              if not commands or missing:
                  raise SystemExit(f"{label} contains uninstrumented first-party objects")
          PY

      - name: Repeat original TurboSCXML Worker Scheduler reproduction
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/cflow-1105-repair-sdks/salts"
          export SALTS_UTILS_ROOT="$RUNNER_TEMP/cflow-1105-repair-sdks/salts-utils"
          export DATABIND_ROOT="$SALTS_UTILS_ROOT"
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/cflow-1105-consumer/build-scxml \
            --repeat until-fail:50 -R '^voicexml_component_dialog_test$' \
            --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/cflow-1105-consumer/results.xml"

      - name: Upload isolated original-consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cflow-1105-original-worker-tsan
          path: |
            build/cflow-1105-consumer/provenance.txt
            build/cflow-1105-consumer/instrumentation.txt
            build/cflow-1105-consumer/results.xml
            build/cflow-1105-consumer/build-scxml/Testing/Temporary/LastTest.log
          retention-days: 14
