name: C11 atomic compiler conformance

on:
  pull_request:
    paths:
      - 'tests/compiler/**'
      - 'concurrency/src/disruptor.c'
      - 'concurrency/src/disruptor_atomic_asm.h'
      - 'concurrency/src/asm-atomic/**'
      - 'concurrency/tcc/**'
      - '.github/workflows/atomic-compiler-conformance.yml'
  workflow_dispatch:

jobs:
  native-baseline:
    name: Native atomic / ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone C11 conformance
        run: >-
          cmake -S tests/compiler -B build/atomic-${{ matrix.compiler }}
          -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Compile
        run: cmake --build build/atomic-${{ matrix.compiler }} --parallel 2
      - name: Execute real atomic tests
        run: ctest --test-dir build/atomic-${{ matrix.compiler }} --output-on-failure
      - name: Repeat real SPSC and Disruptor contention tests five times
        run: >-
          ctest --test-dir build/atomic-${{ matrix.compiler }}
          -R 'salts_(asm_atomic_conformance|asm_atomic_litmus|spsc_real_source_conformance|disruptor_real_source_conformance|disruptor_mpmc_real_source|disruptor_parked_worker_conformance|disruptor_asm_real_source_conformance|disruptor_asm_mpmc_real_source|disruptor_asm_parked_worker_conformance|disruptor_asm_ordered_real_source_conformance|disruptor_asm_ordered_mpmc_real_source|disruptor_asm_ordered_parked_worker_conformance)'
          --repeat until-fail:5 --output-on-failure

  native-arm64-atomic-conformance:
    name: Native ARM64 / ${{ matrix.compiler }} / release-acquire and MPMC
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Verify real ARM64 runner and compiler
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          case "$machine" in
            aarch64|arm64) ;;
            *) echo "Expected native ARM64, got $machine" >&2; exit 1 ;;
          esac
          ${{ matrix.compiler }} --version
      - name: Configure original Concurrency and atomic source on ARM64
        run: >-
          cmake -S tests/compiler -B build/atomic-arm64
          -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Compile full native atomic / Disruptor suite
        run: cmake --build build/atomic-arm64 --parallel 2
      - name: Require full ARM64 conformance (no TCC override)
        run: ctest --test-dir build/atomic-arm64 --output-on-failure
      - name: Stress cross-thread publication, MPMC and retirement 20 times
        run: >-
          ctest --test-dir build/atomic-arm64
          -R 'salts_(atomic_language_conformance|atomic_abi_same_compiler|intrinsic_atomic_conformance|asm_atomic_conformance|asm_atomic_litmus|spsc_real_source_conformance|disruptor_real_source_conformance|disruptor_mpmc_real_source|disruptor_parked_worker_conformance|disruptor_asm_real_source_conformance|disruptor_asm_mpmc_real_source|disruptor_asm_parked_worker_conformance|disruptor_asm_ordered_real_source_conformance|disruptor_asm_ordered_mpmc_real_source|disruptor_asm_ordered_parked_worker_conformance)'
          --repeat until-fail:20 --output-on-failure

  asm-disruptor-benchmark:
    name: Disruptor C11 vs ASM / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build the same real Disruptor 4x4 MPMC harness twice
        run: >-
          cmake -S tests/compiler -B build/asm-compare
          -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build matched C11 and ASM throughput and timestamped latency binaries
        run: >-
          cmake --build build/asm-compare --parallel 2
          --target salts_disruptor_native_benchmark salts_disruptor_asm_benchmark
          salts_disruptor_native_latency salts_disruptor_asm_latency
          salts_disruptor_asm_ordered_benchmark salts_disruptor_asm_ordered_latency
      - name: Verify balanced three-way order and pairwise statistic self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/compiler/asm-atomic/compare_disruptor_three_way.py --self-test
      - name: Benchmark all three original Disruptor implementations in one interleaved run
        env:
          CC: ${{ matrix.compiler }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/compiler/asm-atomic/compare_disruptor_three_way.py \
            --throughput-native build/asm-compare/salts_disruptor_native_benchmark \
            --throughput-seq-cst build/asm-compare/salts_disruptor_asm_benchmark \
            --throughput-loadstore-ordered build/asm-compare/salts_disruptor_asm_ordered_benchmark \
            --latency-native build/asm-compare/salts_disruptor_native_latency \
            --latency-seq-cst build/asm-compare/salts_disruptor_asm_latency \
            --latency-loadstore-ordered build/asm-compare/salts_disruptor_asm_ordered_latency \
            --warmups 6 --samples 12 \
            --expected-throughput 80000 --expected-latency 16000 \
            --output build/asm-compare/three-way-comparison.json
      - name: Preserve complete raw three-way data, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asm-disruptor-three-way-${{ matrix.os }}-${{ matrix.compiler }}
          if-no-files-found: ignore
          path: build/asm-compare/three-way-comparison.json

  native-interop:
    name: Native GCC/Clang cross-compiler atomic ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise both native mixed-compiler directions under contention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/atomic-interop
          src=tests/compiler
          gcc -std=c11 -O2 -pthread -c "$src/atomic_abi_driver.c" -o build/atomic-interop/driver_gcc.o
          clang -std=c11 -O2 -pthread -c "$src/atomic_abi_peer.c" -o build/atomic-interop/peer_clang.o
          gcc -pthread build/atomic-interop/driver_gcc.o build/atomic-interop/peer_clang.o -latomic -o build/atomic-interop/gcc_driver_clang_peer
          timeout 30s build/atomic-interop/gcc_driver_clang_peer
          clang -std=c11 -O2 -pthread -c "$src/atomic_abi_driver.c" -o build/atomic-interop/driver_clang.o
          gcc -std=c11 -O2 -pthread -c "$src/atomic_abi_peer.c" -o build/atomic-interop/peer_gcc.o
          gcc -pthread build/atomic-interop/driver_clang.o build/atomic-interop/peer_gcc.o -latomic -o build/atomic-interop/clang_driver_gcc_peer
          timeout 30s build/atomic-interop/clang_driver_gcc_peer
      - name: Compile isolated Salts CMeta/CSTL/ASN1 objects with GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/atomic-interop/objects
          for cc in gcc clang; do
            "$cc" -std=c11 -Icmeta/include -Iplatform/include -c cmeta/src/abi.c -o "build/atomic-interop/objects/${cc}-cmeta-abi.o"
            "$cc" -std=c11 -Icmeta/include -Iplatform/include -c cmeta/src/type_identity.c -o "build/atomic-interop/objects/${cc}-cmeta-type.o"
            "$cc" -std=c11 -Icmeta/include -Icstl/include -Iplatform/include -c cstl/src/vec.c -o "build/atomic-interop/objects/${cc}-cstl-vec.o"
            "$cc" -std=c11 -Iasn1/include -c asn1/src/asn1.c -o "build/atomic-interop/objects/${cc}-asn1.o"
          done

  native-asan-ubsan:
    name: Native GCC ASan/UBSan / real Concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure real native source with sanitizers
        run: >-
          cmake -S tests/compiler -B build/atomic-sanitized -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build sanitizer targets
        run: cmake --build build/atomic-sanitized --parallel 2
      - name: Run bounded real Concurrency conformance
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build/atomic-sanitized
          -R 'salts_(spsc_real_source_conformance|disruptor_real_source_conformance|disruptor_mpmc_real_source|disruptor_parked_worker_conformance)'
          --output-on-failure

  native-tsan-experimental:
    name: GCC source TSan / runtime qualification
    runs-on: ubuntu-latest
    # First qualify the runner's TSan runtime and reports; never silently
    # classify this diagnostic job as an accepted release-quality TSan gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure TSan source instrumentation
        run: >-
          cmake -S tests/compiler -B build/atomic-tsan -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=-O1 -g -fsanitize=thread -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"
      - name: Build four instrumented Concurrency targets only
        # The unrelated language-level test intentionally calls C11 fences;
        # GCC reports -Werror=tsan for those unsupported fence intrinsics.
        # All language tests still run unmodified in the normal CTest matrix.
        run: >-
          cmake --build build/atomic-tsan --parallel 2
          --target salts_spsc_real_source_conformance
          salts_disruptor_real_source_conformance
          salts_disruptor_mpmc_real_source
          salts_disruptor_parked_worker_conformance
      - name: Run bounded thread-race tests (no skips)
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: >-
          ctest --test-dir build/atomic-tsan
          -R 'salts_(spsc_real_source_conformance|disruptor_real_source_conformance|disruptor_mpmc_real_source|disruptor_parked_worker_conformance)'
          --output-on-failure
      - name: Preserve failing or passing TSan runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-native-tsan-diagnostics
          if-no-files-found: ignore
          path: build/atomic-tsan/Testing/Temporary/LastTest.log

  native-cmeta-cstl:
    name: Complete CMeta+CSTL / ${{ matrix.compiler }} / linked consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical CMeta/CSTL source sets and test linked consumer
        shell: bash
        run: |
          set -euo pipefail
          CC="${{ matrix.compiler }}" BUILD_ROOT="build/whole-${{ matrix.compiler }}" \
            bash tests/compiler/run_cmeta_cstl_qualification.sh
      - name: Exercise public CMeta and Plugin declaration macros
        shell: bash
        run: |
          CC="${{ matrix.compiler }}" BUILD_ROOT="build/macro-${{ matrix.compiler }}" \
            CMETA_LIBRARY="build/whole-${{ matrix.compiler }}/libcmeta_compiler.a" \
            bash tests/compiler/run_cmeta_macro_probes.sh

  native-cmeta-cstl-mixed:
    name: GCC and Clang complete CMeta/CSTL mixed static archive ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile both full static archives and run four cross-compiler combinations
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc BUILD_ROOT=build/mixed-gcc \
            bash tests/compiler/run_cmeta_cstl_qualification.sh
          CC=clang BUILD_ROOT=build/mixed-clang \
            bash tests/compiler/run_cmeta_cstl_qualification.sh
          BUILD_A=build/mixed-gcc BUILD_B=build/mixed-clang \
            CC_A=gcc CC_B=clang LINKER=gcc BUILD_ROOT=build/mixed-gcc-clang \
            bash tests/compiler/run_cmeta_cstl_mixed_abi.sh
      - name: Verify explicit Plugin shared-provider bootstrap across GCC and Clang
        shell: bash
        run: |
          COMPILER_A=gcc COMPILER_B=clang BUILD_ROOT=build/plugin-dso-native \
            bash tests/compiler/run_plugin_dso_smoke.sh

  tcc-disruptor-archive:
    name: Bounded TinyCC Disruptor ASM / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Pin TinyCC
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64|aarch64) ;; *) exit 1 ;; esac
          git clone --quiet https://github.com/TinyCC/tinycc.git "$RUNNER_TEMP/tinycc-disruptor"
          git -C "$RUNNER_TEMP/tinycc-disruptor" checkout --detach e23dabed154a8495f3ac1ff3cc9d04fa1c207893
          cd "$RUNNER_TEMP/tinycc-disruptor"
          ./configure --prefix="$RUNNER_TEMP/tcc-disruptor-install"
          make -j2
          make install
          echo "$RUNNER_TEMP/tcc-disruptor-install/bin" >> "$GITHUB_PATH"
      - name: Build linked TinyCC Disruptor archive
        shell: bash
        run: |
          set -euo pipefail
          cmake -S concurrency/tcc -B build/tcc-disruptor-required -G Ninja \
            -DCMAKE_C_COMPILER=tcc -DCMAKE_ASM_COMPILER=gcc
          cmake --build build/tcc-disruptor-required --parallel 2
          test -s build/tcc-disruptor-required/libsalts_tcc_disruptor.a
          nm -g --defined-only build/tcc-disruptor-required/libsalts_tcc_disruptor.a | grep -F disruptor_create
      - name: Require linked public API consumer conformance
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/tcc-disruptor-required --repeat until-fail:5 --output-on-failure
      - name: Preserve exact-head consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinycc-disruptor-linked-${{ matrix.os }}
          if-no-files-found: ignore
          path: build/tcc-disruptor-required/Testing/Temporary/LastTest.log

  tcc-arm64-experimental:
    name: Pinned TinyCC ARM64 / native runtime diagnostics (not admitted)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # TinyCC advertises __STDC_NO_ATOMICS__=1. Keep strict native C11
    # qualification red until its compiler + ABI contract is actually fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify hardware architecture and build pinned ARM64 TinyCC
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          git clone --quiet https://github.com/TinyCC/tinycc.git "$RUNNER_TEMP/tinycc-arm64"
          git -C "$RUNNER_TEMP/tinycc-arm64" checkout --detach e23dabed154a8495f3ac1ff3cc9d04fa1c207893
          cd "$RUNNER_TEMP/tinycc-arm64"
          ./configure --prefix="$RUNNER_TEMP/tcc-arm64-install"
          make -j2
          make install
          echo "$RUNNER_TEMP/tcc-arm64-install/bin" >> "$GITHUB_PATH"
      - name: Verify TCC AArch64 target and native scalar atomic operations
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tcc-arm64
          tcc -v
          tcc -std=c11 tests/compiler/tcc_atomic_probe.c \
            -o build/tcc-arm64/scalar-atomic
          timeout 30s build/tcc-arm64/scalar-atomic
      - name: Qualify isolated GNU intrinsic atomic backend on ARM64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tcc-arm64
          tcc -std=c11 -Iplatform/include \
            tests/compiler/intrinsic_atomic_conformance.c \
            -lpthread -o build/tcc-arm64/intrinsic-conformance
          timeout 30s build/tcc-arm64/intrinsic-conformance
      - name: Run unchanged Salts SPSC C11 source under TCC ARM64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tcc-arm64
          tcc -std=c11 -D_POSIX_C_SOURCE=200809L -Iconcurrency/include \
            concurrency/src/spsc_ring.c tests/compiler/spsc_real_source_conformance.c \
            -lpthread -o build/tcc-arm64/spsc-conformance
          timeout 40s build/tcc-arm64/spsc-conformance
      - name: Run opaque Salts Disruptor MPMC source under TCC ARM64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tcc-arm64
          tcc -std=c11 -D_DEFAULT_SOURCE=1 -D_POSIX_C_SOURCE=200809L \
            -D_XOPEN_SOURCE=700 -DSALTS_THREAD_LOCAL=_Thread_local \
            -Iconcurrency/include -Iutils/include -Iplatform/include \
            concurrency/src/disruptor.c platform/src/thread_posix.c \
            tests/compiler/disruptor_mpmc_real_source.c -lpthread \
            -o build/tcc-arm64/disruptor-mpmc
          timeout 40s build/tcc-arm64/disruptor-mpmc
      - name: Assemble native AArch64 atomics and link with pinned ARM64 TCC
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tcc-arm64/asm
          gcc -c -x assembler-with-cpp \
            tests/compiler/asm-atomic/asm_atomic_aarch64.S \
            -o build/tcc-arm64/asm/atomic_backend.o
          tcc -std=c11 tests/compiler/asm-atomic/asm_atomic_conformance.c \
            build/tcc-arm64/asm/atomic_backend.o -lpthread \
            -o build/tcc-arm64/asm/conformance
          timeout 30s build/tcc-arm64/asm/conformance
      - name: Audit AArch64 external ASM ELF and non-executable stack
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          readelf -h build/tcc-arm64/asm/atomic_backend.o
          readelf -W -S build/tcc-arm64/asm/atomic_backend.o | grep -F '.note.GNU-stack'
          readelf -W -l build/tcc-arm64/asm/conformance | grep GNU_STACK

      - name: Execute SEQ_CST store-buffering and release/acquire litmus with pinned TinyCC ARM64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tcc -std=c11 tests/compiler/asm-atomic/asm_atomic_litmus.c \
            build/tcc-arm64/asm/atomic_backend.o -lpthread \
            -o build/tcc-arm64/asm/litmus
          timeout 40s build/tcc-arm64/asm/litmus
      - name: Exercise original Disruptor against GAS Atomic slots with TinyCC AArch64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT=build/asm-disruptor-tcc-arm64 \
            bash tests/compiler/asm-atomic/run_disruptor_tcc.sh \
            2>&1 | tee build/asm-disruptor-tcc-arm64.log
      - name: Exercise order-specialized ASM Disruptor with pinned TinyCC ARM64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SALTS_TEST_ASM_ORDERED=1 BUILD_ROOT=build/asm-disruptor-ordered-tcc-arm64 \
            bash tests/compiler/asm-atomic/run_disruptor_tcc.sh \
            2>&1 | tee build/asm-disruptor-ordered-tcc-arm64.log
      - name: Build native ARM64 TinyCC Disruptor static library and link consumers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cmake -S concurrency/tcc -B build/tcc-disruptor-arm64 -G Ninja \
            -DCMAKE_C_COMPILER=tcc -DCMAKE_ASM_COMPILER=gcc
          cmake --build build/tcc-disruptor-arm64 --parallel 2
          test -s build/tcc-disruptor-arm64/libsalts_tcc_disruptor.a
          ctest --test-dir build/tcc-disruptor-arm64 \
            --repeat until-fail:5 --output-on-failure
      - name: Verify strict C11 compiler admission (no atomics fallback)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/compiler -B build/tcc-arm64/strict \
            -G Ninja -DCMAKE_C_COMPILER=tcc
          cmake --build build/tcc-arm64/strict --parallel 2
      - name: Preserve ARM64 TinyCC diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-arm64-atomic-diagnostics
          if-no-files-found: ignore
          path: |
            build/asm-disruptor-tcc-arm64.log
            build/asm-disruptor-ordered-tcc-arm64.log
            build/tcc-disruptor-arm64/Testing/Temporary/LastTest.log
            build/tcc-arm64/strict/CMakeFiles/CMakeConfigureLog.yaml
            build/tcc-arm64/strict/Testing/Temporary/LastTest.log

  tcc-experimental:
    name: TCC / pinned mob / experimental
    runs-on: ubuntu-latest
    # This job is evidence gathering only. TCC is NOT an admitted Salts SDK
    # compiler until its native atomics, ABI, and concurrency are qualified.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned TinyCC (not the old distro release)
        shell: bash
        run: |
          git clone https://github.com/TinyCC/tinycc.git "$RUNNER_TEMP/tinycc"
          git -C "$RUNNER_TEMP/tinycc" checkout --detach e23dabed154a8495f3ac1ff3cc9d04fa1c207893
          cd "$RUNNER_TEMP/tinycc"
          ./configure --prefix="$RUNNER_TEMP/tcc-install"
          make -j2
          make install
          echo "$RUNNER_TEMP/tcc-install/bin" >> "$GITHUB_PATH"
      - name: Record exact compiler revision
        run: tcc -v
      - name: Diagnostic TCC atomics and mixed-compiler ABI (not admission)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/atomic-probe
          bash tests/compiler/run_tcc_diagnostics.sh 2>&1 | tee build/atomic-probe/diagnostics.log
      - name: Diagnostic complete CMeta/CSTL source and linked consumer
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/tcc-cmeta-cstl
          CC=tcc BUILD_ROOT=build/tcc-cmeta-cstl \
            bash tests/compiler/run_cmeta_cstl_qualification.sh 2>&1 | tee build/tcc-cmeta-cstl/build.log
      - name: Diagnostic mixed GCC/TCC CMeta/CSTL archives and consumers
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/mixed-tcc-gcc
          CC=gcc BUILD_ROOT=build/mixed-gcc-in-tcc \
            bash tests/compiler/run_cmeta_cstl_qualification.sh
          BUILD_A=build/mixed-gcc-in-tcc BUILD_B=build/tcc-cmeta-cstl \
            CC_A=gcc CC_B=tcc LINKER=gcc BUILD_ROOT=build/mixed-tcc-gcc \
            EXTRA_LINK_FLAGS="-Wl,--no-eh-frame-hdr -Wl,-z,noexecstack" \
            bash tests/compiler/run_cmeta_cstl_mixed_abi.sh \
              2>&1 | tee build/mixed-tcc-gcc/build.log
      - name: Diagnostic TCC CMeta/Plugin public declaration macros
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/tcc-macros
          CC=tcc BUILD_ROOT=build/tcc-macros \
            CMETA_LIBRARY=build/tcc-cmeta-cstl/libcmeta_compiler.a \
            bash tests/compiler/run_cmeta_macro_probes.sh \
              2>&1 | tee build/tcc-macros/build.log
      - name: Diagnostic GCC/TCC explicit Plugin shared-object bootstrap
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/plugin-dso-tcc
          COMPILER_A=gcc COMPILER_B=tcc BUILD_ROOT=build/plugin-dso-tcc \
            bash tests/compiler/run_plugin_dso_smoke.sh \
              2>&1 | tee build/plugin-dso-tcc/build.log
      - name: Compare pinned upstream c-threads catomics.h (diagnostic only)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/zelang-dev/c-threads.git "$RUNNER_TEMP/c-threads-reference"
          git -C "$RUNNER_TEMP/c-threads-reference" checkout --detach d7cbefa0099044d6d834939290eb62e02ed8bb1b
          mkdir -p build/catomics-upstream
          failures=0
          for cc in gcc clang tcc; do
            if "$cc" -std=c11 -I"$RUNNER_TEMP/c-threads-reference/include" \
                  tests/compiler/catomics_reference_probe.c \
                  -o "build/catomics-upstream/probe-$cc" \
                  >"build/catomics-upstream/$cc.log" 2>&1 &&
               timeout 30s "build/catomics-upstream/probe-$cc" \
                  >>"build/catomics-upstream/$cc.log" 2>&1; then
              echo "$cc: upstream catomics reference PASS (not admission)"
            else
              echo "$cc: upstream catomics reference FAILED (diagnostic)"
              failures=$((failures + 1))
            fi
            cat "build/catomics-upstream/$cc.log"
          done
          echo "upstream catomics reference failures: $failures"
          test "$failures" -eq 0
      - name: Assemble native x64 atomic entrypoints and link with pinned TCC
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/asm-tcc-x64
          gcc -c -x assembler-with-cpp \
            tests/compiler/asm-atomic/asm_atomic_x86_64.S \
            -o build/asm-tcc-x64/atomic_backend.o
          tcc -std=c11 tests/compiler/asm-atomic/asm_atomic_conformance.c \
            build/asm-tcc-x64/atomic_backend.o -lpthread \
            -o build/asm-tcc-x64/conformance
          timeout 30s build/asm-tcc-x64/conformance
      - name: Audit external ASM ELF and non-executable stack
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          readelf -h build/asm-tcc-x64/atomic_backend.o
          readelf -W -S build/asm-tcc-x64/atomic_backend.o | grep -F '.note.GNU-stack'
          readelf -W -l build/asm-tcc-x64/conformance | grep GNU_STACK

      - name: Execute SEQ_CST store-buffering and release/acquire litmus with pinned TinyCC x86-64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tcc -std=c11 tests/compiler/asm-atomic/asm_atomic_litmus.c \
            build/asm-tcc-x64/atomic_backend.o -lpthread \
            -o build/asm-tcc-x64/litmus
          timeout 40s build/asm-tcc-x64/litmus
      - name: Exercise original Disruptor compiled by TinyCC against GAS Atomic slots
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT=build/asm-disruptor-tcc-x64 \
            bash tests/compiler/asm-atomic/run_disruptor_tcc.sh \
            2>&1 | tee build/asm-disruptor-tcc-x64.log
      - name: Exercise order-specialized ASM Disruptor with pinned TinyCC x86-64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SALTS_TEST_ASM_ORDERED=1 BUILD_ROOT=build/asm-disruptor-ordered-tcc-x64 \
            bash tests/compiler/asm-atomic/run_disruptor_tcc.sh \
            2>&1 | tee build/asm-disruptor-ordered-tcc-x64.log
      - name: Build real TinyCC-only Disruptor static library and link consumers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cmake -S concurrency/tcc -B build/tcc-disruptor-x64 -G Ninja \
            -DCMAKE_C_COMPILER=tcc -DCMAKE_ASM_COMPILER=gcc
          cmake --build build/tcc-disruptor-x64 --parallel 2
          test -s build/tcc-disruptor-x64/libsalts_tcc_disruptor.a
          ctest --test-dir build/tcc-disruptor-x64 \
            --repeat until-fail:5 --output-on-failure
      - name: Configure standalone C11 conformance
        run: cmake -S tests/compiler -B build/atomic-tcc -G Ninja -DCMAKE_C_COMPILER=tcc
      - name: Compile
        run: cmake --build build/atomic-tcc --parallel 2
      - name: Execute real atomic tests
        run: ctest --test-dir build/atomic-tcc --output-on-failure
      - name: Preserve experimental diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-atomic-conformance-logs
          if-no-files-found: ignore
          path: |
            build/mixed-tcc-gcc/build.log
            build/mixed-tcc-gcc/*.log
            build/plugin-dso-tcc/build.log
            build/plugin-dso-tcc/*.log
            build/tcc-macros/build.log
            build/tcc-macros/*.log
            build/tcc-cmeta-cstl/build.log
            build/tcc-cmeta-cstl/cmeta/*.log
            build/tcc-cmeta-cstl/cstl/*.log
            build/asm-disruptor-tcc-x64.log
            build/asm-disruptor-ordered-tcc-x64.log
            build/tcc-disruptor-x64/Testing/Temporary/LastTest.log
            build/catomics-upstream/*.log
            build/atomic-probe/diagnostics.log
            build/atomic-tcc/CMakeFiles/CMakeConfigureLog.yaml
            build/atomic-tcc/CMakeFiles/CMakeError.log
            build/atomic-tcc/Testing/Temporary/LastTest.log
