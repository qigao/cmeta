name: CMeta split SDK CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmeta-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  VCPKG_CACHE_VERSION: ${{ vars.VCPKG_CACHE_VERSION }}
  SALTS_BASE_VERSION: ${{ vars.SALTS_BASE_VERSION }}
  SALTS_CORE_VERSION: ${{ vars.SALTS_CORE_VERSION }}
  SALTS_CORE_REF: ${{ vars.SALTS_CORE_REF }}
jobs:
  prepare:
    name: Download shared SDK inputs once
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      VCPKG_CACHE_REPOSITORY_ROOT: ${{ github.workspace }}/build/ci-infrastructure/vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: v${{ env.VCPKG_CACHE_VERSION }}
          path: build/ci-infrastructure/vcpkg-cache
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and download exact published inputs
        id: inputs
        shell: pwsh
        run: |
          python .github/ci/sdk-inputs.py prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = [IO.Path]::GetFullPath('build/ci-inputs/infrastructure.tar')
          git -C $env:VCPKG_CACHE_REPOSITORY_ROOT archive --format=tar HEAD --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: cmeta-shared-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-inputs
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  qualify:
    needs: prepare
    name: ${{ matrix.sdk }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_CACHE_REPOSITORY_ROOT: ${{ github.workspace }}/build/ci-infrastructure/vcpkg-cache
      QIGAO_PREPARED_INPUTS: ${{ github.workspace }}/build/ci-inputs
      SALTS_BASE_SOURCE_ROOT: ${{ github.workspace }}/build/upstream/base
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      CI_PRESET: ${{ matrix.preset }}
      ANDROID_ABI: ${{ matrix.android_abi }}
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts-base
          ref: v${{ env.SALTS_BASE_VERSION }}
          path: build/upstream/base
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.test
        with:
          repository: qigao/salts-cnet
          ref: ${{ env.SALTS_CORE_REF }}
          path: build/upstream/core
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cmeta-shared-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-inputs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the shared infrastructure snapshot and SDKs
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_CACHE_REPOSITORY_ROOT -Force | Out-Null
          tar xf build/ci-inputs/infrastructure.tar -C $env:VCPKG_CACHE_REPOSITORY_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/ci/sdk-inputs.py restore --profile '${{ matrix.sdk }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore prepared LLVM-MinGW compiler
        if: matrix.sdk == 'windows-llvm-mingw-x64'
        run: |
          $lock = Get-Content build/ci-inputs/locks/windows-compiler.json -Raw | ConvertFrom-Json
          $payload = [IO.Path]::GetFileNameWithoutExtension(([Uri]$lock.source.url).AbsolutePath)
          python "$env:VCPKG_CACHE_REPOSITORY_ROOT/scripts/restore-native-dependency.py" locked `
            build/ci-inputs/locks/windows-compiler.json --destination build/ci-llvm-mingw `
            --payload $payload --executable bin/x86_64-w64-mingw32-clang.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content build/ci-llvm-mingw/receipt.json -Raw | ConvertFrom-Json
          "LLVM_MINGW_ROOT=$($receipt.root)" >> $env:GITHUB_ENV
      - name: Locate Visual Studio developer environment
        if: runner.os == 'Windows'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $root = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$root) { throw 'Visual Studio C++ tools are required' }
          "VSDEVCMD_BAT=$root/Common7/Tools/VsDevCmd.bat" >> $env:GITHUB_ENV
      - name: Install Linux system development dependencies
        if: startsWith(matrix.sdk, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libpipewire-0.3-dev libx11-dev libxext-dev
      - name: Build the explicit source-selected CNet test SDK
        if: matrix.test
        run: .github/ci/build-core-sdk.ps1 -Preset $env:CI_PRESET
      - name: Configure complete CMeta graph
        run: |
          if ($IsWindows) { & ./cmake/WithVs.cmd cmake --preset $env:CI_PRESET }
          else { cmake --preset $env:CI_PRESET }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build complete graph
        run: |
          if ($IsWindows) { & ./cmake/WithVs.cmd cmake --build --preset $env:CI_PRESET }
          else { cmake --build --preset $env:CI_PRESET }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run formal native CTests
        if: matrix.test
        run: |
          $report = [IO.Path]::GetFullPath("build/$env:CI_PRESET/ctest.xml")
          $options = @('--preset', $env:CI_PRESET, '--output-on-failure', '--no-tests=error', '--output-junit', $report)
          if ($IsWindows) { & ./cmake/WithVs.cmd ctest @options }
          else { ctest @options }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and archive SDK
        run: |
          cmake --install "build/$env:CI_PRESET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{schema=1; source=$env:GITHUB_SHA; profile='${{ matrix.sdk }}';
            preset=$env:CI_PRESET; base_version=$env:SALTS_BASE_VERSION;
            base=(Get-Content "$env:SALTS_BASE_ROOT/sdk-restore-receipt.json" -Raw | ConvertFrom-Json);
            core_test_ref=$env:SALTS_CORE_REF; native_tests='${{ matrix.test }}'} |
            ConvertTo-Json -Depth 5 | Set-Content "build/$env:CI_PRESET/stage/cmeta-sdk-manifest.json" -Encoding utf8
          $archive = [IO.Path]::GetFullPath("build/$env:CI_PRESET/cmeta-sdk.tar")
          tar cf $archive -C "build/$env:CI_PRESET/stage" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: cmeta-sdk-${{ matrix.sdk }}-${{ github.sha }}
          path: build/${{ matrix.preset }}/cmeta-sdk.tar
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeta-diagnostics-${{ matrix.sdk }}-${{ github.sha }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/ctest.xml
            build/${{ matrix.preset }}/Testing/Temporary
            build/upstream/core/build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
  result:
    name: CMeta CI result
    needs: [prepare, qualify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          PREPARE: ${{ needs.prepare.result }}
          QUALIFY: ${{ needs.qualify.result }}
        run: test "$PREPARE" = success && test "$QUALIFY" = success
