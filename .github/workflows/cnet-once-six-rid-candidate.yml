name: CNet once exact six-RID candidate native package (#1143)

# Source/ABI review only. No tag, feed push, release, promotion or branch merge.
'on':
  pull_request:
    paths:
      - ".github/workflows/cnet-once-six-rid-candidate.yml"
      - "platform/include/salts/thread.h"
      - "platform/src/thread_posix.c"
      - "cnet/src/cnet_module.c"
      - "cnet/tests/cnet_module_once_mixed_tsan_driver.c"

permissions:
  contents: read
  packages: read

concurrency:
  group: cnet-once-six-rid-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  six-rid-native:
    if: >-
      github.repository == 'qigao/salts' &&
      github.event.pull_request.number == 1150 &&
      github.event.pull_request.head.repo.full_name == 'qigao/salts' &&
      github.event.pull_request.head.ref == 'test/cnet-module-once-tsan-1143' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft
    uses: ./.github/workflows/native-build.yml
    with:
      version: 2.3.0-cnet.once.sha${{ github.event.pull_request.head.sha }}
      builds: >-
        {"include":[{"id":"linux-release","runner":"ubuntu-24.04","family":"linux","preset":"linux-release-ci","build_dir":"build/linux-gcc-release","sdk":"linux-x64","sanitizer":"","native_thunks":"ON","benchmarks":"OFF","cross":false,"package":true,"compare":false,"artifact":false,"full_tests":true,"native":false,"execution":false,"projection":false,"armcontracts":false,"clang":false},{"id":"linux-arm64-release","runner":"ubuntu-24.04-arm","family":"linux","preset":"linux-arm64-release-ci","build_dir":"build/linux-arm64-release","sdk":"linux-arm64","sanitizer":"","native_thunks":"OFF","benchmarks":"OFF","cross":false,"package":true,"compare":false,"artifact":false,"full_tests":false,"native":false,"execution":false,"projection":false,"armcontracts":true,"clang":false},{"id":"windows-release","runner":"windows-2025","family":"windows","preset":"win-release-ci","build_dir":"build/Msvc-Release","sdk":"windows-x64","sanitizer":"","native_thunks":"ON","benchmarks":"OFF","cross":false,"package":true,"compare":false,"artifact":false,"full_tests":true,"native":false,"execution":false,"projection":false,"armcontracts":false,"clang":false},{"id":"macos-release","runner":"macos-15","family":"mac","preset":"mac-arm64-release-ci","build_dir":"build/mac-arm64-appleclang-package-release","sdk":"macos-arm64","sanitizer":"","native_thunks":"OFF","benchmarks":"OFF","cross":false,"package":true,"compare":false,"artifact":false,"full_tests":true,"native":false,"execution":false,"projection":false,"armcontracts":false,"clang":false},{"id":"android-arm64-v8a-release","runner":"ubuntu-24.04","family":"android","preset":"android-arm64-v8a-release-ci","build_dir":"build/android-arm64-v8a-release","sdk":"android-arm64-v8a","sanitizer":"","native_thunks":"OFF","benchmarks":"OFF","cross":true,"package":true,"compare":false,"artifact":false,"full_tests":false,"native":false,"execution":false,"projection":false,"armcontracts":false,"clang":false},{"id":"ios-arm64-release","runner":"macos-15","family":"ios","preset":"ios-arm64-release-ci","build_dir":"build/ios-arm64","sdk":"ios-arm64","sanitizer":"","native_thunks":"OFF","benchmarks":"OFF","cross":true,"package":true,"compare":false,"artifact":false,"full_tests":false,"native":false,"execution":false,"projection":false,"armcontracts":false,"clang":false,"triplet":"arm64-ios"}]}
    secrets: inherit

  pack:
    needs: six-rid-native
    uses: ./.github/workflows/sdk-package.yml
    with:
      version: 2.3.0-cnet.once.sha${{ github.event.pull_request.head.sha }}
    secrets: inherit

  attest:
    name: Verify immutable six-RID NuGet candidate artifact
    needs: [six-rid-native, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: salts-native-nuget
          path: build/cnet-once-candidate/dist
      - name: Check packaged ABI, manifests, and exact release graph
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile
          from xml.etree import ElementTree
          sha = os.environ["EXPECTED_SHA"]
          version = "2.3.0-cnet.once.sha" + sha
          pkg = Path("build/cnet-once-candidate/dist") / f"Salts.Native.{version}.nupkg"
          rids = ("linux-x64", "linux-arm64", "windows-x64", "macos-arm64",
                  "android-arm64-v8a", "ios-arm64")
          if not pkg.is_file():
              raise SystemExit("candidate NuGet archive missing: " + str(pkg))
          with zipfile.ZipFile(pkg) as archive:
              names = set(archive.namelist())
              manifest_names = {n for n in names if n.endswith("/salts-sdk-manifest.txt")}
              expected = {f"sdk/{rid}/salts-sdk-manifest.txt" for rid in rids}
              if manifest_names != expected:
                  raise SystemExit(f"wrong packaged RID set: {manifest_names ^ expected}")
              nuspec = [n for n in names if n.endswith(".nuspec")]
              if len(nuspec) != 1:
                  raise SystemExit("missing exact NuGet identity")
              meta = {
                  node.tag.rsplit("}", 1)[-1]: node.text
                  for node in ElementTree.fromstring(archive.read(nuspec[0])).iter()
                  if node.tag.rsplit("}", 1)[-1] in ("id", "version")
              }
              if (meta.get("id"), meta.get("version")) != ("Salts.Native", version):
                  raise SystemExit(f"wrong NuGet version or ID: {meta}")
              for rid in rids:
                  base = f"sdk/{rid}/"
                  manifest = dict(line.split("=", 1) for line in
                      archive.read(base + "salts-sdk-manifest.txt").decode("utf-8-sig").splitlines()
                      if "=" in line)
                  for key, want in (("version", version), ("commit", sha), ("profile", "release")):
                      if manifest.get(key) != want:
                          raise SystemExit(f"{rid}: {key} mismatch")
                  if base + "include/salts/thread.h" not in names:
                      raise SystemExit(f"{rid}: missing native ABI header")
                  header = archive.read(base + "include/salts/thread.h")
                  if rid != "windows-x64" and b"pthread_once_t native;" not in header:
                      raise SystemExit(f"{rid}: missing pthread_once ABI")
                  if base + "lib/cmake/Salts/SaltsConfig.cmake" not in names:
                      raise SystemExit(f"{rid}: missing CMake installed SDK")
              if any("/" not in n for n in names):
                  raise SystemExit("archive has unexpected unscoped members")
          digest = hashlib.sha256(pkg.read_bytes()).hexdigest()
          record = f"source={sha}\nversion={version}\nrids={','.join(rids)}\nsha256={digest}\npublished=false\n"
          Path("build/cnet-once-candidate/dist/provenance.txt").write_text(record)
          print(record)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cnet-once-six-rid-candidate-attestation
          path: build/cnet-once-candidate/dist/provenance.txt
          retention-days: 14
          if-no-files-found: error
      - name: Verify checkout unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"
