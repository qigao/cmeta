name: CNet installed P-384/SHA-384 ASan/UBSan

'on':
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - '.github/actions/setup-vcpkg-curl-cache/**'
      - '.github/workflows/cnet-installed-p384-asan.yml'
      - 'cmake/ci/github-packages.py'
      - 'cmake/ci/restore-vcpkg-cache.py'
      - 'cmake/ci/setup-vcpkg-curl-cache.py'
      - 'cnet/src/cnet_tls.c'
      - 'cnet/tests/CMakeLists.txt'
      - 'cnet/tests/cnet_tls_test.c'
      - 'cnet/tests/fixtures/p384-*.pem'
      - 'cnet/tests/fixtures/unsupported-ed25519-*.pem'
      - 'cnet/tests/package_config/strategy/**'
      - 'cnet/tests/verify_installed_cnet.cmake'
      - 'vcpkg-configuration.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cnet-installed-p384-asan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-installed-p384-asan:
    if: >-
      github.repository == 'qigao/salts' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'qigao/salts')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      BUILD_ROOT: ${{ github.workspace }}/build/cnet-installed-p384-asan
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure pinned vcpkg and curl package cache
        uses: ./.github/actions/setup-vcpkg-curl-cache

      - name: Prepare Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          command -v ninja >/dev/null 2>&1 || packages+=(ninja-build)
          command -v pkg-config >/dev/null 2>&1 || packages+=(pkg-config)
          command -v nasm >/dev/null 2>&1 || packages+=(nasm)
          pkg-config --exists libudev 2>/dev/null || packages+=(libudev-dev)
          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          command -v ninja >/dev/null
          command -v pkg-config >/dev/null
          command -v nasm >/dev/null
          pkg-config --exists libudev

      - name: Restore exact vcpkg packages from GitHub Packages with curl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 cmake/ci/restore-vcpkg-cache.py preset linux-dev-ci

      - name: Configure full SDK and CNet TLS source with ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          flags='-fsanitize=address -fsanitize=undefined -g -fno-omit-frame-pointer'
          cmake --preset linux-dev-ci -B "$BUILD_ROOT" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$BUILD_ROOT/install" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_TESTS=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=ON \
            -DENABLE_SANITIZER_THREAD=OFF \
            -DCMAKE_C_FLAGS="$flags" \
            -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address -fsanitize=undefined' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address -fsanitize=undefined'

      - name: Build installable SDK and in-tree TLS regression
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_ROOT" --parallel 2
          cmake --install "$BUILD_ROOT"

      - name: Verify production CNet TLS source and regression test are instrumented
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"]).resolve()
          build = Path(os.environ["BUILD_ROOT"])
          rows = json.loads((build / "compile_commands.json").read_text(encoding="utf-8"))
          required = {
              "production CNet TLS implementation": "cnet/src/cnet_tls.c",
              "in-tree P-384/SHA-384 TLS regression": "cnet/tests/cnet_tls_test.c",
          }
          for label, suffix in required.items():
              matches = [
                  row for row in rows
                  if Path(row["file"]).resolve() == root / suffix
              ]
              if not matches:
                  raise SystemExit(f"{label}: no compile unit found for {suffix}")
              # The same production source may legitimately be compiled into
              # more than one target. Every instance must be instrumented.
              for index, row in enumerate(matches, start=1):
                  command = row.get("command", " ".join(row.get("arguments", [])))
                  for flag in ("-fsanitize=address", "-fsanitize=undefined"):
                      if flag not in command:
                          raise SystemExit(
                              f"{label}: compile unit {index}/{len(matches)} missing {flag}: {suffix}"
                          )
              print(f"{label}: verified {len(matches)} instrumented compile unit(s)")
          print("Verified ASan+UBSan instrumentation for CNet TLS implementation and regression tests.")
          PY

      - name: Run in-tree and installed CNet TLS acceptance
        shell: bash
        run: |
          set -euo pipefail
          # The installed consumer is a separate CMake project. Its executable
          # must link ASan/UBSan before loading the instrumented installed DSO.
          export CFLAGS='-fsanitize=address -fsanitize=undefined -g -fno-omit-frame-pointer'
          export CXXFLAGS='-fsanitize=address -fsanitize=undefined -g -fno-omit-frame-pointer'
          export LDFLAGS='-fsanitize=address -fsanitize=undefined'
          ctest --test-dir "$BUILD_ROOT" -C RelWithDebInfo \
            --output-on-failure --no-tests=error \
            -R '^(cnet_tls_test|cnet_installed_sdk_test)$'

      - name: Verify installed C11 consumer instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"]).resolve()
          build = Path(os.environ["BUILD_ROOT"])
          consumer = build / "cnet/tests/installed-strategy/consumer-build"
          rows = json.loads((consumer / "compile_commands.json").read_text(encoding="utf-8"))
          source = root / "cnet/tests/package_config/strategy/p384_tls.c"
          matches = [row for row in rows if Path(row["file"]).resolve() == source]
          if len(matches) != 1:
              raise SystemExit(f"installed C11 consumer: expected one compile unit, found {len(matches)}")
          command = matches[0].get("command", " ".join(matches[0].get("arguments", [])))
          for flag in ("-fsanitize=address", "-fsanitize=undefined"):
              if flag not in command:
                  raise SystemExit(f"installed C11 consumer missing {flag}")
          cache = (consumer / "CMakeCache.txt").read_text(encoding="utf-8")
          linker_rows = [line for line in cache.splitlines()
                         if line.startswith("CMAKE_EXE_LINKER_FLAGS:STRING=")]
          if len(linker_rows) != 1 or any(
              flag not in linker_rows[0]
              for flag in ("-fsanitize=address", "-fsanitize=undefined")
          ):
              raise SystemExit("installed C11 consumer linker flags are not ASan/UBSan-instrumented")
          print("Verified installed C11 consumer compile and link instrumentation.")
          PY

      - name: Preserve CNet sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnet-installed-p384-asan-ubsan
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/cnet-installed-p384-asan/Testing/Temporary/LastTest.log
            build/cnet-installed-p384-asan/compile_commands.json
            build/cnet-installed-p384-asan/cnet/tests/installed-strategy/consumer-build/compile_commands.json
