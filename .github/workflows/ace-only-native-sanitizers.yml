name: Salts 3 sole CMeta ACE CFlow installed source sanitizers

# Instrument the sole installed Salts 3.0 CMeta/ACE/CFlow owner with the
# sole pinned native SaltsCore 0.1 owner. No legacy 2.3 or profile switch.
on:
  pull_request:
    paths:
      - ".github/workflows/ace-only-native-sanitizers.yml"
      - "tools/check_ace_only_sources.py"
      - "cmake/SaltsConfig.cmake.in"
      - "cmake/ci/core-backed-consumer/**"
      - "cmake/ci/core-backed-original-tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/ace-only-source-cutover.yml"
      - "cmeta/**"
      - "plugin/**"
      - "component/**"
      - "component-runtime/**"
      - "component-plugin/**"
      - "cflow/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/ace-only-native-sanitizers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts3-native-sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  salts3-native-sanitizers:
    name: Installed Salts 3.0 ${{ matrix.kind }} sole native owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - kind: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - kind: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts-core
          ref: 910b272841d77f1b56ea703116adc1380f481ccc
          path: _core_owner
          persist-credentials: false
      - name: Validate instrumented CTest selection is well quoted
        shell: bash
        run: |
          set -euo pipefail
          python3 _core_owner/tools/check_ci_ctest_regex.py \
            .github/workflows/ace-only-native-sanitizers.yml
      - name: Verified compiler output cache
        uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: salts3-native-sanitizers-${{ matrix.kind }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Canonical vcpkg and curl-only cached Core SIMDe dependency
        id: cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: _core_owner
          features: simd
      - name: Install exact shared Core owners and static SIMD with instrumentation
        shell: bash
        env:
          CORE_TOOLCHAIN: ${{ steps.cache.outputs.toolchain_file }}
        run: |
          set -euo pipefail
          python3 tools/check_ace_only_sources.py --core-root _core_owner
          test "$(git -C _core_owner rev-parse HEAD)" = \
            910b272841d77f1b56ea703116adc1380f481ccc
          prefix="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          cmake -S _core_owner -B build-instrumented-core-${{ matrix.kind }} \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF \
            -DSALTSCORE_BUILD_TINYTEST=ON -DSALTSCORE_BUILD_SIMD=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$CORE_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_FEATURES=simd \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build build-instrumented-core-${{ matrix.kind }} --parallel 2
          cmake --install build-instrumented-core-${{ matrix.kind }} \
            --config RelWithDebInfo
      - name: Install sole Salts 3.0 CMeta ACE CFlow package
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          salts="$RUNNER_TEMP/salts3-asan-${{ matrix.kind }}"
          cmake -S . -B build-instrumented-salts-${{ matrix.kind }} \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_PREFIX_PATH=$core" "-DCMAKE_INSTALL_PREFIX=$salts"
          cmake --build build-instrumented-salts-${{ matrix.kind }} --parallel 2
          cmake --install build-instrumented-salts-${{ matrix.kind }} \
            --config RelWithDebInfo
          test -f "$salts/lib/cmake/Salts/SaltsTargets.cmake"
      - name: Build all thirteen original CMeta ACE CFlow conformance suites
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          salts="$RUNNER_TEMP/salts3-asan-${{ matrix.kind }}"
          cmake -S cmake/ci/core-backed-original-tests \
            -B build-instrumented-parity-${{ matrix.kind }} -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DSALTS_SOURCE_ROOT=$GITHUB_WORKSPACE" \
            "-DCMAKE_PREFIX_PATH=$salts;$core" \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          cmake --build build-instrumented-parity-${{ matrix.kind }} --parallel 2
      - name: Build installed C11 and C++17 SIMD reflection consumers
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          salts="$RUNNER_TEMP/salts3-asan-${{ matrix.kind }}"
          cmake -S cmake/ci/core-backed-consumer \
            -B build-instrumented-consumer-${{ matrix.kind }} -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DSALTS_FIXTURE_ROOT=$GITHUB_WORKSPACE" \
            "-DCMAKE_PREFIX_PATH=$salts;$core" \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          cmake --build build-instrumented-consumer-${{ matrix.kind }} --parallel 2
      - name: Execute full original source parity under fail-on-report sanitizers
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-asan-${{ matrix.kind }}"
          export LD_LIBRARY_PATH="$core/lib:${LD_LIBRARY_PATH:-}"
          if [[ '${{ matrix.kind }}' == 'asan-ubsan' ]]; then
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1:abort_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          else
            export TSAN_OPTIONS='halt_on_error=1:exitcode=66'
          fi
          # Fail closed if a fixture/test disappears during source extraction.
          ctest --test-dir build-instrumented-parity-${{ matrix.kind }} \
            -C RelWithDebInfo -N -R '^salts3[.]original[.][a-z0-9_]+$' |
            grep -E '^Total Tests: 13$'
          ctest --test-dir build-instrumented-parity-${{ matrix.kind }} \
            -C RelWithDebInfo --output-on-failure --no-tests=error \
            --timeout 120 --repeat until-fail:3 \
            -R '^salts3[.]original[.][a-z0-9_]+$'
          for lang in c11 cpp17; do
            ctest --test-dir build-instrumented-consumer-${{ matrix.kind }} \
              -C RelWithDebInfo --output-on-failure --no-tests=error \
              --timeout 120 --repeat until-fail:3 \
              -R "^sdk[.]salts3[.]simd_reflection_${lang}$"
          done
      - name: Record real compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-salts3-${{ matrix.kind }}-ctest
          path: |
            build-instrumented-parity-${{ matrix.kind }}/Testing/Temporary/LastTest.log
            build-instrumented-consumer-${{ matrix.kind }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
