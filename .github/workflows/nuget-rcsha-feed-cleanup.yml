name: Audit or retire a historic Salts.Native rc.sha package
'on':
  workflow_dispatch:
    inputs:
      version:
        description: "Exact historic 2.3.0-rc.sha<40-hex> package version"
        type: string
        required: true
      action:
        type: choice
        options: [audit, delete]
        default: audit
        required: true
      confirmation:
        description: "For delete: type DELETE:<exact version>"
        type: string
        required: false
permissions:
  contents: read
jobs:
  inspect-one:
    if: github.repository == 'qigao/salts' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: salts-nuget-rcsha-maintenance
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ inputs.version }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set isolated NuGet package directory
        shell: bash
        run: echo "NUGET_PACKAGES=$RUNNER_TEMP/isolated-salts-nuget-packages" >> "$GITHUB_ENV"
      - name: Validate exact version and destructive confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^2[.]3[.]0-rc[.]sha[0-9a-f]{40}$ ]]
          [[ "$ACTION" == audit || "$ACTION" == delete ]]
          if [[ "$ACTION" == delete ]]; then
            [[ "$CONFIRMATION" == "DELETE:$PACKAGE_VERSION" ]]
          fi
          python3 packaging/nuget/feed_hygiene.py policy "$GITHUB_WORKSPACE"
      - name: Inventory authenticated GitHub Packages version IDs
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate '/users/qigao/packages/nuget/Salts.Native/versions?per_page=100' \
            > "$RUNNER_TEMP/versions.json"
          python3 packaging/nuget/feed_hygiene.py versions "$RUNNER_TEMP/versions.json" \
            | tee "$RUNNER_TEMP/package-inventory.json"
          python3 - "$RUNNER_TEMP/versions.json" "$PACKAGE_VERSION" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_text()
          wanted, output = sys.argv[2], pathlib.Path(sys.argv[3])
          decoder, pos, matches = json.JSONDecoder(), 0, []
          while pos < len(data):
              while pos < len(data) and data[pos].isspace():
                  pos += 1
              if pos == len(data):
                  break
              page, pos = decoder.raw_decode(data, pos)
              if not isinstance(page, list):
                  raise SystemExit("GitHub API response was not a versions list")
              matches.extend(p for p in page if p.get("name") == wanted)
          if len(matches) != 1 or not isinstance(matches[0].get("id"), int):
              raise SystemExit("Missing or ambiguous exact package version ID")
          with output.open("a") as fd:
              fd.write(f"package_id={matches[0]['id']}\n")
          PY
      - name: Refuse any version with an official Git tag or Release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib import request, error
          version, token = os.environ["PACKAGE_VERSION"], os.environ["GH_TOKEN"]
          for suffix in (f"git/ref/tags/v{version}", f"releases/tags/v{version}"):
              url = "https://api.github.com/repos/qigao/salts/" + suffix
              req = request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with request.urlopen(req, timeout=20) as response:
                      raise SystemExit(f"Official ref exists: {suffix} ({response.status})")
              except error.HTTPError as exc:
                  if exc.code != 404:
                      raise SystemExit(f"Cannot verify absence of {suffix}: HTTP {exc.code}")
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore EXACT version and inspect extracted SDK bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          cat > "$RUNNER_TEMP/probe/probe.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="Salts.Native" Version="$PACKAGE_VERSION"/></ItemGroup>
          </Project>
          EOF
          cfg="$RUNNER_TEMP/probe/nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$cfg"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GH_TOKEN" \
            --store-password-in-clear-text --configfile "$cfg"
          dotnet restore "$RUNNER_TEMP/probe/probe.csproj" --configfile "$cfg" \
            --packages "$NUGET_PACKAGES" --force --no-cache
          sdk="$NUGET_PACKAGES/salts.native/$PACKAGE_VERSION"
          test -d "$sdk"
          python3 packaging/nuget/feed_hygiene.py inspect-dir "$PACKAGE_VERSION" "$sdk" \
            | tee "$RUNNER_TEMP/confirmed-incomplete.json"
          find "$sdk/sdk" -type f -name salts-sdk-manifest.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/manifests-sha256.txt"
      - name: Delete ONLY the exact verified incomplete candidate
        if: inputs.action == 'delete'
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.versions.outputs.package_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONFIRMATION" == "DELETE:$PACKAGE_VERSION" ]]
          test -s "$RUNNER_TEMP/confirmed-incomplete.json"
          gh api -X DELETE "/users/qigao/packages/nuget/Salts.Native/versions/$PACKAGE_ID"
          gh api --paginate '/users/qigao/packages/nuget/Salts.Native/versions?per_page=100' \
            > "$RUNNER_TEMP/versions-after.json"
          python3 - "$RUNNER_TEMP/versions-after.json" "$PACKAGE_VERSION" <<'PY'
          import json, pathlib, sys
          data, version = pathlib.Path(sys.argv[1]).read_text(), sys.argv[2]
          decoder, pos = json.JSONDecoder(), 0
          while pos < len(data):
              while pos < len(data) and data[pos].isspace():
                  pos += 1
              if pos >= len(data):
                  break
              page, pos = decoder.raw_decode(data, pos)
              if any(v.get("name") == version for v in page):
                  raise SystemExit("Deleted version still present in authenticated feed")
          PY
          echo "Confirmed retired exact $PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-secret audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salts-rcsha-feed-audit
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/package-inventory.json
            ${{ runner.temp }}/confirmed-incomplete.json
            ${{ runner.temp }}/manifests-sha256.txt
