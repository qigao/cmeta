name: CMeta-CFlow Lean contracts

# This workflow owns only Lean proofs and generated-header consistency. Native
# SDK and sanitizer validation remain in their dedicated LLVM workflows.
on:
  pull_request:
    paths:
      - ".github/workflows/cmeta-cflow-calculus.yml"
      - "formal/cmeta_cflow_calculus/**"
      - "cmeta/include/cmeta/generated/builtin_signature_manifest.h"
      - "cflow/include/cflow/generated/builtin_operator_policy.h"
      - "cflow/include/cflow/generated/machine_schema.h"
  push:
    branches: [master]
    paths:
      - ".github/workflows/cmeta-cflow-calculus.yml"
      - "formal/cmeta_cflow_calculus/**"
      - "cmeta/include/cmeta/generated/builtin_signature_manifest.h"
      - "cflow/include/cflow/generated/builtin_operator_policy.h"
      - "cflow/include/cflow/generated/machine_schema.h"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lean:
    name: Lean LLVM build and test
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true
          lake-package-directory: formal/cmeta_cflow_calculus
      - name: Verify generated signature manifest
        working-directory: formal/cmeta_cflow_calculus
        run: lake exe cmeta-signature-gen --check ../../cmeta/include/cmeta/generated/builtin_signature_manifest.h
      - name: Verify generated CFlow operator policy
        working-directory: formal/cmeta_cflow_calculus
        run: lake exe cflow-operator-policy-gen --check ../../cflow/include/cflow/generated/builtin_operator_policy.h
      - name: Verify generated CFlow Machine schema
        working-directory: formal/cmeta_cflow_calculus
        run: lake exe cflow-machine-schema-gen --check ../../cflow/include/cflow/generated/machine_schema.h
