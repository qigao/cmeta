name: Salts Configurator ServiceHost LLVM SDK
on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/SaltsConfig.cmake.in"
      - "tests/**"
      - "cmeta/**"
      - "cflow/**"
      - "component-runtime/**"
      - "plugin/**"
      - "tools/check_ace_only_sources.py"
      - "tools/audit_native_owner.py"
      - "utils/**"
      - ".github/workflows/ace-only-source-cutover.yml"
      - ".github/workflows/ace-only-native-sanitizers.yml"
  push:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "tools/check_ace_only_sources.py"
      - "tools/audit_native_owner.py"
      - ".github/workflows/ace-only-source-cutover.yml"
      - ".github/workflows/ace-only-native-sanitizers.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-ace:
    name: Configurator ServiceHost Clang tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select protected runner-native LLVM
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@22ab039b6505c06e7a2f03f723305050d775ecf3
        with:
          build-type: Release
          obfuscator: "true"
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts-core
          ref: cfc1ed0d24364689b10ef7a85cff28d8776eb7db
          path: _core_owner
          persist-credentials: false
      - name: Check no duplicate native source owners
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ace_only_sources.py --core-root _core_owner
          test "$(git -C _core_owner rev-parse HEAD)" = cfc1ed0d24364689b10ef7a85cff28d8776eb7db
      - name: Install exact qualified native Core and test-only TinyTest
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _core_owner -B build-core -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_COMPILER_TOOLCHAIN_FILE" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/core-sdk"
          cmake --build build-core --config Release --parallel 2
          cmake --install build-core --config Release
      - name: Build and install the sole Salts native graph
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-salts -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_COMPILER_TOOLCHAIN_FILE" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/core-sdk" \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/ace-sdk"
          cmake --build build-salts --config Release --parallel 2
          cmake --install build-salts --config Release
      - name: Run original native C11 C++17 DSO and CFlow tests
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/core-sdk/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build-salts -C Release --no-tests=error \
            --output-on-failure --timeout 120
          python3 tools/audit_native_owner.py \
            --core-tools _core_owner/tools \
            --core-prefix "$RUNNER_TEMP/core-sdk" --salts-prefix "$RUNNER_TEMP/ace-sdk" \
            --build-dir build-salts --report build-salts/ace-one-owner-audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-only-source-llvm
          path: |
            build-salts/Testing/Temporary/LastTest.log
            build-salts/ace-one-owner-audit.json
          if-no-files-found: warn
