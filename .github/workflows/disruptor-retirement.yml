name: Disruptor retirement ownership TSan

on:
  pull_request:
    paths:
      - 'concurrency/src/disruptor.c'
      - 'concurrency/tests/retirement/**'
      - 'platform/src/thread_posix.c'
      - 'platform/include/salts/thread.h'
      - '.github/workflows/disruptor-retirement.yml'
  push:
    branches: [master]
    paths:
      - 'concurrency/src/disruptor.c'
      - 'concurrency/tests/retirement/**'
      - 'platform/src/thread_posix.c'
      - 'platform/include/salts/thread.h'
      - '.github/workflows/disruptor-retirement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc-tsan:
    name: Exact source GCC TSan (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure real Disruptor and Platform source with TSan
        run: >-
          cmake -S concurrency/tests/retirement -B build/retirement-tsan
          -G Ninja -DCMAKE_C_COMPILER=gcc
          -DSALTS_RETIREMENT_SANITIZER=tsan
      - name: Build both TSan regression targets
        run: cmake --build build/retirement-tsan --parallel 2
      - name: Verify cached-frontier ownership under repeated TSan execution
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: >-
          ctest --test-dir build/retirement-tsan
          --repeat until-fail:5 --output-on-failure
      - name: Preserve source TSan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-tsan-source-evidence
          if-no-files-found: ignore
          path: build/retirement-tsan/Testing/Temporary/LastTest.log

  gcc-asan-ubsan:
    name: Exact source GCC ASan/UBSan (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -S concurrency/tests/retirement -B build/retirement-asan
          -G Ninja -DCMAKE_C_COMPILER=gcc
          -DSALTS_RETIREMENT_SANITIZER=asan-ubsan
      - name: Compile instrumented Concurrency source
        run: cmake --build build/retirement-asan --parallel 2
      - name: Run exact ownership and capacity regressions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build/retirement-asan
          --output-on-failure
      - name: Preserve sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-asan-ubsan-source-evidence
          if-no-files-found: ignore
          path: build/retirement-asan/Testing/Temporary/LastTest.log

  compiler-baseline:
    name: Real source ${{ matrix.compiler }} C11 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone, strict C11 production source
        run: >-
          cmake -S concurrency/tests/retirement
          -B build/retirement-${{ matrix.compiler }}
          -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DSALTS_RETIREMENT_SANITIZER=none
      - name: Compile complete original Disruptor and POSIX Platform
        run: cmake --build build/retirement-${{ matrix.compiler }} --parallel 2
      - name: Exercise FIFO, reverse gaps and MPMC five times
        run: >-
          ctest --test-dir build/retirement-${{ matrix.compiler }}
          --repeat until-fail:5 --output-on-failure
