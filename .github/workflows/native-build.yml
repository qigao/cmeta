          EOF
        if: matrix.id == 'macos-release'
      - name: Verify installed macOS TinyTest native TLS ABI (C11)
        if: matrix.id == 'macos-release'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/macos-arm64"
          archive="$prefix/lib/libtinytest.a"
          test -f "$archive"
          # The SDK may not expose GNU GCC's emulated TLS wrapper when
          # AppleClang C11 consumers expect one native Mach-O TLS variable.
          if nm -gU "$archive" | grep -F '___emutls_v.ttest_active_config__'; then
            echo 'TinyTest SDK contains incompatible GCC emulated TLS' >&2
            exit 1
          fi
          nm -gU "$archive" | grep -F ' _ttest_active_config__'
          temp="$RUNNER_TEMP/salts-tinytest-installed-c11"
          mkdir -p "$temp"
          cat > "$temp/consumer.c" <<'EOF'
          #include <tinytest.h>
          spec("installed TinyTest C11 native TLS") {
              it("links the one installed TinyTest runtime") {
                  check_equal(1, 1);
              }
          }
          EOF
          /usr/bin/clang -std=c11 -O2 -arch arm64 -I"$prefix/include" \
            "$temp/consumer.c" "$archive" -o "$temp/consumer"
          "$temp/consumer"
      # Test-only artifact on PR builds. Normal release packaging retains the
      # canonical salts-sdk-macos name for the existing SDK aggregation job.
      - uses: actions/upload-artifact@v4
