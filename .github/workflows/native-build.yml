name: Build and test native profiles
'on':
  workflow_call:
    inputs:
      builds:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    # Allow the former build budget plus up to three selected test suites.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.builds) }}
    env:
      PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # CNet comparisons create a worktree at the PR base commit.
          fetch-depth: ${{ matrix.compare && '0' || '1' }}
          persist-credentials: false
      - name: Select iOS cache namespace
        if: matrix.family == 'ios'
        shell: bash
        run: echo "X_VCPKG_NUGET_ID_PREFIX=vcpkg-cache" >> "$GITHUB_ENV"
      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - name: Configure shared vcpkg cache
        id: shared_deps
        # Bootstrap the pinned tool independently of hosted runner image updates (vcpkg-cache#186).
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Prepare build host
        uses: ./.github/actions/setup-build-host
      - name: Restore native compiler cache
        id: compiler_cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: ${{ matrix.id }}
      - name: Prepare macOS GNU compiler
        if: matrix.family == 'mac' && !matrix.clang && matrix.id != 'macos-release'
        shell: bash
        run: |
          set -euo pipefail
          brew install gcc@15
          echo "$(brew --prefix gcc@15)/bin" >> "$GITHUB_PATH"
      - name: Prepare Linux Clang compiler
        if: matrix.family == 'linux' && matrix.clang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install --yes clang
      - name: Setup build environment
        if: matrix.family == 'android'
        id: android_env
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          test -n "${ANDROID_NDK_HOME:-}"
          cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$cache"
          ndk_revision="$(awk -F'= ' '/Pkg.Revision/ {print $2}' "$ANDROID_NDK_HOME/source.properties")"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=arm64-android" >> "$GITHUB_OUTPUT"
          echo "ndk=$ndk_revision" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg binary cache
        if: matrix.family == 'android'
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.android_env.outputs.image }}-${{ steps.android_env.outputs.triplet }}-ndk-${{ steps.android_env.outputs.ndk }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision
            }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.android_env.outputs.image }}-${{ steps.android_env.outputs.triplet }}-ndk-${{ steps.android_env.outputs.ndk }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-
      - name: Discover Visual Studio
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio with the x64 C++ toolchain was not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Configure and build all modules
        id: build_unix
        if: matrix.family != 'windows' && !matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          # Use POSIX-style positional parameters instead of an empty array:
          # macOS ships Bash 3.2, where ${empty_array[@]} under "set -u"
          # raises "unbound variable" even with the array declared.
          set --
          if [ "${{ matrix.sanitizer }}" = 'asan-ubsan' ]; then
            set -- -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=ON -DENABLE_SANITIZER_THREAD=OFF
          elif [ "${{ matrix.sanitizer }}" = 'tsan' ]; then
            set -- -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF -DENABLE_SANITIZER_THREAD=ON
          fi
          cmake --preset "${{ matrix.preset }}" -DCMAKE_SUPPRESS_REGENERATION=ON -DENABLE_TESTS=ON -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DCMETA_BUILD_BENCHMARKS=OFF -DCMETA_BUILD_NATIVE_THUNKS=${{ matrix.native_thunks }} -DNATIVE_IO_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCOROUTINE_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCNET_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCFLOW_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCONCURRENCY_BUILD_BENCHMARKS=${{ matrix.benchmarks }} "$@"
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Configure and build all modules on Windows
        id: build_windows
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          cmake --preset "${{ matrix.preset }}" -DCMAKE_SUPPRESS_REGENERATION=ON -DENABLE_TESTS=ON -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DCMETA_BUILD_BENCHMARKS=OFF -DCMETA_BUILD_NATIVE_THUNKS=${{ matrix.native_thunks }} -DNATIVE_IO_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCOROUTINE_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCNET_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCFLOW_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DCONCURRENCY_BUILD_BENCHMARKS=${{ matrix.benchmarks }}
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
          if errorlevel 1 exit /b 1
      # #1168: test the actual native completion/cancel crossover, not compilation alone.
      - name: Qualify actual NativeIO readiness cancel crossover (Unix)
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && !matrix.cross && (matrix.family == 'linux' || matrix.family == 'mac') }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" --no-tests=error \
            --output-on-failure --timeout 30 --repeat until-fail:12 \
            -R '^native_io_kernel_dispatch_test$'
          echo 'NativeIO real kernel readiness/cancel: 12 repeats PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Qualify actual NativeIO GQCS cancel crossover (Windows)
        if: ${{ !cancelled() && steps.build_windows.outcome == 'success' && matrix.family == 'windows' }}
        timeout-minutes: 5
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 30 --repeat until-fail:12 -R "^native_io_iocp_dispatch_test$"
          if errorlevel 1 exit /b 1
      - name: Configure and build all cross-platform modules
        if: matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.preset }}" -DCMAKE_SUPPRESS_REGENERATION=ON
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Run Actor, mailbox and ACE throughput benchmarks (Unix)
        id: actor_bench_unix
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.benchmarks == 'ON' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" --no-tests=error -LE '^$' \
            -R '^(cflow_(actor_mailbox|ace_throughput)_benchmark|thread_pool_lf_benchmark)$' --repeat until-fail:5 -V \
            --output-log '${{ matrix.build_dir }}/actor-mailbox-benchmark.log'
      - name: Run Actor, mailbox and ACE throughput benchmarks (Windows)
        id: actor_bench_windows
        if: ${{ !cancelled() && steps.build_windows.outcome == 'success' && matrix.benchmarks == 'ON' }}
        timeout-minutes: 10
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --no-tests=error -LE "^$" -R "^(cflow_(actor_mailbox|ace_throughput)_benchmark|thread_pool_lf_benchmark)$" --repeat until-fail:5 -V --output-log "${{ matrix.build_dir }}/actor-mailbox-benchmark.log"
          if errorlevel 1 exit /b 1
      - name: Upload Actor and mailbox benchmark evidence
        if: ${{ always() && (steps.actor_bench_unix.outcome == 'success' || steps.actor_bench_unix.outcome == 'failure' || steps.actor_bench_windows.outcome == 'success' || steps.actor_bench_windows.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: cflow-actor-mailbox-${{ matrix.id }}
          path: ${{ matrix.build_dir }}/actor-mailbox-benchmark.log
          if-no-files-found: error
          retention-days: 30
      - name: Measure CNet progress strategies (Unix)
        id: progress_bench_unix
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.benchmarks == 'ON' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" --no-tests=error -LE '^$' \
            -R '^cnet_progress_strategy_benchmark$' -V \
            --output-log '${{ matrix.build_dir }}/cnet-progress-strategy.log'
      - name: Measure CNet progress strategies (Windows)
        id: progress_bench_windows
        if: ${{ !cancelled() && steps.build_windows.outcome == 'success' && matrix.benchmarks == 'ON' }}
        timeout-minutes: 5
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --no-tests=error -LE "^$" -R "^cnet_progress_strategy_benchmark$" -V --output-log "${{ matrix.build_dir }}/cnet-progress-strategy.log"
          if errorlevel 1 exit /b 1
      - name: Upload CNet progress strategy measurements
        if: ${{ always() && (steps.progress_bench_unix.outcome == 'success' || steps.progress_bench_unix.outcome == 'failure' || steps.progress_bench_windows.outcome == 'success' || steps.progress_bench_windows.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: cnet-progress-strategy-${{ matrix.id }}
          path: ${{ matrix.build_dir }}/cnet-progress-strategy.log
          if-no-files-found: error
          retention-days: 30
      # Unicode conformance must execute (not merely compile) on each native OS.
      # Linux's full suite already covers these tests; do not run them twice there.
      - name: Qualify Unicode 17 conformance (Unix)
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && !matrix.full_tests && (matrix.family == 'linux' || matrix.family == 'mac') }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 120 -R '^(test_salts_(unicode|idna)($|_)|cnet_name_lookup(_dns)?_test$)'
      - name: Qualify Unicode 17 conformance (Windows)
        if: ${{ !cancelled() && steps.build_windows.outcome == 'success' && !matrix.full_tests && matrix.family == 'windows' }}
        timeout-minutes: 15
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 120 -R "^(test_salts_(unicode|idna)($|_)|cnet_name_lookup(_dns)?_test$)"
          if errorlevel 1 exit /b 1
      # PR 1085 isolated SG runtime gate.
      - name: Qualify SG Owner tests (Unix)
        if: ${{ !cancelled() && github.head_ref == 'feature/cnet-sg-host-policy-composition' && steps.build_unix.outcome == 'success' && matrix.execution && (matrix.family == 'linux' || matrix.family == 'mac') }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 90 -R 'cnet_sg_(hosted_gateway|handoff_owner)_test'
      - name: Qualify SG Owner tests (Windows)
        if: ${{ !cancelled() && github.head_ref == 'feature/cnet-sg-host-policy-composition' && steps.build_windows.outcome == 'success' && matrix.execution && matrix.family == 'windows' }}
        timeout-minutes: 10
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 90 -R "cnet_sg_(hosted_gateway|handoff_owner)_test"
          if errorlevel 1 exit /b 1
      - name: Run ACE sanitizer ownership contracts
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.sanitizer != '' }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" \
            --no-tests=error --output-on-failure --timeout 90 \
            -R '^(cmeta_native_component_(test|cpp_test|plugin_(abi_test|abi_cpp_test|dso_test|generation_test|scope_cpp_test|publication_test|act_native_io_test|runtime_failure_test|concurrency_test))|cmeta_fastpath_(component|pattern)(_cpp)?_test|cmeta_ace_sync(_cpp)?_test|cmeta_ace_leader_followers_contract(_cpp)?_test|platform_ace_leader_followers(_cpp)?_test|native_io_readiness_(lifetime|accept)_test|native_io_header_cpp_test|thread_pool_test|thread_pool_lf_test|disruptor_test|concurrency_header_cpp_test|cflow_reactive_test|cflow_actor_test|cflow_ace_pipes_filters_test|cflow_ace_half_sync_async_test|cnet_ace_acceptor_connector_test|cnet_tcp_endpoint_test|cnet_(progress_strategy|owner_placement|destination_policy|client_pool|recovery_policy|managed_dial|handoff|manager|event|dispatcher|sg_hosted_gateway|sg_handoff_owner|external_gateway_owner|native_io_sharded_ownership|shards_multi_owner)_test)$'
      - name: Repeat #1105 Actor worker/foreign-stop under source sanitizers
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.sanitizer != '' && (github.head_ref == 'fix/cflow-1105-cross-thread-stop' || github.head_ref == 'integrate/cflow-1107-master') }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" \
            --no-tests=error --output-on-failure --timeout 90 \
            --repeat until-fail:50 -R '^cflow_actor_test$'
      # Full functional qualification and performance sampling are different
      # gates. CNet enables separately labeled benchmark CTests when native
      # benchmark binaries are built for downstream measurement. The host
      # qualification runs every non-benchmark test; the reusable benchmark
      # workflow runs the labeled performance workloads from the exact SHA.
      - name: Run complete Unix integration tests
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.full_tests }}
        timeout-minutes: 30
        shell: bash
        run: ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 60 -LE benchmark
      - name: Run complete Windows ACE integration tests
        if: ${{ !cancelled() && steps.build_windows.outcome == 'success' && matrix.full_tests }}
        timeout-minutes: 30
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 60 -LE benchmark
          if errorlevel 1 exit /b 1
      - name: Run Unix native and plugin contracts
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.native }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 60 -V \
            -R '^(platform_fastpath_|cmeta_trace_|cmeta_fastpath_|cmeta_data_reflect_|tinymock_reflect_|cmeta_coroutine|coro_executor|cmeta_native_|cmeta_plugin_native_|cflow_io_native_test$|cflow_io_file_test$)'
      - name: Run Windows native and plugin contracts
        if: ${{ !cancelled() && steps.build_windows.outcome == 'success' && matrix.native }}
        timeout-minutes: 30
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 60 -V -R "^(platform_fastpath_|cmeta_trace_|cmeta_fastpath_|cmeta_data_reflect_|tinymock_reflect_|cmeta_coroutine|coro_executor|cmeta_native_|cmeta_plugin_native_|cmeta_plugin_windows_search_test$|cflow_io_native_test$|cflow_io_file_test$|cflow_execution_test$|cflow_interface_reflection_test$|cflow_executor_dso_test$)"
          if errorlevel 1 exit /b 1
      - name: Run POSIX execution and nested CSTL contracts
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.execution }}
        timeout-minutes: 30
        shell: bash
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure -R "^(test_cmeta_process$|native_io_test$|cflow_io_(actor|native_adapter|pipe)_test$|tinytest_regression_runtime$|cnet_.*_test$|native_ipc(_header_cpp)?_test$|cmeta_native_|thread_pool_test$|thread_pool_lf_test$|thread_pool_lf_installed_test$|disruptor_test$|concurrency_rcu_test$|concurrency_typed_primitives_test$|concurrency_typed_rcu_cpp_test$|concurrency_header_cpp_test$|platform_header_cpp_test$|platform_thread_test$|test_object_pool$|cflow_stream_terminal_test$|cflow_(owner_executor|owner_scheduler|reactive|actor|machine_instance|statechart_instance|statechart_actor|execution)_test$|cstl_generic_identity_test$|cstl_typed_decl_cpp_test$)"
      - name: Run Windows execution and nested CSTL contracts
        if: ${{ !cancelled() && steps.build_windows.outcome == 'success' && matrix.execution }}
        timeout-minutes: 30
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.preset }}" --output-on-failure -R "^(test_cmeta_process$|native_io_test$|cflow_io_(actor|native_adapter|pipe)_test$|tinytest_regression_runtime$|cnet_.*_test$|native_ipc(_header_cpp)?_test$|cmeta_native_|thread_pool_test$|thread_pool_lf_test$|thread_pool_lf_installed_test$|disruptor_test$|concurrency_rcu_test$|concurrency_typed_primitives_test$|concurrency_typed_rcu_cpp_test$|concurrency_header_cpp_test$|platform_header_cpp_test$|platform_thread_test$|test_object_pool$|cflow_stream_terminal_test$|cflow_(owner_executor|owner_scheduler|reactive|actor|machine_instance|statechart_instance|statechart_actor|execution)_test$|cstl_generic_identity_test$|cstl_typed_decl_cpp_test$)"
          if errorlevel 1 exit /b 1
      - name: Run reflected CFlow contracts
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.projection }}
        timeout-minutes: 30
        shell: bash
        run: |
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 60 -R '^(cflow_function_projection_test|cflow_execution_test|cflow_interface_reflection_test)$'
      - name: Run portable arm64 runtime and header tests
        if: ${{ !cancelled() && steps.build_unix.outcome == 'success' && matrix.armcontracts }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset linux-arm64-release-ci --no-tests=error --output-on-failure --timeout 60 -R '^(thread_pool_test|thread_pool_lf_test|thread_pool_lf_installed_test|concurrency_header_cpp_test|disruptor_test|cmeta_native_component.*|native_io_header_cpp_test|cmeta_header_cpp_test|cflow_header_cpp_test|cflow_owner_executor_test|cflow_owner_scheduler_test|cflow_reactive_test|cflow_actor_test|cflow_machine_instance_test|cflow_statechart_instance_test|cnet_header_cpp_test|cmeta_coroutine_completion_test|cmeta_coroutine_facade_test|coro_executor_test|coro_executor_header_cpp_test|cnet_api_test|cnet_progress_strategy_test|cnet_tls_test)$'
      - name: Compile PR-base modules for the CNet comparison
        if: matrix.compare
        shell: cmd
        env:
          CNET_COMPARE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set "BASELINE_SOURCE=%GITHUB_WORKSPACE%\build\pr-base"
          git worktree add --detach "%BASELINE_SOURCE%" "%CNET_COMPARE_BASE_SHA%"
          if errorlevel 1 exit /b 1
          cd /d "%BASELINE_SOURCE%"
          set "PROJECT_ROOT=%BASELINE_SOURCE%"
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          cmake --preset win-release-ci -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DCMETA_BUILD_BENCHMARKS=OFF -DNATIVE_IO_BUILD_BENCHMARKS=OFF -DCOROUTINE_BUILD_BENCHMARKS=OFF -DCNET_BUILD_BENCHMARKS=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-ci --parallel 2
          if errorlevel 1 exit /b 1
      - name: Isolate the baseline DSO runtime for the comparison
        if: matrix.compare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseline = Join-Path $env:GITHUB_WORKSPACE "build/pr-base"
          $binary = Join-Path $baseline "build/Msvc-Release/bin"
          if (-not (Test-Path -LiteralPath (Join-Path $binary "cnet.dll"))) { throw "Missing baseline CNet DSO" }
          $cache = Get-Content (Join-Path $baseline "build/Msvc-Release/CMakeCache.txt")
          $triplets = @($cache | Where-Object { $_ -match '^VCPKG_TARGET_TRIPLET:[^=]+=' })
          if ($triplets.Count -ne 1) { throw "Missing baseline target triplet" }
          $triplet = ($triplets[0] -split '=', 2)[1]
          # LOAD_WITH_ALTERED_SEARCH_PATH must resolve each revision's own dependencies.
          Copy-Item -Path (Join-Path $baseline "vcpkg_installed/$triplet/bin/*.dll") -Destination $binary
      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake --build --preset install-strip-linux-release-ci --parallel 2
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/include/cmeta/function.h"
          test -f "$prefix/include/cflow/function_projection.h"
          grep -F "cflow_function_typed_filter_projection_admit" "$prefix/include/cflow/function_projection.h"
          test -f "$prefix/include/cmeta/interface.h"
          grep -F "cmeta_function_abi_desc" "$prefix/include/cmeta/function.h"
          grep -F "cmeta_interface_desc_valid" "$prefix/include/cmeta/interface.h"
          grep -F "cmeta_interface_desc_equal" "$prefix/include/cmeta/interface.h"
          grep -F "FunctionAbi" "$prefix/include/cmeta/function.h"
          test -f "$prefix/include/tinytest/detail/equality.h"
          test -f "$prefix/include/tinymock.h"
          test -f "$prefix/include/tinymock_support.h"
          test -f "$prefix/include/tinymock_cmeta.h"
          test -f "$prefix/include/tinymock_value.h"
          test -f "$prefix/include/tinymock_function.h"
          test -f "$prefix/include/tinymock_history.h"
          test -f "$prefix/include/tinymock_actions.h"
          test -f "$prefix/include/tinymock_return.h"
          grep -F "Salts::TinyMock" "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -F "Salts::CFlow" "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          test -f "$prefix/include/unicode/salts_unicode.h"
          test -f "$prefix/include/unicode/salts_unicode_normalize.h"
          test -f "$prefix/include/idna/salts_idna.h"
          grep -Fq "Salts::Unicode" "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          # Installed C11/C++ tests already ran through the parent CTest preset.
          cat > "$prefix/salts-sdk-manifest.txt" <<EOF
          version=${{ inputs.version }}
          commit=${{ github.sha }}
          os=linux
          arch=x64
          profile=release
          vcpkg_cache_contract=${{ steps.shared_deps.outputs.contract_version }}
          vcpkg_cache_revision=${{ steps.shared_deps.outputs.cache_revision }}
          EOF
        if: matrix.package && matrix.id == 'linux-release'
      - uses: actions/upload-artifact@v4
        with:
          name: salts-sdk-linux-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9
        if: matrix.package && matrix.id == 'linux-release'
      - name: Install SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          cmd /d /c "call `"$env:VSINSTALL\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && cmake --build --preset install-win-release-ci --parallel 2"
          if ($LASTEXITCODE -ne 0) { throw "SDK installation failed" }

          $config = Join-Path $prefix "lib\cmake\Salts\SaltsConfig.cmake"
          $targets = Join-Path $prefix "lib\cmake\Salts\SaltsTargets.cmake"
          $functionHeader = Join-Path $prefix "include\cmeta\function.h"
          $projectionHeader = Join-Path $prefix "include\cflow\function_projection.h"
          $interfaceHeader = Join-Path $prefix "include\cmeta\interface.h"
          $tinyEqualityHeader = Join-Path $prefix "include\tinytest\detail\equality.h"
          $tinymockUmbrellaHeader = Join-Path $prefix "include\tinymock.h"
          $tinymockSupportHeader = Join-Path $prefix "include\tinymock_support.h"
          $tinymockHeader = Join-Path $prefix "include\tinymock_cmeta.h"
          $tinymockValueHeader = Join-Path $prefix "include\tinymock_value.h"
          $tinymockFunctionHeader = Join-Path $prefix "include\tinymock_function.h"
          $tinymockHistoryHeader = Join-Path $prefix "include\tinymock_history.h"
          $tinymockActionsHeader = Join-Path $prefix "include\tinymock_actions.h"
          $tinymockReturnHeader = Join-Path $prefix "include\tinymock_return.h"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "missing $config" }
          if (-not (Test-Path -LiteralPath $functionHeader -PathType Leaf)) { throw "missing $functionHeader" }
          if (-not (Test-Path -LiteralPath $projectionHeader -PathType Leaf)) { throw "missing $projectionHeader" }
          if (-not (Select-String -LiteralPath $projectionHeader -SimpleMatch "cflow_function_typed_filter_projection_admit" -Quiet)) { throw "missing typed FILTER projection in $projectionHeader" }
          if (-not (Test-Path -LiteralPath $interfaceHeader -PathType Leaf)) { throw "missing $interfaceHeader" }
          $interfaceText = Get-Content -LiteralPath $interfaceHeader -Raw
          if ($interfaceText -notmatch "cmeta_interface_desc_valid") { throw "missing canonical Interface reflection in $interfaceHeader" }
          if ($interfaceText -notmatch "cmeta_interface_desc_equal") { throw "missing canonical Interface equality in $interfaceHeader" }
          if (-not (Select-String -LiteralPath $functionHeader -SimpleMatch "cmeta_function_abi_desc" -Quiet)) { throw "missing cmeta_function_abi_desc in $functionHeader" }
          if (-not (Select-String -LiteralPath $functionHeader -SimpleMatch "FunctionAbi" -Quiet)) { throw "missing FunctionAbi in $functionHeader" }
          if (-not (Test-Path -LiteralPath $tinyEqualityHeader -PathType Leaf)) { throw "missing $tinyEqualityHeader" }
          if (-not (Test-Path -LiteralPath $tinymockUmbrellaHeader -PathType Leaf)) { throw "missing $tinymockUmbrellaHeader" }
          if (-not (Test-Path -LiteralPath $tinymockSupportHeader -PathType Leaf)) { throw "missing $tinymockSupportHeader" }
          if (-not (Test-Path -LiteralPath $tinymockHeader -PathType Leaf)) { throw "missing $tinymockHeader" }
          if (-not (Test-Path -LiteralPath $tinymockValueHeader -PathType Leaf)) { throw "missing $tinymockValueHeader" }
          if (-not (Test-Path -LiteralPath $tinymockFunctionHeader -PathType Leaf)) { throw "missing $tinymockFunctionHeader" }
          if (-not (Test-Path -LiteralPath $tinymockHistoryHeader -PathType Leaf)) { throw "missing $tinymockHistoryHeader" }
          if (-not (Test-Path -LiteralPath $tinymockActionsHeader -PathType Leaf)) { throw "missing $tinymockActionsHeader" }
          if (-not (Test-Path -LiteralPath $tinymockReturnHeader -PathType Leaf)) { throw "missing $tinymockReturnHeader" }
          if (-not (Select-String -LiteralPath $targets -SimpleMatch "Salts::TinyMock" -Quiet)) {
            throw "missing Salts::TinyMock export in $targets"
          }
          if (-not (Select-String -LiteralPath $targets -SimpleMatch "Salts::CFlow" -Quiet)) {
            throw "missing Salts::CFlow export in $targets"
          }
          $unicodeHeader = Join-Path $prefix "include\unicode\salts_unicode.h"
          if (-not (Test-Path -LiteralPath $unicodeHeader -PathType Leaf)) { throw "missing $unicodeHeader" }
          foreach ($relative in @("include\unicode\salts_unicode_normalize.h", "include\idna\salts_idna.h")) {
            $header = Join-Path $prefix $relative
            if (-not (Test-Path -LiteralPath $header -PathType Leaf)) { throw "missing $header" }
          }
          if (-not (Select-String -LiteralPath $targets -SimpleMatch "Salts::Unicode" -Quiet)) {
            throw "missing Salts::Unicode export in $targets"
          }
          # Installed C11/C++ tests already ran through the parent CTest preset.
          $manifest = @(
            "version=${{ inputs.version }}"
            "commit=${{ github.sha }}"
            "os=windows"
            "arch=x64"
            "profile=release"
            "vcpkg_cache_contract=${{ steps.shared_deps.outputs.contract_version }}"
            "vcpkg_cache_revision=${{ steps.shared_deps.outputs.cache_revision }}"
          ) -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $prefix "salts-sdk-manifest.txt"),
            $manifest + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )
        if: matrix.package && matrix.id == 'windows-release'
      - uses: actions/upload-artifact@v4
        with:
          name: salts-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9
        if: matrix.package && matrix.id == 'windows-release'
      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64 ;;
            ARM64) rid=macos-arm64 ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          prefix="$GITHUB_WORKSPACE/stage/sdk/$rid"
          cmake --build --preset install-strip-mac-arm64-release-ci --parallel 2
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/include/cmeta/function.h"
          test -f "$prefix/include/cflow/function_projection.h"
          grep -F "cflow_function_typed_filter_projection_admit" "$prefix/include/cflow/function_projection.h"
          test -f "$prefix/include/cmeta/interface.h"
          grep -F "cmeta_function_abi_desc" "$prefix/include/cmeta/function.h"
          grep -F "cmeta_interface_desc_valid" "$prefix/include/cmeta/interface.h"
          grep -F "cmeta_interface_desc_equal" "$prefix/include/cmeta/interface.h"
          grep -F "FunctionAbi" "$prefix/include/cmeta/function.h"
          test -f "$prefix/include/tinytest/detail/equality.h"
          test -f "$prefix/include/tinymock.h"
          test -f "$prefix/include/tinymock_support.h"
          test -f "$prefix/include/tinymock_cmeta.h"
          test -f "$prefix/include/tinymock_value.h"
