name: TurboBuild pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/turbo-build-pilot.yml'
      - 'pilot/turbo-build/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/turbo-build-pilot.yml'
      - 'pilot/turbo-build/**'

permissions:
  contents: read

concurrency:
  group: salts-turbo-build-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare-standalone-c11:
    name: Compare CMake and TurboBuild output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Salts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up TurboBuild v0.1.0
        id: turbo-build
        uses: qigao/turbo-build/.github/actions/setup-turbo-build@v0.1.0

      - name: Record exact source and compiler
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee build-commit.txt
          cc --version | tee compiler-version.txt
          cmake --version | tee cmake-version.txt
          mkdir -p build/turbo-build-pilot

      - name: Build probe through CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S pilot/turbo-build -B build/cmake-pilot -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake-pilot --parallel 2
          build/cmake-pilot/salts-turbo-build-probe > build/cmake-output.txt

      - name: Validate and build probe through TurboBuild
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.turbo-build.outputs.cli-path }}" validate pilot/turbo-build/buildfile.json
          "${{ steps.turbo-build.outputs.cli-path }}" build --jobs 2 --state build/turbo-build-pilot/state.bin pilot/turbo-build/buildfile.json
          build/turbo-build-pilot/probe > build/turbo-output.txt

      - name: Compare observable output and record hashes
        shell: bash
        run: |
          set -euo pipefail
          diff -u build/cmake-output.txt build/turbo-output.txt
          sha256sum build/cmake-output.txt build/turbo-output.txt | tee build/output-sha256.txt
          test "$(sha256sum build/cmake-output.txt | cut -d ' ' -f1)" = "$(sha256sum build/turbo-output.txt | cut -d ' ' -f1)"
          cat build/output-sha256.txt

      - name: Qualify conservative incremental behavior and failure propagation
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          bash pilot/turbo-build/qualify.sh "$TURBO_BUILD_CLI"

      - name: Configure the real Salts wsparser target with CMake File API
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          mkdir -p build/cmake-graph/.cmake/api/v1/query
          : > build/cmake-graph/.cmake/api/v1/query/codemodel-v2
          cmake -S pilot/turbo-build/cmake-graph -B build/cmake-graph \
            -DSALTS_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee build/cmake-graph-configure.log
          cmake --build build/cmake-graph --target cmeta_wsparser --parallel 2 2>&1 | tee build/cmake-graph-build.log
          python3 pilot/turbo-build/export_cmake_graph.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-dir "$GITHUB_WORKSPACE/build/cmake-graph" \
            --target cmeta_wsparser
          "$TURBO_BUILD_CLI" validate build/cmake-graph/turbo-build-qualification/buildfile.json

      - name: Build the exported CMake compile action through TurboBuild
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          evidence=build/cmake-graph/turbo-build-qualification
          "$TURBO_BUILD_CLI" build --jobs 1 --state "$evidence/state.bin" "$evidence/buildfile.json" 2>&1 | tee "$evidence/turbo-build.log"
          report="$evidence/graph-report.json"
          cmake_object="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["compileCommand"]["originalObject"])' "$report")"
          turbo_object="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["compileCommand"]["turboBuildObject"])' "$report")"
          cmake_hash="$(sha256sum "$cmake_object" | cut -d ' ' -f1)"
          turbo_hash="$(sha256sum "$turbo_object" | cut -d ' ' -f1)"
          {
            printf 'CMake object SHA-256: %s\n' "$cmake_hash"
            printf 'TurboBuild object SHA-256: %s\n' "$turbo_hash"
          } | tee "$evidence/object-sha256.txt"
          test "$cmake_hash" = "$turbo_hash"
          echo "Real Salts target object matches exactly."

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salts-turbo-build-pilot-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build-commit.txt
            compiler-version.txt
            cmake-version.txt
            build/cmake-output.txt
            build/turbo-output.txt
            build/output-sha256.txt
            build/turbo-build-pilot/state.bin
            build/turbo-build-qualification/**
            build/cmake-graph-configure.log
            build/cmake-graph-build.log
            build/cmake-graph/compile_commands.json
            build/cmake-graph/.cmake/api/v1/reply/**
            build/cmake-graph/turbo-build-qualification/**
