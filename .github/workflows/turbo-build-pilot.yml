name: TurboBuild pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/turbo-build-pilot.yml'
      - 'pilot/turbo-build/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/turbo-build-pilot.yml'
      - 'pilot/turbo-build/**'

permissions:
  contents: read

concurrency:
  group: salts-turbo-build-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare-standalone-c11:
    name: Compare CMake and TurboBuild output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Salts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up TurboBuild v0.1.0
        id: turbo-build
        uses: qigao/turbo-build/.github/actions/setup-turbo-build@v0.1.0

      - name: Record exact source and compiler
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee build-commit.txt
          cc --version | tee compiler-version.txt
          cmake --version | tee cmake-version.txt
          mkdir -p build/turbo-build-pilot

      - name: Build probe through CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S pilot/turbo-build -B build/cmake-pilot -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake-pilot --parallel 2
          build/cmake-pilot/salts-turbo-build-probe > build/cmake-output.txt

      - name: Validate and build probe through TurboBuild
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.turbo-build.outputs.cli-path }}" validate pilot/turbo-build/buildfile.json
          "${{ steps.turbo-build.outputs.cli-path }}" build --jobs 2 --state build/turbo-build-pilot/state.bin pilot/turbo-build/buildfile.json
          build/turbo-build-pilot/probe > build/turbo-output.txt

      - name: Compare observable output and record hashes
        shell: bash
        run: |
          set -euo pipefail
          diff -u build/cmake-output.txt build/turbo-output.txt
          sha256sum build/cmake-output.txt build/turbo-output.txt | tee build/output-sha256.txt
          test "$(sha256sum build/cmake-output.txt | cut -d ' ' -f1)" = "$(sha256sum build/turbo-output.txt | cut -d ' ' -f1)"
          cat build/output-sha256.txt

      - name: Qualify conservative incremental behavior and failure propagation
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          bash pilot/turbo-build/qualify.sh "$TURBO_BUILD_CLI"

      - name: Configure the real Salts wsparser target with CMake File API
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          mkdir -p build/cmake-graph/.cmake/api/v1/query
          : > build/cmake-graph/.cmake/api/v1/query/codemodel-v2
          cmake -S pilot/turbo-build/cmake-graph -B build/cmake-graph \
            -DSALTS_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee build/cmake-graph-configure.log
          cmake --build build/cmake-graph --target cmeta_wsparser --parallel 2 2>&1 | tee build/cmake-graph-build.log
          python3 pilot/turbo-build/export_cmake_graph.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-dir "$GITHUB_WORKSPACE/build/cmake-graph" \
            --target cmeta_wsparser
          "$TURBO_BUILD_CLI" validate build/cmake-graph/turbo-build-qualification/buildfile.json

      - name: Build the exported CMake compile action through TurboBuild
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          evidence=build/cmake-graph/turbo-build-qualification
          "$TURBO_BUILD_CLI" build --jobs 1 --state "$evidence/state.bin" "$evidence/buildfile.json" 2>&1 | tee "$evidence/turbo-build.log"
          report="$evidence/graph-report.json"
          cmake_object="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["compileCommand"]["originalObject"])' "$report")"
          turbo_object="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["compileCommand"]["turboBuildObject"])' "$report")"
          cmake_hash="$(sha256sum "$cmake_object" | cut -d ' ' -f1)"
          turbo_hash="$(sha256sum "$turbo_object" | cut -d ' ' -f1)"
          {
            printf 'CMake object SHA-256: %s\n' "$cmake_hash"
            printf 'TurboBuild object SHA-256: %s\n' "$turbo_hash"
          } | tee "$evidence/object-sha256.txt"
          test "$cmake_hash" = "$turbo_hash"
          echo "Real Salts target object matches exactly."

      - name: Configure a multi-source Salts platform target from CMake File API
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          mkdir -p build/cmake-platform-graph/.cmake/api/v1/query
          : > build/cmake-platform-graph/.cmake/api/v1/query/codemodel-v2
          cmake -S pilot/turbo-build/cmake-graph/platform -B build/cmake-platform-graph \
            -DSALTS_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee build/cmake-platform-graph-configure.log
          cmake --build build/cmake-platform-graph --target cmeta_platform --parallel 2 2>&1 | tee build/cmake-platform-graph-build.log
          python3 pilot/turbo-build/export_cmake_compile_actions.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-dir "$GITHUB_WORKSPACE/build/cmake-platform-graph" \
            --target cmeta_platform
          python3 pilot/turbo-build/append_cmake_archive_action.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-dir "$GITHUB_WORKSPACE/build/cmake-platform-graph" \
            --target cmeta_platform
          "$TURBO_BUILD_CLI" validate build/cmake-platform-graph/turbo-build-qualification/buildfile.json

      - name: Rebuild Salts platform objects and archive through TurboBuild
        shell: bash
        env:
          TURBO_BUILD_CLI: ${{ steps.turbo-build.outputs.cli-path }}
        run: |
          set -euo pipefail
          evidence=build/cmake-platform-graph/turbo-build-qualification
          "$TURBO_BUILD_CLI" build --jobs 4 --state "$evidence/state.bin" "$evidence/buildfile.json" 2>&1 | tee "$evidence/turbo-build.log"
          grep -F "Build complete: 8 executed, 0 skipped" "$evidence/turbo-build.log"
          # Run the same graph again with the same state file. Because the
          # action completeness declarations remain false, no action may skip.
          # The archive runner must recreate the archive instead of appending.
          "$TURBO_BUILD_CLI" build --jobs 4 --state "$evidence/state.bin" "$evidence/buildfile.json" 2>&1 | tee "$evidence/turbo-build-second-pass.log"
          grep -F "Build complete: 8 executed, 0 skipped" "$evidence/turbo-build-second-pass.log"
          python3 - "$evidence/graph-report.json" "$evidence/object-sha256.txt" <<'PYTHON'
          import hashlib
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          lines = []
          for entry in report["compileCommands"]:
              original = Path(entry["originalObject"])
              rebuilt = Path(entry["turboBuildObject"])
              if not original.is_file() or not rebuilt.is_file():
                  raise SystemExit(f"missing object: CMake={original} TurboBuild={rebuilt}")
              original_hash = hashlib.sha256(original.read_bytes()).hexdigest()
              rebuilt_hash = hashlib.sha256(rebuilt.read_bytes()).hexdigest()
              lines.append(f"{entry['source']}\n  CMake:      {original_hash}\n  TurboBuild: {rebuilt_hash}")
              if original_hash != rebuilt_hash:
                  raise SystemExit(f"object fingerprint mismatch for {entry['source']}")

          archive = report.get("archive")
          if not archive:
              raise SystemExit("exporter did not record archive command metadata")
          cmake_archive = Path(archive["cmakeArchive"])
          turbo_archive = Path(archive["turboBuildArchive"])
          if not cmake_archive.is_file() or not turbo_archive.is_file():
              raise SystemExit(f"missing archive: CMake={cmake_archive} TurboBuild={turbo_archive}")
          cmake_archive_hash = hashlib.sha256(cmake_archive.read_bytes()).hexdigest()
          turbo_archive_hash = hashlib.sha256(turbo_archive.read_bytes()).hexdigest()
          lines.append(f"ARCHIVE {cmake_archive.name}\n  CMake:      {cmake_archive_hash}\n  TurboBuild: {turbo_archive_hash}")
          if cmake_archive_hash != turbo_archive_hash:
              raise SystemExit(f"archive fingerprint mismatch: CMake={cmake_archive_hash} TurboBuild={turbo_archive_hash}")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"All {len(report['compileCommands'])} platform object hashes and the static archive hash match.")
          PYTHON

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salts-turbo-build-pilot-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build-commit.txt
            compiler-version.txt
            cmake-version.txt
            build/cmake-output.txt
            build/turbo-output.txt
            build/output-sha256.txt
            build/turbo-build-pilot/state.bin
            build/turbo-build-qualification/**
            build/cmake-graph-configure.log
            build/cmake-graph-build.log
            build/cmake-graph/compile_commands.json
            build/cmake-graph/.cmake/api/v1/reply/**
            build/cmake-graph/turbo-build-qualification/**
            build/cmake-platform-graph-configure.log
            build/cmake-platform-graph-build.log
            build/cmake-platform-graph/compile_commands.json
            build/cmake-platform-graph/.cmake/api/v1/reply/**
            build/cmake-platform-graph/turbo-build-qualification/**
