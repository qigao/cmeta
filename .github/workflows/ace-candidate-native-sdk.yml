name: Salts.Native ACE 2.3 candidate (Linux x64)

# This workflow is isolated to the unmerged ACE integration branch.
# It builds an immutable SHA-qualified Actions artifact only; never uploads
# incomplete one-RID NuGet packages to the shared public feed (#1089).
# [ACE-VERIFY] validates installed SDK and uploads an artifact without publishing.
# [ACE-CANDIDATE] additionally requires the full host matrix; still no feed publication.
# These markers are exclusive and must be removed after qualification.
'on':
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: salts-ace-candidate-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Qualify exact ACE SDK, Actions artifact only
    if: >-
      github.repository == 'qigao/salts' &&
      github.event.pull_request.head.repo.full_name == 'qigao/salts' &&
      github.event.pull_request.head.ref == 'feature/cmeta-ace-patterns' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft &&
      startsWith(github.event.pull_request.title, 'DO NOT MERGE') &&
      (contains(github.event.pull_request.title, '[ACE-CANDIDATE]') || contains(github.event.pull_request.title, '[ACE-VERIFY]')) &&
      !(contains(github.event.pull_request.title, '[ACE-CANDIDATE]') && contains(github.event.pull_request.title, '[ACE-VERIFY]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the exact unmerged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Gate source, 2.3 version and immutable package ID
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = 'HEAD'
          sdk_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          vcpkg_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["version-semver"])')"
          test "$sdk_version" = '2.3.0'
          test "$vcpkg_version" = "$sdk_version"
          # A SHA prefix avoids an all-numeric SemVer prerelease identifier.
          candidate_version="$sdk_version-ace.sha$SOURCE_SHA"
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "candidate_version=$candidate_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore canonical re2c
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3

      - name: Configure shared vcpkg cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read

      - name: Prepare Linux build host
        uses: ./.github/actions/setup-build-host

      - name: Restore candidate compiler cache
        id: compiler_cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: linux-ace-2.3-candidate

      - name: Configure and build 2.3 SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          # Match the canonical Linux release CI dependency graph exactly.
          # The previous release-linux-ninja + explicit vcpkg override resolved
          # a different GmSSL source and failed TLS framing (1/253 CTests).
          cmake --preset linux-release-ci \
            -DCMAKE_SUPPRESS_REGENERATION=ON -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMETA_BUILD_BENCHMARKS=OFF -DCMETA_BUILD_NATIVE_THUNKS=OFF \
            -DNATIVE_IO_BUILD_BENCHMARKS=OFF \
            -DCOROUTINE_BUILD_BENCHMARKS=OFF -DCNET_BUILD_BENCHMARKS=OFF
          cmake --build build/linux-gcc-release --parallel 2

      - name: Execute complete Linux runtime and ACE contracts
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-gcc-release \
            --no-tests=error --output-on-failure --timeout 90

      - name: Install SDK and verify 2.2 rejection with executable 2.3 consumer
        shell: bash
        env:
          SDK_VERSION: ${{ steps.identity.outputs.sdk_version }}
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/package/sdk/linux-x64"
          cmake --install build/linux-gcc-release --prefix "$prefix"
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/lib/cmake/Salts/SaltsConfigVersion.cmake"
          test -f "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          test -f "$prefix/include/salts/configurator.h"
          test -f "$prefix/include/salts/service_host.h"
          grep -Fq 'Salts::Configurator' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::ServiceHost' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::ComponentProviderABI' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          ! grep -Eq 'add_library\(Salts::Component(Plugin)? ' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          test ! -e "$prefix/include/salts/component.h"
          test ! -e "$prefix/include/salts/component_plugin.h"
          grep -Fq 'set(PACKAGE_VERSION "2.3.0")' "$prefix/lib/cmake/Salts/SaltsConfigVersion.cmake"
          cnet_so="$(find "$prefix" -type f -name 'libcnet.so*' -print -quit)"
          test -n "$cnet_so" || { echo "missing versioned CNet shared library" >&2; exit 1; }
          readelf -d "$cnet_so" | grep -Eq 'SONAME.*libcnet[.]so[.]2[.]3([^0-9]|$)'
          grep -Fq 'SALTS_CONFIGURATOR_CONTEXT_INIT' "$prefix/include/salts/configurator.h"
          grep -Fq 'owner_address' "$prefix/include/salts/service_host.h"

          # This existing out-of-tree fixture rejects find_package(Salts 2.2)
          # and builds/runs a real exact-version Component consumer.
          cmake -S component/tests/package_config/component \
            -B "$RUNNER_TEMP/ace-installed-consumer" \
            "-DCMAKE_PREFIX_PATH=$prefix" \
            "-DSALTS_TEST_PREFIX=$prefix" \
            "-DSALTS_TEST_VERSION=$SDK_VERSION" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE
          cmake --build "$RUNNER_TEMP/ace-installed-consumer" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/ace-installed-consumer" \
            --no-tests=error --output-on-failure

      - name: Attest the source and installed SDK
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.candidate_version }}
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/package/sdk/linux-x64"
          cat > "$prefix/salts-sdk-manifest.txt" <<EOF
          version=$CANDIDATE_VERSION
          commit=$SOURCE_SHA
          rid=linux-x64
          profile=ace-2.3-candidate
          EOF

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack and inspect exact SHA-qualified NuGet artifact
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.candidate_version }}
        run: |
          set -euo pipefail
          dotnet pack packaging/nuget/Salts.Native.csproj \
            --configuration Release --output dist \
            -p:PackageVersion="$CANDIDATE_VERSION" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RepositoryCommit="$SOURCE_SHA"
          nupkg="dist/Salts.Native.$CANDIDATE_VERSION.nupkg"
          test -f "$nupkg"
          python3 - "$nupkg" "$CANDIDATE_VERSION" "$SOURCE_SHA" <<'PY'
          import sys
          import zipfile

          path, version, sha = sys.argv[1:]
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              manifest = 'sdk/linux-x64/salts-sdk-manifest.txt'
              if manifest not in names:
                  raise SystemExit('ACE candidate manifest missing')
              if sorted(name for name in names if name.endswith('/salts-sdk-manifest.txt')) != [manifest]:
                  raise SystemExit('candidate contains unexpected platform manifests')
              actual = dict(
                  line.split('=', 1)
                  for line in archive.read(manifest).decode('utf-8').splitlines()
                  if '=' in line
              )
              expected = dict(
                  version=version, commit=sha, rid='linux-x64',
                  profile='ace-2.3-candidate'
              )
              if actual != expected:
                  raise SystemExit(f'candidate manifest mismatch: {actual!r}')
              required = (
                  'sdk/linux-x64/lib/cmake/Salts/SaltsConfigVersion.cmake',
                  'sdk/linux-x64/lib/cmake/Salts/SaltsTargets.cmake',
                  'sdk/linux-x64/include/salts/configurator.h',
                  'sdk/linux-x64/include/salts/service_host.h'
              )
              for name in required:
                  if name not in names:
                      raise SystemExit(f'missing packaged SDK file: {name}')
          PY
          sha256sum "$nupkg" | tee dist/SHA256SUMS

      - name: Upload attestable prerelease artifact
        uses: actions/upload-artifact@v4
        with:
          name: salts-native-ace-candidate-linux-x64
          path: |
            dist/*.nupkg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Verify successful exact-head full host CI before prerelease publication
        if: contains(github.event.pull_request.title, '[ACE-CANDIDATE]')
        timeout-minutes: 45
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1013" \
            --jq '.title' | grep -Fq '[ACE-MATRIX]'
          full_ci_id=""
          for attempt in $(seq 1 30); do
            full_ci_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&per_page=50" \
              --jq '.workflow_runs | map(select(.event == "pull_request")) | .[0].id // empty')"
            if [ -n "$full_ci_id" ]; then break; fi
            sleep 15
          done
          test -n "$full_ci_id" || { echo "Exact eight-profile CI not found" >&2; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_ci_id" --jq '.head_sha')" = "$SOURCE_SHA"
          gh run watch "$full_ci_id" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
          native_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_ci_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("native / "))] | length')"
          incomplete_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_ci_id/jobs?per_page=100" \
            --jq '[.jobs[] | select((.name | startswith("native / ")) and .conclusion != "success")] | length')"
          test "$native_count" -eq 8 && test "$incomplete_count" -eq 0 || {
            echo "Candidate requires successful Linux, macOS, Windows, ARM and mobile CI on $SOURCE_SHA" >&2
            exit 1
          }
          echo "Candidate source SHA $SOURCE_SHA qualified by eight-profile CI $full_ci_id"

      - name: Record immutable artifact-only result
        if: contains(github.event.pull_request.title, '[ACE-CANDIDATE]')
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.candidate_version }}
        run: |
          set -euo pipefail
          test -f "dist/Salts.Native.$CANDIDATE_VERSION.nupkg"
          {
            echo '### ACE 2.3 integration-only candidate'
            echo "- Source commit: $SOURCE_SHA"
            echo "- NuGet identity: Salts.Native $CANDIDATE_VERSION"
            echo '- RID: linux-x64 only'
            echo '- Artifact archived in this Actions run, never published to GitHub Packages'
            echo '- Full platform/consumer release qualification remains separate'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report ccache compilation statistics
        if: ${{ always() && steps.compiler_cache.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ccache --show-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
