name: CNet SCTP C11 prototype

on:
  push:
    paths:
      - "cnet/sctp/**"
      - ".github/workflows/cnet-sctp-c11.yml"
  pull_request:
    paths:
      - "cnet/sctp/**"
      - ".github/workflows/cnet-sctp-c11.yml"

jobs:
  c11-wire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pure C11 wire module
        shell: bash
        run: |
          cmake -S cnet/sctp -B build-sctp-c11 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sctp-c11 --config Release --parallel 2
          ctest --test-dir build-sctp-c11 -C Release --output-on-failure
      - name: Validate installed C11-only consumer
        shell: bash
        run: |
          cmake --install build-sctp-c11 --config Release --prefix "$PWD/sctp-c11-sdk"
          cmake -S cnet/sctp/tests/installed -B build-sctp-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/sctp-c11-sdk"
          cmake --build build-sctp-consumer --config Release --parallel 2
          ctest --test-dir build-sctp-consumer -C Release --output-on-failure

  sanitizer-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test C11 source with ASan/UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S cnet/sctp -B build-sctp-san -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCNET_SCTP_TEST_OWNER_THREADS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-sctp-san --parallel 2
          ctest --test-dir build-sctp-san --output-on-failure

  tsan-owner-handoff:
    name: C11 Owner lease handoff under effective-source TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and qualify actual pthread Owner handoffs with TSan
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          set -euo pipefail
          # Do not substitute ASan/UBSan or a non-instrumented binary.
          command -v clang-18
          cmake -S cnet/sctp -B build-sctp-tsan -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 \
            -DCNET_SCTP_TEST_OWNER_THREADS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -fPIE" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -pie"
          cmake --build build-sctp-tsan --target cnet_sctp_owner_thread_test --parallel 2
          ctest --test-dir build-sctp-tsan --output-on-failure --repeat until-fail:10 -R cnet_sctp_owner_thread_test

  gmssl-mac-c11:
    name: C11 cookie MAC with pinned GmSSL, no SDK export
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install canonical read-only cached GmSSL
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3
        with:
          mode: read
      - name: Verify GmSSL C11 HMAC isolated prototype with ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VCPKG_ROOT:-}"
          cmake -S cnet/sctp -B build-sctp-gmssl -DBUILD_TESTING=ON \
            -DCNET_SCTP_TEST_GMSSL=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/cnet/sctp/ci/vcpkg-gmssl" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-sctp-gmssl --parallel 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          cmds = json.loads(Path('build-sctp-gmssl/compile_commands.json').read_text())
          first_party = ('sctp_wire.c', 'sctp_assoc.c', 'sctp_init_params.c',
                         'sctp_collision.c', 'sctp_data.c', 'sctp_dcep.c',
                         'sctp_webrtc.c', 'sctp_gmssl_mac.c', 'wire_test.c', 'assoc_test.c',
                         'init_params_test.c', 'collision_test.c', 'data_test.c',
                         'assoc_data_test.c', 'fragment_test.c', 'dcep_test.c',
                         'assoc_gmssl_test.c')
          found = {}
          for entry in cmds:
              src = Path(entry['file']).name
              if src in first_party:
                  command = entry.get('command', ' '.join(entry.get('arguments', [])))
                  assert '-fsanitize=address,undefined' in command, (src, command)
                  assert '/src/' in entry['file'] or '/tests/' in entry['file']
                  found[src] = found.get(src, 0) + 1
                  assert not entry['file'].endswith(('.cc', '.cpp', '.cxx'))
          assert set(found) == set(first_party), (found, first_party)
          print('source-instrumented C11:', found)
          PY
          ctest --test-dir build-sctp-gmssl --output-on-failure --repeat until-fail:10
      - name: Verify installed research Wire package excludes GmSSL and private Association
        shell: bash
        run: |
          set -euo pipefail
          # Release SDK must not inherit the sanitizer instrumentation used
          # only for the source-level MAC/Association stress tests above.
          cmake -S cnet/sctp -B build-sctp-sdk-clean -DBUILD_TESTING=OFF \
            -DCNET_SCTP_TEST_GMSSL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sctp-sdk-clean --parallel 2
          cmake --install build-sctp-sdk-clean --prefix "$RUNNER_TEMP/sctp-wire-only"
          test -f "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_wire.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_assoc_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_init_params_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_collision_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_data_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/lib/libcnet_sctp_data_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/lib/libcnet_sctp_dcep_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_dcep_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_webrtc_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/lib/libcnet_sctp_webrtc_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/include/cnet/sctp_gmssl_mac_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/lib/libcnet_sctp_assoc_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-wire-only/lib/libcnet_sctp_gmssl_mac_proto.a"
          cmake -S cnet/sctp/tests/installed -B build-sctp-consumer \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sctp-wire-only"
          cmake --build build-sctp-consumer --parallel 2
          ctest --test-dir build-sctp-consumer --output-on-failure
