name: CNet SCTP C11 prototype

on:
  push:
    paths:
      - ".github/actions/setup-vcpkg-curl-cache/**"
      - "cmake/ci/github-packages.py"
      - "cmake/ci/restore-vcpkg-cache.py"
      - "cmake/ci/setup-vcpkg-curl-cache.py"
      - "cnet/sctp/**"
      - ".github/workflows/cnet-sctp-c11.yml"
  pull_request:
    paths:
      - ".github/actions/setup-vcpkg-curl-cache/**"
      - "cmake/ci/github-packages.py"
      - "cmake/ci/restore-vcpkg-cache.py"
      - "cmake/ci/setup-vcpkg-curl-cache.py"
      - "cnet/sctp/**"
      - ".github/workflows/cnet-sctp-c11.yml"

permissions:
  contents: read
  packages: read

jobs:
  c11-wire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The installed-SDK qualification must be tied to the immutable
          # original PR HEAD, not a moving merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build pure C11 wire module
        shell: bash
        run: |
          cmake -S cnet/sctp -B build-sctp-c11 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sctp-c11 --config Release --parallel 2
          ctest --test-dir build-sctp-c11 -C Release --output-on-failure
      - name: Validate installed C11-only consumer
        shell: bash
        run: |
          cmake --install build-sctp-c11 --config Release --prefix "$PWD/sctp-c11-sdk"
          cmake -S cnet/sctp/tests/installed -B build-sctp-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/sctp-c11-sdk"
          cmake --build build-sctp-consumer --config Release --parallel 2
          ctest --test-dir build-sctp-consumer -C Release --output-on-failure

  # M5 test-only installed opaque C11 SDK cross builds. Android and iOS
  # executables are linked as real device binaries, but NOT run on a host.
  # This is not production Salts packaging, DTLS/browser interoperability,
  # an on-device runtime PASS, or six-RID release approval.
  c11-sdk-android-arm64:
    name: Installed C11 Session Android arm64 (cross-compile + link only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cross-compile separate Android arm64 Session SDK and consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          test -n "$ndk"
          toolchain="$ndk/build/cmake/android.toolchain.cmake"
          test -f "$toolchain"
          prefix="$GITHUB_WORKSPACE/sctp-c11-sdk-android-arm64-v8a"
          cmake -S cnet/sctp -B build-sctp-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCNET_SCTP_TEST_GMSSL=OFF
          cmake --build build-sctp-android-arm64 --parallel 2
          cmake --install build-sctp-android-arm64 --prefix "$prefix"
          test -f "$prefix/include/cnet/sctp_session.h"
          test -f "$prefix/lib/libcnet_sctp_session.a"
          test -f "$prefix/lib/cmake/CNetSctpPrototype/CNetSctpPrototypeTargets.cmake"
          test ! -e "$prefix/include/cnet/sctp_assoc_internal.h"
          test ! -e "$prefix/include/cnet/sctp_session_internal.h"
          test ! -e "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          cmake -S cnet/sctp/tests/installed -B build-sctp-consumer-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" \
            -DCNetSctpPrototype_DIR="$prefix/lib/cmake/CNetSctpPrototype" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
          cmake --build build-sctp-consumer-android-arm64 --parallel 2
          test -f build-sctp-consumer-android-arm64/cnet_sctp_installed_consumer
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          "$readelf" -h build-sctp-android-arm64/CMakeFiles/cnet_sctp_session.dir/src/sctp_session.c.o | grep -F AArch64
          "$readelf" -h build-sctp-consumer-android-arm64/cnet_sctp_installed_consumer | grep -F AArch64
          echo "Android arm64-v8a installed opaque C11 Session compiled and linked; NO device execution."

  c11-sdk-ios-arm64:
    name: Installed C11 Session iOS arm64 (cross-compile + link only)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cross-compile separate iOS arm64 Session SDK and consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk"
          prefix="$GITHUB_WORKSPACE/sctp-c11-sdk-ios-arm64"
          cmake -S cnet/sctp -B build-sctp-ios-arm64 \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCNET_SCTP_TEST_GMSSL=OFF
          cmake --build build-sctp-ios-arm64 --parallel 2
          cmake --install build-sctp-ios-arm64 --prefix "$prefix"
          test -f "$prefix/include/cnet/sctp_session.h"
          test -f "$prefix/lib/libcnet_sctp_session.a"
          test -f "$prefix/lib/cmake/CNetSctpPrototype/CNetSctpPrototypeTargets.cmake"
          test ! -e "$prefix/include/cnet/sctp_assoc_internal.h"
          test ! -e "$prefix/include/cnet/sctp_session_internal.h"
          test ! -e "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          cmake -S cnet/sctp/tests/installed -B build-sctp-consumer-ios-arm64 \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" \
            -DCNetSctpPrototype_DIR="$prefix/lib/cmake/CNetSctpPrototype" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
          cmake --build build-sctp-consumer-ios-arm64 --parallel 2
          # On iOS, CMake places executable targets inside a .app bundle;
          # checking the Unix flat path incorrectly rejects a valid link.
          ios_consumer="build-sctp-consumer-ios-arm64/cnet_sctp_installed_consumer.app/cnet_sctp_installed_consumer"
          test -f "$ios_consumer"
          xcrun lipo -archs "$prefix/lib/libcnet_sctp_session.a" | grep -w arm64
          xcrun lipo -archs "$ios_consumer" | grep -w arm64
          echo "iOS arm64 installed opaque C11 Session compiled and linked; NO device execution."

  pion-independent-rfc8260:
    name: Independent Pion RFC8260 recovery over UDP and real DTLS 1.2 (test-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Qualify independent pinned Go SCTP peer against C11 opaque Session
        shell: bash
        env:
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cmake -S cnet/sctp -B build-sctp-pion-oracle \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCNET_SCTP_TEST_PION_ORACLE=ON -DCNET_SCTP_TEST_GMSSL=OFF
          cmake --build build-sctp-pion-oracle \
            --target cnet_sctp_pion_oracle_peer --parallel 2
          cd cnet/sctp/tests/independent/pion
          test "$(go list -m -mod=mod -f '{{.Version}}' github.com/pion/sctp)" = "v1.10.0"
          go build -mod=mod -o "$RUNNER_TEMP/pion-independent-oracle" .
          timeout 35s "$RUNNER_TEMP/pion-independent-oracle" \
            "$GITHUB_WORKSPACE/build-sctp-pion-oracle/cnet_sctp_pion_oracle_peer"
          timeout 35s "$RUNNER_TEMP/pion-independent-oracle" \
            "$GITHUB_WORKSPACE/build-sctp-pion-oracle/cnet_sctp_pion_oracle_peer" \
            drop-first-iforward
          # Real independently implemented DTLS 1.2 between Pion DTLS v3
          # and OpenSSL; the SAME two RFC8260 packet-loss tests must pass.
          timeout 35s "$RUNNER_TEMP/pion-independent-oracle" \
            "$GITHUB_WORKSPACE/build-sctp-pion-oracle/cnet_sctp_pion_oracle_peer" \
            dtls
          timeout 35s "$RUNNER_TEMP/pion-independent-oracle" \
            "$GITHUB_WORKSPACE/build-sctp-pion-oracle/cnet_sctp_pion_oracle_peer" \
            dtls drop-first-iforward
          go mod verify

  dtls-opaque-installed-session:
    name: Real DTLS 1.2 encrypted records through installed C11 Session
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build standalone public-only Session consumer using real OpenSSL DTLS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          openssl version
          prefix="$GITHUB_WORKSPACE/sctp-c11-dtls-isolated-sdk"
          cmake -S cnet/sctp -B build-sctp-dtls-sdk \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
            -DCNET_SCTP_TEST_GMSSL=OFF
          cmake --build build-sctp-dtls-sdk --parallel 2
          cmake --install build-sctp-dtls-sdk --prefix "$prefix"
          test -f "$prefix/include/cnet/sctp_session.h"
          test ! -e "$prefix/include/cnet/sctp_assoc_internal.h"
          test ! -e "$prefix/include/cnet/sctp_session_internal.h"
          test -f "$prefix/lib/cmake/CNetSctpPrototype/CNetSctpPrototypeTargets.cmake"
          cmake -S cnet/sctp/tests/independent/dtls \
            -B build-sctp-dtls-opaque-consumer \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-sctp-dtls-opaque-consumer --parallel 2
          timeout 20s ctest --test-dir build-sctp-dtls-opaque-consumer \
            --output-on-failure --verbose
          echo "Test-only real DTLS 1.2 and installed opaque C11 Session qualified; NOT independent browser/ICE or production Owner."

  dtls-opaque-asan-ubsan:
    name: Real DTLS installed Session with effective-source ASan/UBSan (10x)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify actual C11 installed Session and DTLS consumer under ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          command -v clang-18
          prefix="$GITHUB_WORKSPACE/sctp-c11-dtls-san-sdk"
          common="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S cnet/sctp -B build-sctp-dtls-san-sdk \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_C_FLAGS="$common" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=OFF -DCNET_SCTP_TEST_GMSSL=OFF
          cmake --build build-sctp-dtls-san-sdk --parallel 2
          cmake --install build-sctp-dtls-san-sdk --prefix "$prefix"
          cmake -S cnet/sctp/tests/independent/dtls \
            -B build-sctp-dtls-san-consumer \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_C_FLAGS="$common" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-sctp-dtls-san-consumer --parallel 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = [
              Path('build-sctp-dtls-san-sdk/compile_commands.json'),
              Path('build-sctp-dtls-san-consumer/compile_commands.json'),
          ]
          required = {
              'sctp_session.c', 'sctp_assoc.c', 'sctp_data.c',
              'sctp_wire.c', 'sctp_init_params.c', 'sctp_collision.c',
              'sctp_dcep.c', 'sctp_webrtc.c', 'dtls_records.c',
          }
          seen = set()
          for path in files:
              for entry in json.loads(path.read_text()):
                  name = Path(entry['file']).name
                  if name not in required: continue
                  command = entry.get('command', ' '.join(entry.get('arguments', [])))
                  assert '-fsanitize=address,undefined' in command, (name, command)
                  assert '-fno-omit-frame-pointer' in command, (name, command)
                  seen.add(name)
          assert seen == required, (sorted(seen), sorted(required))
          print('DTLS opaque effective-source ASan+UBSan:', sorted(seen))
          PY
          ctest --test-dir build-sctp-dtls-san-consumer \
            --output-on-failure --repeat until-fail:10

  sanitizer-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and test C11 source with ASan/UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S cnet/sctp -B build-sctp-san -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCNET_SCTP_TEST_OWNER_THREADS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-sctp-san --parallel 2
          ctest --test-dir build-sctp-san --output-on-failure

  tsan-owner-handoff:
    name: C11 Owner lease handoff under effective-source TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build and qualify actual pthread Owner handoffs with TSan
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          set -euo pipefail
          # Do not substitute ASan/UBSan or a non-instrumented binary.
          command -v clang-18
          cmake -S cnet/sctp -B build-sctp-tsan -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCNET_SCTP_TEST_OWNER_THREADS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -fPIE" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -pie"
          cmake --build build-sctp-tsan --target cnet_sctp_owner_thread_test cnet_sctp_provider_dso_test cnet_sctp_session_test --parallel 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          entries = json.loads(Path('build-sctp-tsan/compile_commands.json').read_text())
          required = {'sctp_wire.c', 'sctp_assoc.c', 'sctp_data.c',
                      'sctp_init_params.c', 'sctp_collision.c',
                      'sctp_dcep.c', 'sctp_webrtc.c', 'sctp_session.c',
                      'session_test.c',
                      'owner_thread_test.c', 'provider_dso_test.c',
                      'provider_dso_fixture.c'}
          found = set()
          for entry in entries:
              name = Path(entry['file']).name
              if name not in required:
                  continue
              command = entry.get('command', ' '.join(entry.get('arguments', [])))
              assert '-fsanitize=thread' in command, (name, command)
              assert '-fPIE' in command, (name, command)
              assert entry['file'].endswith('.c'), entry['file']
              found.add(name)
          assert found == required, (found, required)
          print('TSan source instrumentation:', ', '.join(sorted(found)))
          PY
          ctest --test-dir build-sctp-tsan --output-on-failure --repeat until-fail:10 -R 'cnet_sctp_(owner_thread|provider_dso|session)_test'

  gmssl-mac-c11:
    name: C11 cookie MAC with pinned GmSSL, no SDK export
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure pinned vcpkg and restore re2c with curl
        uses: ./.github/actions/setup-vcpkg-curl-cache
      - name: Restore exact GmSSL manifest packages with curl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 cmake/ci/restore-vcpkg-cache.py manifest \
            "$GITHUB_WORKSPACE/cnet/sctp/ci/vcpkg-gmssl" \
            --triplet x64-linux --host-triplet x64-linux \
            --label sctp-gmssl
      - name: Verify GmSSL C11 HMAC isolated prototype with ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VCPKG_ROOT:-}"
          cmake -S cnet/sctp -B build-sctp-gmssl -DBUILD_TESTING=ON \
            -DCNET_SCTP_TEST_GMSSL=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/cnet/sctp/ci/vcpkg-gmssl" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-sctp-gmssl --parallel 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          cmds = json.loads(Path('build-sctp-gmssl/compile_commands.json').read_text())
          first_party = ('sctp_wire.c', 'sctp_assoc.c', 'sctp_init_params.c',
                         'sctp_collision.c', 'sctp_data.c', 'sctp_dcep.c',
                         'sctp_webrtc.c', 'sctp_session.c', 'sctp_gmssl_mac.c',
                         'wire_test.c', 'assoc_test.c',
                         'init_params_test.c', 'collision_test.c', 'data_test.c',
                         'assoc_data_test.c', 'fragment_test.c', 'dcep_test.c',
                         'session_test.c', 'assoc_gmssl_test.c')
          found = {}
          for entry in cmds:
              src = Path(entry['file']).name
              if src in first_party:
                  command = entry.get('command', ' '.join(entry.get('arguments', [])))
                  assert '-fsanitize=address,undefined' in command, (src, command)
                  assert '/src/' in entry['file'] or '/tests/' in entry['file']
                  found[src] = found.get(src, 0) + 1
                  assert not entry['file'].endswith(('.cc', '.cpp', '.cxx'))
          assert set(found) == set(first_party), (found, first_party)
          print('source-instrumented C11:', found)
          PY
          ctest --test-dir build-sctp-gmssl --output-on-failure --repeat until-fail:10
      - name: Verify installed opaque Session package excludes provider and layouts
        shell: bash
        run: |
          set -euo pipefail
          # Release SDK must not inherit the sanitizer instrumentation used
          # only for the source-level MAC/Association stress tests above.
          cmake -S cnet/sctp -B build-sctp-sdk-clean -DBUILD_TESTING=OFF \
            -DCNET_SCTP_TEST_GMSSL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sctp-sdk-clean --parallel 2
          cmake --install build-sctp-sdk-clean --prefix "$RUNNER_TEMP/sctp-sdk"
          test -f "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_wire.h"
          test -f "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_session.h"
          test -f "$RUNNER_TEMP/sctp-sdk/lib/libcnet_sctp_session.a"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_assoc_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_init_params_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_collision_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_data_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/lib/libcnet_sctp_data_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-sdk/lib/libcnet_sctp_dcep_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_dcep_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_webrtc_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/lib/libcnet_sctp_webrtc_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_session_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/lib/libcnet_sctp_session_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-sdk/include/cnet/sctp_gmssl_mac_internal.h"
          test ! -e "$RUNNER_TEMP/sctp-sdk/lib/libcnet_sctp_assoc_proto.a"
          test ! -e "$RUNNER_TEMP/sctp-sdk/lib/libcnet_sctp_gmssl_mac_proto.a"
          cmake -S cnet/sctp/tests/installed -B build-sctp-consumer \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sctp-sdk"
          cmake --build build-sctp-consumer --parallel 2
          ctest --test-dir build-sctp-consumer --output-on-failure
