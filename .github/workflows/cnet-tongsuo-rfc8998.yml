name: CNet independent RFC8998 interop

'on':
  pull_request:
    paths:
      - 'cnet/tests/interop/**'
      - '.github/workflows/cnet-tongsuo-rfc8998.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cnet-rfc8998-tongsuo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tongsuo-strict-preflight:
    name: Strict Tongsuo/GmSSL cross-provider wire preflight (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TONGSUO_REF: 80cfbe3eb194a4d30da90742273c305ad4d096be
      GMSSL_SOURCE_REF: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch exact independent implementations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rfc8998"
          cd "$RUNNER_TEMP/rfc8998"
          git init -q tongsuo
          git -C tongsuo remote add origin https://github.com/Tongsuo-Project/Tongsuo.git
          git -C tongsuo -c protocol.version=2 fetch -q --depth 1 origin "$TONGSUO_REF"
          git -C tongsuo checkout -q --detach FETCH_HEAD
          test "$(git -C tongsuo rev-parse HEAD)" = "$TONGSUO_REF"
          git init -q gmssl
          git -C gmssl remote add origin https://github.com/guanzhi/GmSSL.git
          git -C gmssl -c protocol.version=2 fetch -q --depth 1 origin "$GMSSL_SOURCE_REF"
          git -C gmssl checkout -q --detach FETCH_HEAD
          test "$(git -C gmssl rev-parse HEAD)" = "$GMSSL_SOURCE_REF"
          printf 'Tongsuo SHA: %s\nGmSSL source SHA: %s\n' "$TONGSUO_REF" "$GMSSL_SOURCE_REF"
      - name: Build independent Tongsuo test-only binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rfc8998/tongsuo"
          ./config no-shared no-tests no-ssl3 no-weak-ssl-ciphers
          # The direct apps/openssl target skips the upstream generated-header
          # dependency graph (OPENSSL_API_COMPAT and provider headers break).
          # Use Tongsuo's canonical whole-build DAG; no handcrafted headers.
          make -j 2
          test -x apps/openssl
          apps/openssl version
          apps/openssl s_server -help 2>&1 | grep -Fq -- '-enable_sm_tls13_strict'
          apps/openssl s_client -help 2>&1 | grep -Fq -- '-enable_sm_tls13_strict'
      - name: Build pinned GmSSL upstream protocol reference CLI
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/rfc8998/gmssl" \
                -B "$RUNNER_TEMP/rfc8998/gmssl-build" \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_TLS=ON -DENABLE_SM9=OFF -DENABLE_CMS=OFF \
                -DENABLE_LMS=OFF -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF \
                -DENABLE_KYBER=OFF -DENABLE_ZUC=OFF
          cmake --build "$RUNNER_TEMP/rfc8998/gmssl-build" --parallel 2
          test -x "$RUNNER_TEMP/rfc8998/gmssl-build/bin/gmssl"
          # The private GmSSL fixture uses SM3-PBKDF2 PKCS8 encryption, not
          # supported by independent Tongsuo. Decode only an ephemeral key
          # and emit standard unencrypted PKCS8 with the same SM2 identity.
          cc -std=c11 -O2 -Wall -Wextra             -I "$RUNNER_TEMP/rfc8998/gmssl/include"             cnet/tests/interop/gmssl_fixture_pkcs8_convert.c             -L "$RUNNER_TEMP/rfc8998/gmssl-build/bin" -lgmssl             -Wl,-rpath,"$RUNNER_TEMP/rfc8998/gmssl-build/bin"             -o "$RUNNER_TEMP/rfc8998/gmssl-key-convert"
          test -x "$RUNNER_TEMP/rfc8998/gmssl-key-convert"
      - name: Restore shared re2c tools for native CNet consumer
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - name: Configure exact Salts private-GmSSL candidate cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Checkout exact Draft GmSSL provider alert fix (test-only)
        uses: actions/checkout@v7
        with:
          repository: qigao/vcpkg-cache
          ref: 61aa0392629b6e5cadbdf80152cb2d6fb858942b
          path: .ci-provider-overlay
          persist-credentials: false
      - name: Verify exact provider overlay source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci-provider-overlay rev-parse HEAD)" = "61aa0392629b6e5cadbdf80152cb2d6fb858942b"
          test -f .ci-provider-overlay/ports/gmssl/tls13-fatal-alert.cmake
      - name: Prepare native CNet build toolchain
        uses: ./.github/actions/setup-build-host
      - name: Compile public CNet NativeIO strict-TLS client probe
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release-ci \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/.ci-provider-overlay/ports" \
            -DENABLE_TESTS=ON -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMETA_BUILD_BENCHMARKS=OFF \
            -DNATIVE_IO_BUILD_BENCHMARKS=OFF \
            -DCNET_BUILD_BENCHMARKS=OFF
          cmake --build --preset linux-release-ci \
            --target cnet_tongsuo_strict_client_probe \
                     cnet_tongsuo_strict_server_probe \
                     cnet_shangmi_tls13_profile_probe --parallel 2
          test -x "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_client_probe"
          test -x "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_server_probe"
      - name: Prove provider fatal alert in CNet ring before NativeIO teardown
        shell: bash
        run: |
          set -euo pipefail
          python3 cnet/tests/verify_gmssl_shangmi_tls13.py \
            --gmssl "$RUNNER_TEMP/rfc8998/gmssl-build/bin/gmssl" \
            --cnet-probe "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_shangmi_tls13_profile_probe"
      - name: Exercise both RFC8998 wire directions with strict SM2 policy
        shell: bash
        run: |
          set -euo pipefail
          python3 cnet/tests/interop/verify_tongsuo_rfc8998.py \
            --tongsuo "$RUNNER_TEMP/rfc8998/tongsuo/apps/openssl" \
            --gmssl "$RUNNER_TEMP/rfc8998/gmssl-build/bin/gmssl" \
            --fixture-key-converter "$RUNNER_TEMP/rfc8998/gmssl-key-convert" \
            --cnet-client "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_client_probe" \
            --cnet-server "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_server_probe"
      - name: Reject untrusted CA and DNS identities in both public NativeIO directions
        shell: bash
        run: |
          set -euo pipefail
          python3 cnet/tests/interop/verify_tongsuo_rfc8998_negatives.py \
            --tongsuo "$RUNNER_TEMP/rfc8998/tongsuo/apps/openssl" \
            --gmssl "$RUNNER_TEMP/rfc8998/gmssl-build/bin/gmssl" \
            --fixture-key-converter "$RUNNER_TEMP/rfc8998/gmssl-key-convert" \
            --cnet-client "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_client_probe" \
            --cnet-server "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_server_probe"
      - name: Refuse standard TLS cipher and TLS12 downgrade on both independent peers
        shell: bash
        run: |
          set -euo pipefail
          python3 cnet/tests/interop/verify_tongsuo_rfc8998_downgrade.py \
            --tongsuo "$RUNNER_TEMP/rfc8998/tongsuo/apps/openssl" \
            --gmssl "$RUNNER_TEMP/rfc8998/gmssl-build/bin/gmssl" \
            --fixture-key-converter "$RUNNER_TEMP/rfc8998/gmssl-key-convert" \
            --cnet-client "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_client_probe" \
            --cnet-server "$GITHUB_WORKSPACE/build/linux-gcc-release/bin/cnet_tongsuo_strict_server_probe"
      - name: Record explicit qualification limit
        if: always()
        shell: bash
        run: |
          echo "Independent Tongsuo-vs-GmSSL provider CLI wire preflight only."
          echo "Public CNet client -> Tongsuo gate is reported by the exact-head interop script."
          echo "Public CNet NativeIO client and server strict peer directions are"
          echo "qualified only if this run's exact-head interoperability step PASS."
          echo "No provider fallback, SDK release, or TLCP claim."
