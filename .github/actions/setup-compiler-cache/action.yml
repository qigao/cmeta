name: Set up native compiler cache
description: Configure ccache for C/C++ builds on Windows, Linux and macOS.

inputs:
  profile:
    description: Native matrix profile; isolates compiler, architecture and configuration.
    required: true

runs:
  using: composite
  steps:
    - name: Install ccache on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ccache

    - name: Install ccache on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install ccache

    - name: Install ccache on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        choco install ccache --yes --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Configure ccache launcher and storage
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ccache = (Get-Command ccache -ErrorAction Stop).Source
        & $ccache --version
        if ($LASTEXITCODE -ne 0) { throw "ccache is unavailable" }
        "CCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'salts-compiler-cache')" >> $env:GITHUB_ENV
        "CCACHE_MAXSIZE=512M" >> $env:GITHUB_ENV
        "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV
        "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
        if ($env:RUNNER_OS -eq "Windows") {
          # MSVC can use ccache's manifest-based direct mode.  Forcing
          # NODIRECT makes every cache hit run cl.exe /E first.
          "CCACHE_NODIRECT=false" >> $env:GITHUB_ENV
          "CCACHE_COMPILERTYPE=msvc" >> $env:GITHUB_ENV
        } else {
          # Preserve the previously qualified non-Windows cache policy.
          "CCACHE_NODIRECT=true" >> $env:GITHUB_ENV
        }
        "CMAKE_C_COMPILER_LAUNCHER=$ccache" >> $env:GITHUB_ENV
        "CMAKE_CXX_COMPILER_LAUNCHER=$ccache" >> $env:GITHUB_ENV

    - name: Restore ccache compiler objects
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/salts-compiler-cache
        key: salts-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ env.VCPKG_CACHE_CONTRACT_VERSION }}-${{ env.VCPKG_CACHE_REVISION }}-${{ hashFiles('CMakeUserPresets.json', 'presets/*.json', 'CMakeOptions.cmake', 'cmake/Sanitizers.cmake', 'vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          salts-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ env.VCPKG_CACHE_CONTRACT_VERSION }}-${{ env.VCPKG_CACHE_REVISION }}-${{ hashFiles('CMakeUserPresets.json', 'presets/*.json', 'CMakeOptions.cmake', 'cmake/Sanitizers.cmake', 'vcpkg.json', 'vcpkg-configuration.json') }}-

    - name: Reset restored MSVC cache counters for this job
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        ccache --zero-stats
        if ($LASTEXITCODE -ne 0) { throw "Failed to reset MSVC ccache stats" }

    - name: Report ccache statistics
      if: always()
      shell: pwsh
      run: |
        $ccache = Get-Command ccache -ErrorAction SilentlyContinue
        if ($ccache) { & $ccache.Source --show-stats }
