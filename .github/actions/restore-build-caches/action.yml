name: Restore CMeta build caches
description: Restore vcpkg downloads/binaries and native compiler results for one CI profile.
inputs:
  profile:
    description: Isolated SDK RID or sanitizer profile.
    required: true
  compiler-version:
    description: Pinned Windows compiler version; runner image identifies native tools.
    default: ""
outputs:
  dependency-key:
    value: ${{ steps.dependencies.outputs.cache-primary-key }}
    description: Dependency cache save key.
  dependency-hit:
    value: ${{ steps.dependencies.outputs.cache-hit }}
    description: Exact dependency cache hit.
  compiler-key:
    value: ${{ steps.compiler.outputs.cache-primary-key }}
    description: Compiler cache save key.
  compiler-hit:
    value: ${{ steps.compiler.outputs.cache-hit }}
    description: Exact compiler cache hit.
runs:
  using: composite
  steps:
    - uses: qigao/vcpkg-cache/.github/actions/setup-ccache@77b084421712ed24e1ce6f223d296efb5c3cd273
      id: ccache
    - name: Prepare cache paths and runner identity
      id: paths
      shell: pwsh
      run: |
        "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
        "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
        "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
    - uses: actions/cache/restore@v4
      id: dependencies
      with:
        path: |
          ${{ env.VCPKG_BINARY_CACHE }}
          ${{ env.VCPKG_DOWNLOADS }}
        key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ env.VCPKG_CACHE_REVISION }}-${{ steps.paths.outputs.image }}-${{ inputs.compiler-version }}-${{ hashFiles('CMake*Presets.json', '_core_owner/vcpkg*.json', '_core_owner/CMake*Presets.json', '_core_owner/CMakeOptions.cmake', '.github/workflows/native-*.yml', '.github/actions/**') }}
        restore-keys: |
          vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ env.VCPKG_CACHE_REVISION }}-
    - uses: actions/cache/restore@v4
      id: compiler
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ steps.ccache.outputs.version }}-${{ steps.dependencies.outputs.cache-primary-key }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ steps.ccache.outputs.version }}-${{ steps.dependencies.outputs.cache-primary-key }}-
    - name: Start compiler cache statistics
      shell: bash
      run: |
        ccache --version
        ccache --zero-stats
